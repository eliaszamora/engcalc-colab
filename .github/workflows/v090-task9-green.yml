name: EngCalc 0.9.0 Task 9 GREEN

on:
  push:
    branches:
      - feature/v0.9.0-matrix-cas
    paths:
      - .github/workflows/v090-task9-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.9.0-matrix-cas
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e '.[dev]' ipython
      - name: Apply Task 9 candidate
        run: python .github/scripts/v090_task9_apply.py
      - name: Validate candidate patch
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q src/engcalc_colab
          git diff --check
          test "$(git diff --name-only | sort)" = $'README.md\nsrc/engcalc_colab/engine.py'
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Task 9 focused GREEN
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/test_matrix_acceptance.py tests/test_matrix_integration.py tests/test_matrix_diagnostics.py -q 2>&1 | tee task9-focused.log
      - name: Matrix CAS acceptance GREEN
        shell: bash
        run: |
          set -o pipefail
          python -m pytest \
            tests/test_matrix_parser.py \
            tests/test_matrix_symbolic.py \
            tests/test_matrix_indexing.py \
            tests/test_matrix_functions.py \
            tests/test_matrix_user_functions.py \
            tests/test_matrix_calculus.py \
            tests/test_matrix_numeric.py \
            tests/test_matrix_partial_numeric.py \
            tests/test_matrix_solve.py \
            tests/test_matrix_analysis.py \
            tests/test_matrix_analysis_units.py \
            tests/test_matrix_renderer.py \
            tests/test_matrix_magic.py \
            tests/test_matrix_acceptance.py \
            tests/test_matrix_integration.py \
            tests/test_matrix_diagnostics.py -q 2>&1 | tee task9-matrix-acceptance.log
      - name: Full regression GREEN
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee task9-full.log
      - name: Commit implementation
        run: |
          git config user.name "eliaszamora"
          git config user.email "37598447+eliaszamora@users.noreply.github.com"
          git add src/engcalc_colab/engine.py README.md
          git commit -m "feat: integrate EngCalc matrix CAS workflows"
          git push origin HEAD:feature/v0.9.0-matrix-cas
      - uses: actions/upload-artifact@v4
        with:
          name: task9-green-logs
          path: |
            task9-focused.log
            task9-matrix-acceptance.log
            task9-full.log
