name: Apply EngCalc 0.7.2 release version

on:
  push:
    branches:
      - feature/v0.7.2-engineering-tables
    paths:
      - tools/apply_v072_release_version.py
      - .github/workflows/v072-task6-version-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.2-engineering-tables
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply version bump
        run: python tools/apply_v072_release_version.py
      - name: Commit release version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/engcalc_colab/__init__.py README.md
          git diff --cached --quiet && exit 0
          git commit -m "release: bump EngCalc to 0.7.2"
          git push origin HEAD:feature/v0.7.2-engineering-tables
