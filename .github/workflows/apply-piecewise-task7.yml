name: Execute Piecewise Task 7

on:
  push:
    branches:
      - feature/v0.8.0-piecewise
    paths:
      - .github/workflows/apply-piecewise-task7.yml

permissions:
  contents: write

jobs:
  task7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.8.0-piecewise
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install baseline
        run: python -m pip install -e '.[dev]' ipython
      - name: Write Task 7 tests
        run: |
          cat > tests/test_piecewise_calculus.py <<'PY'
          import pytest
          import sympy as sp

          from engcalc_colab.engine import EngineeringEngine
          from engcalc_colab.errors import EngEvaluationError
          from engcalc_colab.models import NumericEvaluationResult
          from engcalc_colab.parser import parse_cell


          def eval_cell(engine, source):
              return [engine.evaluate(statement) for statement in parse_cell(source)]


          def test_piecewise_integral_remains_symbolic_and_is_numerically_evaluable():
              engine = EngineeringEngine()
              results = eval_cell(
                  engine,
                  "q(x) = piecewise(q1, x < a, q2, x <= L, 0)\n"
                  "I = integral(q(x), x, 0, L)\n"
                  "q1 := 8*kN/m\nq2 := 4*kN/m\na := 3*m\nL := 6*m\n"
                  "numeric(I)",
              )
              symbolic = results[1].value
              numeric = results[-1]
              assert symbolic.has(sp.Piecewise) or symbolic.has(sp.Min) or symbolic.has(sp.Max)
              assert isinstance(numeric, NumericEvaluationResult)
              assert numeric.quantity.to("kN").magnitude == pytest.approx(36.0)


          def test_piecewise_derivative_evaluates_branchwise_away_from_breakpoints():
              engine = EngineeringEngine()
              results = eval_cell(
                  engine,
                  "q(x) = piecewise(c1*x^2, x < a, c2*x, x <= L, 0)\n"
                  "dq(x) = diff(q(x), x)\n"
                  "c1 := 2*kN/m^3\nc2 := 5*kN/m^2\na := 3*m\nL := 6*m\n"
                  "numeric(dq(2*m))\nnumeric(dq(4*m))",
              )
              left, right = results[-2:]
              assert left.quantity.to("kN/m^2").magnitude == pytest.approx(8.0)
              assert right.quantity.to("kN/m^2").magnitude == pytest.approx(5.0)
              derivative_expression = engine.functions["dq"].expression
              assert derivative_expression.has(sp.Piecewise)
              assert not derivative_expression.has(sp.DiracDelta)


          @pytest.mark.parametrize("operator", ["<", "<="])
          def test_numeric_piecewise_derivative_is_undefined_at_explicit_breakpoint(operator):
              engine = EngineeringEngine()
              eval_cell(
                  engine,
                  f"q(x) = piecewise(c1*x^2, x {operator} a, c2*x, x <= L, 0)\n"
                  "dq(x) = diff(q(x), x)\n"
                  "c1 := 2*kN/m^3\nc2 := 5*kN/m^2\na := 3*m\nL := 6*m",
              )
              with pytest.raises(
                  EngEvaluationError,
                  match=r"derivative.*undefined.*Piecewise breakpoint.*3",
              ):
                  eval_cell(engine, "numeric(dq(3*m))")


          def test_ordinary_piecewise_numeric_still_owns_its_breakpoint():
              engine = EngineeringEngine()
              results = eval_cell(
                  engine,
                  "q(x) = piecewise(q1, x < a, q2, x <= L, 0)\n"
                  "q1 := 8*kN/m\nq2 := 4*kN/m\na := 3*m\nL := 6*m\n"
                  "numeric(q(3*m))",
              )
              assert results[-1].quantity.to("kN/m").magnitude == pytest.approx(4.0)
          PY
      - name: Verify Task 7 RED
        run: |
          set +e
          python -m pytest tests/test_piecewise_calculus.py -q
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Task 7 tests unexpectedly passed before implementation"
            exit 1
          fi
          echo "TASK7_RED_CONFIRMED exit=$status"
      - name: Implement derivative breakpoint metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/engcalc_colab/models.py')
          text = path.read_text()
          text = text.replace(
              '''class UserFunction:\n    parameters: tuple[str, ...]\n    expression: Any\n''',
              '''class UserFunction:\n    parameters: tuple[str, ...]\n    expression: Any\n    derivative_variable: str | None = None\n    derivative_breakpoints: tuple[Any, ...] = ()\n''',
              1,
          )
          old = '''        expression: Any = None,\n        *,\n        parameter: str | None = None,\n'''
          new = '''        expression: Any = None,\n        derivative_variable: str | None = None,\n        derivative_breakpoints: tuple[Any, ...] = (),\n        *,\n        parameter: str | None = None,\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''        object.__setattr__(self, "parameters", normalized)\n        object.__setattr__(self, "expression", expression)\n'''
          new = '''        object.__setattr__(self, "parameters", normalized)\n        object.__setattr__(self, "expression", expression)\n        object.__setattr__(self, "derivative_variable", derivative_variable)\n        object.__setattr__(self, "derivative_breakpoints", tuple(derivative_breakpoints))\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))

          path = Path('src/engcalc_colab/engine.py')
          text = path.read_text()
          text = text.replace(
              'from .piecewise import build_piecewise, build_relation\n',
              'from .piecewise import build_piecewise, build_relation, extract_symbolic_breakpoints\n',
              1,
          )
          old = '''        self.table_evaluation: _TableEvaluation | None = None\n        self.symbol_overrides: dict[str, sp.Symbol] = {}\n'''
          new = '''        self.table_evaluation: _TableEvaluation | None = None\n        self.symbol_overrides: dict[str, sp.Symbol] = {}\n        self.derivative_variable: str | None = None\n        self.derivative_breakpoints: tuple[object, ...] = ()\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''                    self.functions[statement.target] = UserFunction(\n                        parameters=statement.parameters,\n                        expression=value,\n                    )\n'''
          new = '''                    self.functions[statement.target] = UserFunction(\n                        parameters=statement.parameters,\n                        expression=value,\n                        derivative_variable=evaluator.derivative_variable,\n                        derivative_breakpoints=evaluator.derivative_breakpoints,\n                    )\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''        if name == "diff":\n            if len(args) not in (2, 3):\n                raise EngEvaluationError(\n                    "diff expects 2 or 3 arguments: expression, variable[, order]"\n                )\n            expr, var = args[:2]\n            order = int(args[2]) if len(args) == 3 else 1\n            self.display_input = sp.Derivative(expr, (var, order))\n            return sp.diff(expr, var, order)\n'''
          new = '''        if name == "diff":\n            if len(args) not in (2, 3):\n                raise EngEvaluationError(\n                    "diff expects 2 or 3 arguments: expression, variable[, order]"\n                )\n            expr, var = args[:2]\n            order = int(args[2]) if len(args) == 3 else 1\n            self.display_input = sp.Derivative(expr, (var, order))\n            if isinstance(var, sp.Symbol):\n                breakpoints = extract_symbolic_breakpoints(expr, var.name)\n                if breakpoints:\n                    self.derivative_variable = var.name\n                    self.derivative_breakpoints = breakpoints\n            return sp.diff(expr, var, order)\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Implement breakpoint numeric guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/engcalc_colab/numeric.py')
          text = path.read_text()
          anchor = '''    def partial_substitutions(\n'''
          helper = '''    def ensure_not_derivative_breakpoint(\n        self,\n        variable: str,\n        value,\n        breakpoints,\n        overrides: dict[str, Any] | None = None,\n    ) -> None:\n        overrides = dict(overrides or {})\n        value = self._as_quantity(value)\n        for breakpoint_expression in breakpoints:\n            _, breakpoint = self.evaluate_symbolic(\n                sp.sympify(breakpoint_expression),\n                overrides=overrides,\n            )\n            left, right = self._normalize_relation_operands(value, breakpoint)\n            if math.isclose(\n                float(left.magnitude),\n                float(right.magnitude),\n                rel_tol=1e-12,\n                abs_tol=1e-12,\n            ):\n                unit = f" {right.units:~P}" if not right.dimensionless else ""\n                raise EngEvaluationError(\n                    "derivative is undefined at explicit Piecewise breakpoint "\n                    f"{variable} = {float(right.magnitude):g}{unit}"\n                )\n\n'''
          assert text.count(anchor) == 1
          path.write_text(text.replace(anchor, helper + anchor, 1))

          path = Path('src/engcalc_colab/engine.py')
          text = path.read_text()
          old = '''                else:\n                    overrides = dict(zip(function.parameters, argument_values))\n                try:\n                    substitutions, quantity = self.engine.numeric_context.evaluate_symbolic(\n'''
          new = '''                else:\n                    overrides = dict(zip(function.parameters, argument_values))\n                if (\n                    function.derivative_variable is not None\n                    and function.derivative_breakpoints\n                    and function.derivative_variable in function.parameters\n                ):\n                    derivative_index = function.parameters.index(function.derivative_variable)\n                    self.engine.numeric_context.ensure_not_derivative_breakpoint(\n                        function.derivative_variable,\n                        argument_values[derivative_index],\n                        function.derivative_breakpoints,\n                        overrides=overrides,\n                    )\n                try:\n                    substitutions, quantity = self.engine.numeric_context.evaluate_symbolic(\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY
          python -m py_compile src/engcalc_colab/models.py src/engcalc_colab/numeric.py src/engcalc_colab/engine.py
          git diff --check
      - name: Verify Task 7 focused GREEN
        run: python -m pytest tests/test_piecewise_calculus.py -q
      - name: Verify Task 7 full GREEN
        run: python -m pytest -q
      - name: Commit Task 7
        run: |
          git config user.name "eliaszamora"
          git config user.email "37598447+eliaszamora@users.noreply.github.com"
          git add src/engcalc_colab/models.py src/engcalc_colab/numeric.py src/engcalc_colab/engine.py tests/test_piecewise_calculus.py
          git commit -m "feat: support piecewise calculus workflows"
          git push origin HEAD:feature/v0.8.0-piecewise
