name: EngCalc 0.9.1 Task 11 docs

on:
  push:
    branches:
      - feature/v0.9.1-exact-characteristics

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test environment
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython

      - name: Apply guarded Task 11 README patch
        shell: bash
        run: |
          if grep -q '^## v0.9.1 Exact characteristic analysis' README.md; then
            echo 'Task 11 README section already present; skipping patch.'
          else
            python .github/scripts/v091_task11_docs.py
          fi

      - name: Validate README characteristic contract
        shell: bash
        run: |
          grep -q '### 1. Beam-like moment extrema' README.md
          grep -q '### 2. Shear roots' README.md
          grep -q '### 3. Response-case intersections' README.md
          grep -q '### 4. Piecewise jump is not a false root' README.md
          grep -q '### 5. Indexed matrix scalar analysis' README.md
          grep -q '### 6. Approximate numerical fallback' README.md
          grep -q 'standalone statements' README.md
          grep -q '0.9.2' README.md
          grep -q '≈' README.md
          grep -q 'Current version: \*\*0.9.0\*\*' README.md

      - name: Check diff hygiene
        run: git diff --check

      - name: Re-run Task 11 acceptance examples
        run: python -m pytest tests/test_characteristics_acceptance.py tests/test_characteristics_rendering.py -q

      - name: Commit verified Task 11 README
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo 'No README patch to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: add EngCalc 0.9.1 characteristic examples'
          git push origin HEAD:feature/v0.9.1-exact-characteristics
