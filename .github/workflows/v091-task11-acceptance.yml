name: EngCalc 0.9.1 Task 11 acceptance

on:
  push:
    branches:
      - feature/v0.9.1-exact-characteristics

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test environment
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython

      - name: Apply guarded Task 11 matrix-unit fix
        shell: bash
        run: |
          if grep -q '^def _characteristic_literal_unit_overrides(' src/engcalc_colab/characteristics.py; then
            echo 'Task 11 literal-unit characteristic fix already present; skipping patch.'
          else
            python .github/scripts/v091_task11_matrix_unit_fix.py
          fi

      - name: Check diff hygiene
        run: git diff --check

      - name: Run focused characteristic acceptance set
        run: >-
          python -m pytest
          tests/test_characteristics_parser.py
          tests/test_characteristics_roots.py
          tests/test_characteristics_intersections.py
          tests/test_characteristics_extrema.py
          tests/test_characteristics_piecewise_extrema.py
          tests/test_characteristics_fallback.py
          tests/test_characteristics_rendering.py
          tests/test_characteristics_magic.py
          tests/test_characteristics_plot_integration.py
          tests/test_characteristics_acceptance.py
          -q

      - name: Commit verified Task 11 product correction
        shell: bash
        run: |
          if git diff --quiet -- src/engcalc_colab/characteristics.py; then
            echo 'No Task 11 product correction to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engcalc_colab/characteristics.py
          git commit -m 'fix: resolve unit literals in root characteristics'
          git push origin HEAD:feature/v0.9.1-exact-characteristics
