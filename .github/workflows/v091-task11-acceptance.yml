name: EngCalc 0.9.1 Task 11 acceptance

on:
  push:
    branches:
      - feature/v0.9.1-exact-characteristics

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test environment
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython

      - name: Trace matrix-unit characteristic failure
        run: python .github/scripts/v091_task11_matrix_unit_diag.py

      - name: Run focused characteristic acceptance set
        run: >-
          python -m pytest
          tests/test_characteristics_parser.py
          tests/test_characteristics_roots.py
          tests/test_characteristics_intersections.py
          tests/test_characteristics_extrema.py
          tests/test_characteristics_piecewise_extrema.py
          tests/test_characteristics_fallback.py
          tests/test_characteristics_rendering.py
          tests/test_characteristics_magic.py
          tests/test_characteristics_plot_integration.py
          tests/test_characteristics_acceptance.py
          -q
