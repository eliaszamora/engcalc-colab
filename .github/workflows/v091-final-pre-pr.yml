name: EngCalc 0.9.1 final pre-PR gate

on:
  push:
    branches:
      - feature/v0.9.1-exact-characteristics
    paths:
      - .github/workflows/v091-final-pre-pr.yml

permissions:
  contents: read

jobs:
  final-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test environment
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython

      - name: Verify release tree and cleanup
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/scripts/v091_release_bump.py
          test ! -e .github/scripts/v091_verify_wheel.py
          test ! -e .github/scripts/v091_wheel_smoke.py
          test ! -e .github/workflows/v091-release-validation.yml
          grep -q 'version = "0.9.1"' pyproject.toml
          grep -q '__version__ = "0.9.1"' src/engcalc_colab/__init__.py
          grep -q 'Current version: \*\*0.9.1\*\*' README.md
          python -m compileall -q src/engcalc_colab
          git diff --check origin/main...HEAD

      - name: Run committed release contract
        run: python -m pytest tests/test_version.py tests/test_packaging.py tests/test_parser.py -q

      - name: Run complete source suite
        run: python -m pytest -q
