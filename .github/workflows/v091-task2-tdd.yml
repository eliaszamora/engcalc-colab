name: EngCalc 0.9.1 Task 2 TDD

on:
  push:
    branches:
      - feature/v0.9.1-exact-characteristics

jobs:
  task2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test environment
        run: python -m pip install -e '.[dev]'

      - name: Run Task 2 focused tests when present
        shell: bash
        run: |
          if [[ -f tests/test_characteristics_roots.py ]]; then
            python -m pytest tests/test_characteristics_roots.py -q
          else
            echo 'Task 2 RED test file not present yet; harness ready.'
          fi
