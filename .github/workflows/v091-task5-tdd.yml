name: EngCalc 0.9.1 Task 5 TDD

on:
  push:
    branches:
      - feature/v0.9.1-exact-characteristics

permissions:
  contents: read

jobs:
  task5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test environment
        run: python -m pip install -e '.[dev]'

      - name: Run Task 5 extrema RED tests
        run: python -m pytest tests/test_characteristics_extrema.py -q
