name: EngCalc 0.9.1 Task 5 TDD

on:
  push:
    branches:
      - feature/v0.9.1-exact-characteristics

permissions:
  contents: write

jobs:
  task5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test environment
        run: python -m pip install -e '.[dev]'

      - name: Recheck Task 5 product without reapplying patch
        shell: bash
        run: |
          if grep -q '^def solve_extrema_exact(' src/engcalc_colab/characteristics.py; then
            echo 'Task 5 extrema solver already present; skipping patch.'
          else
            python .github/scripts/v091_task5_green.py
          fi

      - name: Check diff hygiene
        run: git diff --check

      - name: Run Task 5 focused regression gate
        run: >-
          python -m pytest
          tests/test_characteristics_extrema.py
          tests/test_characteristics_roots.py
          tests/test_characteristics_intersections.py
          tests/test_scalar_math_engine.py
          -q

      - name: Commit verified Task 5 product patch
        shell: bash
        run: |
          if git diff --quiet -- src/engcalc_colab/characteristics.py; then
            echo 'No product patch to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engcalc_colab/characteristics.py
          git commit -m 'feat: add exact continuous extrema analysis'
          git push origin HEAD:feature/v0.9.1-exact-characteristics
