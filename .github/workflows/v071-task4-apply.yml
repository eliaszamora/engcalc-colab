name: EngCalc 0.7.1 Task 4 Apply

on:
  push:
    branches:
      - feature/v0.7.1-multiarg-partial-eval

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.1-multiarg-partial-eval
          fetch-depth: 0
      - name: Apply deterministic Task 4 patch
        run: python .github/scripts/apply_v071_task4.py
      - name: Commit product change when needed
        run: |
          if git diff --quiet -- src/engcalc_colab/numeric.py src/engcalc_colab/engine.py; then
            echo "Task 4 product patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engcalc_colab/numeric.py src/engcalc_colab/engine.py
          git commit -m "feat: generalize partial numeric evaluation"
          git push origin HEAD:feature/v0.7.1-multiarg-partial-eval
