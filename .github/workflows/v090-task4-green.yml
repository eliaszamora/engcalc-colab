name: EngCalc 0.9.0 Task 4 GREEN

on:
  push:
    branches:
      - feature/v0.9.0-matrix-cas
    paths:
      - .github/workflows/v090-task4-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.9.0-matrix-cas
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e '.[dev]' ipython
      - name: Apply implementation
        run: python .github/scripts/v090_task4_apply.py
      - name: Validate patch
        run: |
          python -m compileall -q src/engcalc_colab
          git diff --check
      - name: Focused GREEN
        run: python -m pytest tests/test_matrix_user_functions.py tests/test_matrix_calculus.py -q | tee task4-focused.log
      - name: Full regression
        run: python -m pytest -q | tee task4-full.log
      - name: Commit implementation
        run: |
          git config user.name "eliaszamora"
          git config user.email "37598447+eliaszamora@users.noreply.github.com"
          git add src/engcalc_colab/engine.py src/engcalc_colab/matrix_core.py
          git commit -m "feat: support matrix-valued CAS functions"
          git push origin HEAD:feature/v0.9.0-matrix-cas
      - uses: actions/upload-artifact@v4
        with:
          name: task4-green-logs
          path: |
            task4-focused.log
            task4-full.log
