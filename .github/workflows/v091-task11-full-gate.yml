name: EngCalc 0.9.1 Task 11 full gate

on:
  push:
    branches:
      - feature/v0.9.1-exact-characteristics

permissions:
  contents: read

jobs:
  full-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test environment
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython

      - name: Compile package
        run: python -m compileall -q src/engcalc_colab

      - name: Check diff hygiene against main
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD

      - name: Run Task 11 acceptance
        run: python -m pytest tests/test_characteristics_acceptance.py -q

      - name: Run complete source suite
        run: python -m pytest -q
