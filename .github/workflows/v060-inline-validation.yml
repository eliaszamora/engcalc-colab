name: EngCalc 0.6.0 Inline Validation

on:
  push:
    branches:
      - feature/v0.6.0-abs-envelope-panel

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply v0.6.0 README patch
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          readme = Path('README.md')
          text = readme.read_text()
          marker = '## v0.5.0 sampled engineering envelopes\n'
          heading = '## v0.6.0 absolute-value envelopes and in-plot panels\n'
          payload = ''
          if heading not in text:
              if marker not in text:
                  raise SystemExit('README v0.5 marker not found')
              section = base64.b64decode(payload).decode()
              readme.write_text(text.replace(marker, section + marker, 1))
          PY
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ipython
      - name: Run test suite
        run: pytest -q
      - name: Commit README only after green suite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: document EngCalc 0.6.0 magnitude envelopes"
            git push
          fi
