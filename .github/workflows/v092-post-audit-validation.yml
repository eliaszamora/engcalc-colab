name: v0.9.2 Post-Audit Validation

on:
  push:
    branches: [fix/v0.9.2-post-audit-remediation]

jobs:
  red-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src/engcalc_colab
      - name: Verify post-audit RED contract
        shell: bash
        run: |
          set -euo pipefail
          expect_fail() {
            label="$1"
            shift
            set +e
            python -m pytest -q "$@" > "${RUNNER_TEMP}/${label}.log" 2>&1
            status=$?
            set -e
            cat "${RUNNER_TEMP}/${label}.log"
            if [ "$status" -eq 0 ]; then
              echo "EXPECTED_RED_MISSING=${label}"
              exit 1
            fi
            echo "EXPECTED_RED_CONFIRMED=${label}"
          }
          expect_pass() {
            label="$1"
            shift
            python -m pytest -q "$@"
            echo "EXPECTED_GREEN_CONTROL=${label}"
          }

          expect_fail n1_public tests/test_v092_post_audit_regressions.py::test_n1_decimal_quadratic_roots_do_not_silently_disappear
          expect_fail n1_family tests/test_v092_post_audit_regressions.py::test_n1_decimal_quadratic_family_preserves_known_roots
          expect_fail n1_candidate_validation tests/test_v092_post_audit_regressions.py::test_n1_decimal_exact_candidates_survive_roundoff_validation
          expect_fail n2_roundoff tests/test_v092_post_audit_regressions.py::test_n2_float_exact_candidates_accept_numerical_roundoff
          expect_pass n2_negative tests/test_v092_post_audit_regressions.py::test_n2_materially_wrong_exact_candidate_is_rejected
          expect_fail n3_roots tests/test_v092_post_audit_regressions.py::test_n3_roots_resolve_unit_literals_in_response_expression
          expect_fail n3_extrema tests/test_v092_post_audit_regressions.py::test_n3_extrema_resolve_unit_literals_in_response_expression
          expect_fail n3_intersections tests/test_v092_post_audit_regressions.py::test_n3_intersections_resolve_unit_literals_in_response_expression
          expect_pass n3_fallback_control tests/test_v092_post_audit_regressions.py::test_n3_fallback_works_with_boundary_resolved_unit_literals
          expect_fail n4_symbolic_abs tests/test_v092_post_audit_regressions.py::test_n4_extrema_simplifies_decidable_abs_symbolic_boundary_values
          git diff --check
          echo "POST_AUDIT_RED_CONTRACT=PASS"

  n1-diagnostic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sympy-version: ['1.13.3', '1.14.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install 'sympy==${{ matrix.sympy-version }}'
      - run: python .github/scripts/v092_post_audit_n1_diagnostic.py
