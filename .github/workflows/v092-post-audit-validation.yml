name: v0.9.2 Post-Audit Validation

on:
  push:
    branches: [fix/v0.9.2-post-audit-remediation]

jobs:
  task3-red-and-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src/engcalc_colab
      - name: Inventory characteristic evaluate_symbolic boundaries
        run: python .github/scripts/v092_post_audit_n3_inventory.py
      - name: Confirm N-3 public RED and lower-level control
        shell: bash
        run: |
          set -euo pipefail
          expect_fail() {
            label="$1"
            shift
            set +e
            python -m pytest -q "$@" > "${RUNNER_TEMP}/${label}.log" 2>&1
            status=$?
            set -e
            cat "${RUNNER_TEMP}/${label}.log"
            if [ "$status" -eq 0 ]; then
              echo "EXPECTED_RED_MISSING=${label}"
              exit 1
            fi
            echo "EXPECTED_RED_CONFIRMED=${label}"
          }
          expect_fail n3_roots tests/test_v092_post_audit_regressions.py::test_n3_roots_resolve_unit_literals_in_response_expression
          expect_fail n3_extrema tests/test_v092_post_audit_regressions.py::test_n3_extrema_resolve_unit_literals_in_response_expression
          expect_fail n3_intersections tests/test_v092_post_audit_regressions.py::test_n3_intersections_resolve_unit_literals_in_response_expression
          python -m pytest -q tests/test_v092_post_audit_regressions.py::test_n3_fallback_works_with_boundary_resolved_unit_literals
          python -m pytest -q tests/test_v092_post_audit_regressions.py -k 'n1 or n2'
          git diff --check
          echo "TASK3_RED_GATE=PASS"
