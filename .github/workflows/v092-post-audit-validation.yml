name: v0.9.2 Post-Audit Validation

on:
  push:
    branches: [fix/v0.9.2-post-audit-remediation]

permissions:
  contents: write

jobs:
  task4-green:
    # Task 4 idempotence rerun on the materialized product commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Apply Task 4 candidate patch
        run: python .github/scripts/v092_post_audit_task4_apply.py
      - run: python -m compileall -q src/engcalc_colab
      - name: Verify Task 4 focused GREEN
        run: python -m pytest -q tests/test_v092_post_audit_regressions.py -k n4
      - name: Verify extrema and Piecewise regression
        run: |
          python -m pytest -q \
            tests/test_characteristics_extrema.py \
            tests/test_characteristics_acceptance.py
      - name: Verify Tasks 1-3 remain GREEN
        run: python -m pytest -q tests/test_v092_post_audit_regressions.py -k 'n1 or n2 or n3'
      - name: Verify Task 4 is idempotent
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only -- src/engcalc_colab/characteristics/extrema.py)"
          printf 'TASK4_IDEMPOTENT_WORKTREE=%s\n' "$changed"
          test -z "$changed"
      - name: Verify complete source suite
        run: python -m pytest -q
      - name: Persist Task 4 product patch if needed
        shell: bash
        run: |
          set -euo pipefail
          git add -- src/engcalc_colab/characteristics/extrema.py
          if git diff --cached --quiet; then
            echo "No Task 4 product patch to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: simplify decidable extrema display values"
          git push origin HEAD:fix/v0.9.2-post-audit-remediation
          echo "TASK4_PRODUCT_PERSISTED=PASS"
