name: v0.9.2 Post-Audit Validation

on:
  push:
    branches: [fix/v0.9.2-post-audit-remediation]

jobs:
  task4-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src/engcalc_colab
      - name: Confirm Task 4 focused REDs
        shell: bash
        run: |
          set -euo pipefail
          expect_fail() {
            label="$1"
            shift
            set +e
            python -m pytest -q "$@" > "${RUNNER_TEMP}/${label}.log" 2>&1
            status=$?
            set -e
            cat "${RUNNER_TEMP}/${label}.log"
            if [ "$status" -eq 0 ]; then
              echo "EXPECTED_RED_MISSING=${label}"
              exit 1
            fi
            echo "EXPECTED_RED_CONFIRMED=${label}"
          }
          expect_fail n4_positive tests/test_v092_post_audit_regressions.py::test_n4_extrema_simplifies_decidable_abs_symbolic_boundary_values
          expect_fail n4_negative tests/test_v092_post_audit_regressions.py::test_n4_extrema_respects_negative_registered_scalar_sign_in_display
      - name: Verify Tasks 1-3 remain GREEN
        run: python -m pytest -q tests/test_v092_post_audit_regressions.py -k 'n1 or n2 or n3'
      - name: Verify existing extrema baseline remains GREEN
        run: |
          python -m pytest -q \
            tests/test_characteristics_extrema.py \
            tests/test_characteristics_acceptance.py -k 'extrema or piecewise'
      - run: git diff --check
