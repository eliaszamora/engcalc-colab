name: v0.9.2 Post-Audit Validation

on:
  push:
    branches: [fix/v0.9.2-post-audit-remediation]

jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Focused post-audit regressions
        run: |
          python -m pytest -q tests/test_v092_post_audit_regressions.py
          python -m pytest -q \
            tests/test_characteristics_acceptance.py \
            tests/test_characteristics_fallback.py \
            tests/test_characteristics_roots.py \
            tests/test_characteristics_intersections.py \
            tests/test_characteristics_extrema.py \
            tests/test_characteristics_plot_integration.py
      - name: Compile and complete source suite
        run: |
          python -m compileall -q src/engcalc_colab
          python -m pytest -q
      - name: Hygiene and scope audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          test -z "$(git status --short)"
          python - <<'PY'
          import subprocess
          import tomllib

          allowed = {
              '.github/scripts/v092_post_audit_n1_diagnostic.py',
              '.github/scripts/v092_post_audit_n3_inventory.py',
              '.github/scripts/v092_post_audit_task3_apply.py',
              '.github/scripts/v092_post_audit_task4_apply.py',
              '.github/workflows/v092-post-audit-validation.yml',
              'docs/project-context/CURRENT.md',
              'docs/superpowers/plans/2026-08-31-engcalc-v0.9.2-post-audit-remediation-implementation.md',
              'docs/superpowers/specs/2026-08-31-engcalc-v0.9.2-post-audit-remediation-design.md',
              'src/engcalc_colab/characteristics/candidates.py',
              'src/engcalc_colab/characteristics/extrema.py',
              'src/engcalc_colab/characteristics/fallback.py',
              'src/engcalc_colab/characteristics/intersections.py',
              'src/engcalc_colab/characteristics/roots.py',
              'tests/test_v092_post_audit_regressions.py',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines())
          unexpected = sorted(changed - allowed)
          print('TASK5_SCOPE_FILES=' + ','.join(sorted(changed)))
          print('TASK5_UNEXPECTED_FILES=' + ','.join(unexpected))
          assert not unexpected

          with open('pyproject.toml', 'rb') as handle:
              project = tomllib.load(handle)['project']
          assert project['version'] == '0.9.2'
          assert project['requires-python'] == '>=3.10'
          assert 'ipython>=8.18' in project['dependencies']
          print('TASK5_VERSION=0.9.2')
          print('TASK5_SCOPE_AUDIT=PASS')
          PY
      - name: Build real wheel
        run: |
          rm -rf dist
          python -m pip wheel . --no-deps -w dist
      - name: Inspect wheel metadata and SHA-256
        run: |
          python - <<'PY'
          from email.parser import Parser
          import glob
          import hashlib
          import pathlib
          import zipfile

          wheels = glob.glob('dist/*.whl')
          assert len(wheels) == 1, wheels
          wheel = pathlib.Path(wheels[0])
          assert wheel.name == 'engcalc_colab-0.9.2-py3-none-any.whl', wheel.name
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          with zipfile.ZipFile(wheel) as archive:
              metadata_name = next(
                  name for name in archive.namelist()
                  if name.endswith('.dist-info/METADATA')
              )
              metadata = Parser().parsestr(archive.read(metadata_name).decode())
          requires_dist = metadata.get_all('Requires-Dist') or []
          assert metadata['Version'] == '0.9.2'
          assert metadata['Requires-Python'] == '>=3.10'
          assert any(item.replace(' ', '').startswith('ipython>=8.18') for item in requires_dist), requires_dist
          print(f'WHEEL_FILE={wheel.name}')
          print(f'WHEEL_SHA256={digest}')
          print(f'WHEEL_VERSION={metadata["Version"]}')
          print(f'WHEEL_REQUIRES_PYTHON={metadata["Requires-Python"]}')
          print('WHEEL_IPYTHON_DEP=PASS')
          PY
      - name: Source-free installed-wheel verification
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(realpath dist/engcalc_colab-0.9.2-py3-none-any.whl)"
          rm -rf /tmp/engcalc-wheel-venv /tmp/engcalc-wheel-tests
          python -m venv /tmp/engcalc-wheel-venv
          /tmp/engcalc-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/engcalc-wheel-venv/bin/python -m pip install "$wheel" 'pytest>=8'
          mkdir -p /tmp/engcalc-wheel-tests
          cp -a tests /tmp/engcalc-wheel-tests/tests
          cd /tmp/engcalc-wheel-tests
          /tmp/engcalc-wheel-venv/bin/python - <<'PY'
          import engcalc_colab
          from pathlib import Path
          package_path = Path(engcalc_colab.__file__).resolve()
          print(f'WHEEL_IMPORT_PATH={package_path}')
          assert 'site-packages' in package_path.parts
          assert '/home/runner/work/engcalc-colab/engcalc-colab' not in str(package_path)
          print('SOURCE_FREE_IMPORT=PASS')
          PY
          /tmp/engcalc-wheel-venv/bin/python -m pytest -q tests
      - uses: actions/upload-artifact@v4
        with:
          name: engcalc-colab-0.9.2-post-audit-wheel
          path: dist/engcalc_colab-0.9.2-py3-none-any.whl
          if-no-files-found: error

  python-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src/engcalc_colab
      - run: python -m pytest -q
