name: v0.9.2 Post-Audit Validation

on:
  push:
    branches: [fix/v0.9.2-post-audit-remediation]

permissions:
  contents: write

jobs:
  task3-green:
    # Task 3 idempotence rerun on the materialized product commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Apply Task 3 candidate patch
        run: python .github/scripts/v092_post_audit_task3_apply.py
      - run: python -m compileall -q src/engcalc_colab
      - name: Verify solver-boundary unit-literal inventory
        run: python .github/scripts/v092_post_audit_n3_inventory.py --require-solver-boundaries
      - name: Verify N-3 focused GREEN
        run: python -m pytest -q tests/test_v092_post_audit_regressions.py -k n3
      - name: Verify characteristic integration
        run: |
          python -m pytest -q \
            tests/test_characteristics_acceptance.py \
            tests/test_characteristics_fallback.py \
            tests/test_characteristics_roots.py \
            tests/test_characteristics_intersections.py \
            tests/test_characteristics_extrema.py \
            tests/test_characteristics_plot_integration.py
      - name: Verify N-1 and N-2 remain GREEN
        run: python -m pytest -q tests/test_v092_post_audit_regressions.py -k 'n1 or n2'
      - name: Verify released baseline suite remains GREEN
        run: python -m pytest -q --ignore=tests/test_v092_post_audit_regressions.py
      - name: Verify N-4 remains isolated future RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q tests/test_v092_post_audit_regressions.py -k n4 > "${RUNNER_TEMP}/n4.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/n4.log"
          if [ "$status" -eq 0 ]; then
            echo "UNEXPECTED_FUTURE_GREEN=n4"
            exit 1
          fi
          echo "EXPECTED_FUTURE_RED=n4"
          git diff --check
      - name: Persist Task 3 product patch if needed
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            src/engcalc_colab/characteristics/roots.py \
            src/engcalc_colab/characteristics/intersections.py \
            src/engcalc_colab/characteristics/extrema.py
          if git diff --cached --quiet; then
            echo "No Task 3 product patch to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: propagate characteristic unit literals consistently"
          git push origin HEAD:fix/v0.9.2-post-audit-remediation
          echo "TASK3_PRODUCT_PERSISTED=PASS"
