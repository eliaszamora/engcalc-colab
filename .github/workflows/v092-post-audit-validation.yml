name: v0.9.2 Post-Audit Validation

on:
  push:
    branches: [fix/v0.9.2-post-audit-remediation]

jobs:
  task2-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src/engcalc_colab
      - name: Verify N-1 and N-2 focused GREEN
        run: |
          python -m pytest -q tests/test_v092_post_audit_regressions.py -k 'n1 or n2'
      - name: Verify characteristic focused regression
        run: |
          python -m pytest -q \
            tests/test_characteristics_fallback.py \
            tests/test_characteristics_roots.py \
            tests/test_characteristics_acceptance.py
      - name: Verify released baseline suite remains GREEN
        run: |
          python -m pytest -q --ignore=tests/test_v092_post_audit_regressions.py
      - name: Verify N-3 and N-4 remain isolated future REDs
        shell: bash
        run: |
          set -euo pipefail
          expect_fail() {
            label="$1"
            shift
            set +e
            python -m pytest -q "$@" > "${RUNNER_TEMP}/${label}.log" 2>&1
            status=$?
            set -e
            cat "${RUNNER_TEMP}/${label}.log"
            if [ "$status" -eq 0 ]; then
              echo "UNEXPECTED_FUTURE_GREEN=${label}"
              exit 1
            fi
            echo "EXPECTED_FUTURE_RED=${label}"
          }
          expect_fail n3 tests/test_v092_post_audit_regressions.py -k n3
          expect_fail n4 tests/test_v092_post_audit_regressions.py -k n4
          git diff --check
          echo "TASK2_GREEN_GATE=PASS"
