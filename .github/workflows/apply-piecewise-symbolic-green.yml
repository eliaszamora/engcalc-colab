name: Apply Piecewise symbolic GREEN

on:
  push:
    branches:
      - feature/v0.8.0-piecewise
    paths:
      - .github/workflows/apply-piecewise-symbolic-green.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.8.0-piecewise
      - name: Patch engine exactly
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/engcalc_colab/engine.py')
          text = path.read_text()

          old_import = "from .numeric import NumericContext\nfrom .tables import normalize_explicit_points, normalize_uniform_points\n"
          new_import = "from .numeric import NumericContext\nfrom .piecewise import build_piecewise, build_relation\nfrom .tables import normalize_explicit_points, normalize_uniform_points\n"
          assert text.count(old_import) == 1, 'unexpected import insertion point'
          text = text.replace(old_import, new_import, 1)

          old_methods = '''    def visit_BinOp(self, node: ast.BinOp):\n        left = self.visit(node.left)\n        right = self.visit(node.right)\n        if isinstance(node.op, ast.Add): return left + right\n        if isinstance(node.op, ast.Sub): return left - right\n        if isinstance(node.op, ast.Mult): return left * right\n        if isinstance(node.op, ast.Div): return left / right\n        if isinstance(node.op, ast.Pow): return left ** right\n        raise EngEvaluationError("unsupported operator")\n\n    def visit_Call(self, node: ast.Call):\n'''
          new_methods = '''    def visit_BinOp(self, node: ast.BinOp):\n        left = self.visit(node.left)\n        right = self.visit(node.right)\n        if isinstance(node.op, ast.Add): return left + right\n        if isinstance(node.op, ast.Sub): return left - right\n        if isinstance(node.op, ast.Mult): return left * right\n        if isinstance(node.op, ast.Div): return left / right\n        if isinstance(node.op, ast.Pow): return left ** right\n        raise EngEvaluationError("unsupported operator")\n\n    def _evaluate_piecewise_condition(self, node: ast.AST):\n        if not isinstance(node, ast.Compare):\n            raise EngEvaluationError("piecewise condition must be a comparison")\n        if len(node.ops) != 1 or len(node.comparators) != 1:\n            raise EngEvaluationError("piecewise condition must be a binary comparison")\n        left = self.visit(node.left)\n        right = self.visit(node.comparators[0])\n        return build_relation(left, node.ops[0], right)\n\n    def _evaluate_piecewise(self, node: ast.Call):\n        if node.keywords or len(node.args) < 3 or len(node.args) % 2 == 0:\n            raise EngEvaluationError(\n                "piecewise expects value/condition pairs and a default"\n            )\n        branches = tuple(\n            (\n                self.visit(node.args[index]),\n                self._evaluate_piecewise_condition(node.args[index + 1]),\n            )\n            for index in range(0, len(node.args) - 1, 2)\n        )\n        default = self.visit(node.args[-1])\n        return build_piecewise(branches, default)\n\n    def visit_Call(self, node: ast.Call):\n'''
          assert text.count(old_methods) == 1, 'unexpected method insertion point'
          text = text.replace(old_methods, new_methods, 1)

          old_dispatch = '''        name = node.func.id\n\n        if name == "sum":\n'''
          new_dispatch = '''        name = node.func.id\n\n        if name == "piecewise":\n            return self._evaluate_piecewise(node)\n\n        if name == "sum":\n'''
          assert text.count(old_dispatch) == 1, 'unexpected Piecewise dispatch point'
          text = text.replace(old_dispatch, new_dispatch, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- src/engcalc_colab/engine.py
      - name: Commit engine patch
        run: |
          git config user.name "eliaszamora"
          git config user.email "37598447+eliaszamora@users.noreply.github.com"
          git add src/engcalc_colab/engine.py
          git commit -m "feat: construct symbolic piecewise expressions"
          git push origin HEAD:feature/v0.8.0-piecewise
