name: EngCalc 0.9.0 Task 7 Context

on:
  push:
    branches:
      - feature/v0.9.0-matrix-cas
    paths:
      - .github/workflows/v090-task7-context.yml

permissions:
  contents: write

jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.9.0-matrix-cas
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch CURRENT
        run: python .github/scripts/v090_task7_context.py
      - name: Validate context
        run: |
          git diff --check
          grep -q "TASKS 0–7 COMPLETE, TASK 8 NEXT" docs/project-context/CURRENT.md
          grep -q "684/684 full GREEN" docs/project-context/CURRENT.md
          grep -q "29c8363804f6078371fb28f03dbb0dd3a7e80e18" docs/project-context/CURRENT.md
      - name: Remove context harness
        run: |
          git rm .github/scripts/v090_task7_context.py
          git rm .github/workflows/v090-task7-context.yml
      - name: Commit context
        run: |
          git config user.name "eliaszamora"
          git config user.email "37598447+eliaszamora@users.noreply.github.com"
          git add docs/project-context/CURRENT.md
          git commit -am "docs: close Matrix CAS Task 7"
          git push origin HEAD:feature/v0.9.0-matrix-cas
