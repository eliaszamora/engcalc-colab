name: EngCalc 0.9.1 Task 9 TDD

on:
  push:
    branches:
      - feature/v0.9.1-exact-characteristics

permissions:
  contents: read

jobs:
  task9:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test environment
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython

      - name: Run Task 9 rendering and magic RED tests
        run: >-
          python -m pytest
          tests/test_characteristics_rendering.py
          tests/test_characteristics_magic.py
          tests/test_magic.py
          tests/test_renderer.py
          tests/test_matrix_renderer.py
          -q
