name: EngCalc 0.9.1 Task 9 TDD

on:
  push:
    branches:
      - feature/v0.9.1-exact-characteristics

permissions:
  contents: write

jobs:
  task9:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test environment
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython

      - name: Apply guarded Task 9 GREEN patch when needed
        shell: bash
        run: |
          if grep -q '^def render_characteristic_result(' src/engcalc_colab/renderer.py; then
            echo 'Task 9 characteristic renderer already present; skipping patch.'
          else
            python .github/scripts/v091_task9_green.py
          fi

      - name: Check diff hygiene
        run: git diff --check

      - name: Run Task 9 focused regression gate
        run: >-
          python -m pytest
          tests/test_characteristics_rendering.py
          tests/test_characteristics_magic.py
          tests/test_magic.py
          tests/test_renderer.py
          tests/test_matrix_renderer.py
          -q

      - name: Commit verified Task 9 product patch
        shell: bash
        run: |
          if git diff --quiet -- src/engcalc_colab/renderer.py src/engcalc_colab/magic.py; then
            echo 'No product patch to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engcalc_colab/renderer.py src/engcalc_colab/magic.py
          git commit -m 'feat: render characteristic analysis in eng magic'
          git push origin HEAD:feature/v0.9.1-exact-characteristics
