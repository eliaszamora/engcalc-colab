name: Apply Piecewise Task 3 GREEN

on:
  push:
    branches:
      - feature/v0.8.0-piecewise
    paths:
      - .github/workflows/apply-piecewise-task3-green.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.8.0-piecewise
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Patch Task 3 production files
        run: |
          python - <<'PY'
          from pathlib import Path

          # models.py
          path = Path('src/engcalc_colab/models.py')
          text = path.read_text()
          anchor = '@dataclass(frozen=True, init=False)\nclass PartialNumericEvaluationResult:'
          insertion = '''@dataclass(frozen=True)\nclass PiecewisePartialBranch:\n    value: Any\n    operator: str | None\n    breakpoint: Any | None\n    evaluated_terms: tuple[tuple[int, Any], ...] | None = None\n\n\n@dataclass(frozen=True)\nclass PiecewisePartialEvaluation:\n    interval_variable: str\n    branches: tuple[PiecewisePartialBranch, ...]\n\n\n@dataclass(frozen=True, init=False)\nclass PartialNumericEvaluationResult:'''
          assert text.count(anchor) == 1
          text = text.replace(anchor, insertion, 1)
          start = text.index('class PartialNumericEvaluationResult:')
          head, tail = text[:start], text[start:]
          old_fields = '''    evaluated_terms: tuple[tuple[int, Any], ...] | None = None\n    display_name: str | None = None\n    display_arguments: tuple[Any, ...] | None = None\n'''
          new_fields = old_fields + '    piecewise_evaluation: PiecewisePartialEvaluation | None = None\n'
          assert tail.count(old_fields) == 1
          tail = tail.replace(old_fields, new_fields, 1)
          old_params = '''        evaluated_terms: tuple[tuple[int, Any], ...] | None = None,\n        display_name: str | None = None,\n        display_arguments: tuple[Any, ...] | None = None,\n        *,\n'''
          new_params = '''        evaluated_terms: tuple[tuple[int, Any], ...] | None = None,\n        display_name: str | None = None,\n        display_arguments: tuple[Any, ...] | None = None,\n        piecewise_evaluation: PiecewisePartialEvaluation | None = None,\n        *,\n'''
          assert tail.count(old_params) == 1
          tail = tail.replace(old_params, new_params, 1)
          old_sets = '''        object.__setattr__(self, "display_name", display_name)\n        object.__setattr__(self, "display_arguments", normalized)\n\n    @property\n'''
          new_sets = '''        object.__setattr__(self, "display_name", display_name)\n        object.__setattr__(self, "display_arguments", normalized)\n        object.__setattr__(self, "piecewise_evaluation", piecewise_evaluation)\n\n    @property\n'''
          assert tail.count(old_sets) == 1
          tail = tail.replace(old_sets, new_sets, 1)
          path.write_text(head + tail)

          # numeric.py
          path = Path('src/engcalc_colab/numeric.py')
          text = path.read_text()
          anchor = '''    def _evaluate_sympy(self, expr, substitutions: dict[str, Any]):\n'''
          helper = '''    def build_partial_piecewise_evaluation(\n        self,\n        expression,\n        variable: str,\n        overrides: dict[str, Any] | None = None,\n    ):\n        from .models import PiecewisePartialBranch, PiecewisePartialEvaluation\n\n        expression = sp.sympify(expression)\n        if not isinstance(expression, sp.Piecewise):\n            return None\n\n        symbol = sp.Symbol(variable)\n        overrides = dict(overrides or {})\n        operator_direct = {\n            sp.StrictLessThan: "<",\n            sp.LessThan: "<=",\n            sp.StrictGreaterThan: ">",\n            sp.GreaterThan: ">=",\n        }\n        operator_reverse = {\n            sp.StrictLessThan: ">",\n            sp.LessThan: ">=",\n            sp.StrictGreaterThan: "<",\n            sp.GreaterThan: "<=",\n        }\n\n        branches = []\n        resolved_indices = []\n        resolved_values = []\n        for branch_expression, condition in expression.args:\n            branch_expression = sp.sympify(branch_expression)\n            evaluated_terms = None\n            if symbol not in branch_expression.free_symbols:\n                _, value = self.evaluate_symbolic(\n                    branch_expression,\n                    overrides=overrides,\n                )\n                resolved_indices.append(len(branches))\n                resolved_values.append(value)\n            else:\n                value = branch_expression\n                evaluated_terms = self.evaluate_partial_polynomial(\n                    branch_expression,\n                    variable,\n                    overrides=overrides,\n                )\n\n            operator = None\n            breakpoint = None\n            if condition != sp.true:\n                if not isinstance(condition, sp.Rel):\n                    raise EngEvaluationError("piecewise condition must be relational")\n                if condition.lhs == symbol and symbol not in condition.rhs.free_symbols:\n                    operator = operator_direct.get(condition.func)\n                    breakpoint_expression = condition.rhs\n                elif condition.rhs == symbol and symbol not in condition.lhs.free_symbols:\n                    operator = operator_reverse.get(condition.func)\n                    breakpoint_expression = condition.lhs\n                else:\n                    raise EngEvaluationError(\n                        "piecewise condition must compare the interval variable directly "\n                        "with a breakpoint"\n                    )\n                if operator is None:\n                    raise EngEvaluationError("unsupported piecewise relation")\n                _, breakpoint = self.evaluate_symbolic(\n                    breakpoint_expression,\n                    overrides=overrides,\n                )\n\n            branches.append({\n                "value": value,\n                "operator": operator,\n                "breakpoint": breakpoint,\n                "evaluated_terms": evaluated_terms,\n            })\n\n        if resolved_values:\n            normalized = self._normalize_quantity_group(\n                resolved_values,\n                "piecewise branches",\n            )\n            for index, value in zip(resolved_indices, normalized):\n                branches[index]["value"] = value\n\n        return PiecewisePartialEvaluation(\n            interval_variable=variable,\n            branches=tuple(PiecewisePartialBranch(**branch) for branch in branches),\n        )\n\n'''
          assert text.count(anchor) == 1
          text = text.replace(anchor, helper + anchor, 1)
          path.write_text(text)

          # engine.py
          path = Path('src/engcalc_colab/engine.py')
          text = path.read_text()
          old_unpack = '''                    evaluated_terms,\n                    display_name,\n                    display_arguments,\n                ) = evaluator.partial_numeric_evaluation\n'''
          new_unpack = '''                    evaluated_terms,\n                    display_name,\n                    display_arguments,\n                    piecewise_evaluation,\n                ) = evaluator.partial_numeric_evaluation\n'''
          assert text.count(old_unpack) == 1
          text = text.replace(old_unpack, new_unpack, 1)
          old_result = '''                    evaluated_terms=evaluated_terms,\n                    display_name=display_name,\n                    display_arguments=display_arguments,\n                )\n'''
          new_result = '''                    evaluated_terms=evaluated_terms,\n                    display_name=display_name,\n                    display_arguments=display_arguments,\n                    piecewise_evaluation=piecewise_evaluation,\n                )\n'''
          assert text.count(old_result) == 1
          text = text.replace(old_result, new_result, 1)
          old_partial = '''                        self.partial_numeric_evaluation = (\n                            symbolic_expression,\n                            substitutions,\n                            unresolved_symbols,\n                            evaluated_terms,\n                            display_name,\n                            display_arguments,\n                        )\n'''
          new_partial = '''                        piecewise_evaluation = None\n                        if (\n                            len(unresolved_symbols) == 1\n                            and isinstance(symbolic_expression, sp.Piecewise)\n                        ):\n                            piecewise_evaluation = (\n                                self.engine.numeric_context.build_partial_piecewise_evaluation(\n                                    symbolic_expression,\n                                    unresolved_symbols[0],\n                                    overrides=overrides,\n                                )\n                            )\n\n                        self.partial_numeric_evaluation = (\n                            symbolic_expression,\n                            substitutions,\n                            unresolved_symbols,\n                            evaluated_terms,\n                            display_name,\n                            display_arguments,\n                            piecewise_evaluation,\n                        )\n'''
          assert text.count(old_partial) == 1
          text = text.replace(old_partial, new_partial, 1)
          path.write_text(text)

          # renderer.py
          path = Path('src/engcalc_colab/renderer.py')
          text = path.read_text()
          anchor = '''def _display_lhs(result: NumericEvaluationResult | PartialNumericEvaluationResult) -> str | None:\n'''
          helper = r'''def _piecewise_partial_latex(piecewise, substitutions: dict[str, object], settings: RenderSettings) -> str:\n    variable_latex = _latex(sp.Symbol(piecewise.interval_variable))\n    operator_latex = {\n        "<": "<",\n        "<=": r"\\leq",\n        ">": ">",\n        ">=": r"\\geq",\n    }\n    rendered = []\n    for branch in piecewise.branches:\n        value = branch.value\n        if hasattr(value, "magnitude") and hasattr(value, "units"):\n            value_latex = _quantity_latex(value, settings=settings)\n        elif branch.evaluated_terms is not None:\n            value_latex = _partial_polynomial_latex(\n                branch.evaluated_terms,\n                piecewise.interval_variable,\n                settings,\n            )\n        else:\n            value_latex = _substitution_latex(\n                sp.sympify(value),\n                substitutions,\n                settings,\n            )\n\n        if branch.operator is None:\n            rendered.append(rf"{value_latex} & \\text{{otherwise}}")\n            continue\n\n        breakpoint = branch.breakpoint\n        if hasattr(breakpoint, "magnitude") and hasattr(breakpoint, "units"):\n            breakpoint_latex = _quantity_latex(breakpoint, settings=settings)\n        else:\n            breakpoint_latex = _substitution_latex(\n                sp.sympify(breakpoint),\n                substitutions,\n                settings,\n            )\n        rendered.append(\n            rf"{value_latex} & \\text{{for}}\\: "\n            rf"{variable_latex} {operator_latex[branch.operator]} {breakpoint_latex}"\n        )\n\n    return r"\\begin{cases} " + r" \\\\ ".join(rendered) + r" \\end{cases}"\n\n\n'''
          assert text.count(anchor) == 1
          text = text.replace(anchor, helper + anchor, 1)

          old_eval = '''    evaluated_latex = None\n    if len(result.unresolved_symbols) == 1:\n        evaluated_latex = _partial_polynomial_latex(result.evaluated_terms, result.unresolved_symbols[0], settings)\n'''
          new_eval = '''    evaluated_latex = None\n    if result.piecewise_evaluation is not None:\n        evaluated_latex = _piecewise_partial_latex(\n            result.piecewise_evaluation,\n            result.substitutions,\n            settings,\n        )\n    elif len(result.unresolved_symbols) == 1:\n        evaluated_latex = _partial_polynomial_latex(result.evaluated_terms, result.unresolved_symbols[0], settings)\n'''
          assert text.count(old_eval) == 1
          text = text.replace(old_eval, new_eval, 1)

          old_spacing = '''        evaluated_latex = None\n        if len(result.unresolved_symbols) == 1:\n            evaluated_latex = _partial_polynomial_latex(\n                result.evaluated_terms,\n                result.unresolved_symbols[0],\n                settings,\n            )\n'''
          new_spacing = '''        evaluated_latex = None\n        if result.piecewise_evaluation is not None:\n            evaluated_latex = _piecewise_partial_latex(\n                result.piecewise_evaluation,\n                result.substitutions,\n                settings,\n            )\n        elif len(result.unresolved_symbols) == 1:\n            evaluated_latex = _partial_polynomial_latex(\n                result.evaluated_terms,\n                result.unresolved_symbols[0],\n                settings,\n            )\n'''
          assert text.count(old_spacing) == 1
          text = text.replace(old_spacing, new_spacing, 1)

          old_render = '''        evaluated_latex = None\n        if len(result.unresolved_symbols) == 1:\n            evaluated_latex = _partial_polynomial_latex(result.evaluated_terms, result.unresolved_symbols[0], active_settings)\n'''
          new_render = '''        evaluated_latex = None\n        if result.piecewise_evaluation is not None:\n            evaluated_latex = _piecewise_partial_latex(\n                result.piecewise_evaluation,\n                result.substitutions,\n                active_settings,\n            )\n        elif len(result.unresolved_symbols) == 1:\n            evaluated_latex = _partial_polynomial_latex(result.evaluated_terms, result.unresolved_symbols[0], active_settings)\n'''
          assert text.count(old_render) == 1
          text = text.replace(old_render, new_render, 1)
          path.write_text(text)
          PY
          git diff --check
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]' ipython
      - name: Run focused Task 3 tests
        run: python -m pytest tests/test_piecewise_partial_numeric.py tests/test_piecewise_renderer.py -q
      - name: Commit Task 3 GREEN
        run: |
          git config user.name "eliaszamora"
          git config user.email "37598447+eliaszamora@users.noreply.github.com"
          git add src/engcalc_colab/models.py src/engcalc_colab/numeric.py src/engcalc_colab/engine.py src/engcalc_colab/renderer.py
          git commit -m "feat: render partial piecewise numeric evaluation"
          git push origin HEAD:feature/v0.8.0-piecewise
