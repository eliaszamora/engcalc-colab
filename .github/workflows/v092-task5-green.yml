name: v0.9.2 Task 5 GREEN

on:
  push:
    branches:
      - feature/v0.9.2-audit-reliability

permissions:
  contents: write

jobs:
  task5-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply Task 5 patch
        run: python .github/scripts/v092_task5_green.py
      - name: Compile
        run: python -m compileall -q src/engcalc_colab
      - name: Run Task 5 contract gate
        run: python -m pytest tests/test_v092_audit_regressions.py -q
      - name: Run broad symbol migration regression
        run: |
          python -m pytest \
            tests/test_v092_audit_regressions.py \
            tests/test_characteristics_extrema.py \
            tests/test_characteristics_piecewise_extrema.py \
            tests/test_characteristics_plot_integration.py \
            tests/test_matrix_partial_numeric.py \
            tests/test_multiarg_numeric.py \
            tests/test_characteristics_engine.py \
            tests/test_magic.py -q
      - name: Run complete source suite
        run: python -m pytest -q
      - name: Commit Task 5 product patch
        shell: bash
        run: |
          if git diff --quiet -- src/engcalc_colab; then
            echo 'No Task 5 product patch to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engcalc_colab/engine.py src/engcalc_colab/numeric.py src/engcalc_colab/piecewise.py src/engcalc_colab/characteristics.py
          git commit -m 'fix: make engineering symbols explicitly real'
          git push origin HEAD:feature/v0.9.2-audit-reliability
