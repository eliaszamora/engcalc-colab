name: Apply EngCalc 0.7.2 release docs

on:
  push:
    branches:
      - feature/v0.7.2-engineering-tables
    paths:
      - tools/apply_v072_release_docs.py
      - .github/workflows/v072-task6-doc-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.2-engineering-tables
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply release documentation cleanup
        run: python tools/apply_v072_release_docs.py
      - name: Commit release documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: finalize EngCalc 0.7.2 release documentation"
          git push origin HEAD:feature/v0.7.2-engineering-tables
