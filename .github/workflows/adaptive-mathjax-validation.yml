name: Adaptive MathJax validation

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8' 'sympy>=1.13' 'pint>=0.24' 'ipython>=8' 'build>=1'
      - name: Build and install release wheel
        run: |
          python -m build --wheel
          python -m pip install --no-deps --force-reinstall dist/engcalc_colab-0.2.8-py3-none-any.whl
          python -c "import engcalc_colab; assert engcalc_colab.__version__ == '0.2.8'"
      - name: Run tests
        run: pytest -q
