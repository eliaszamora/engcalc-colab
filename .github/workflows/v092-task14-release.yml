name: v0.9.2 Task 14 Release

on:
  push:
    branches:
      - feature/v0.9.2-audit-reliability

permissions:
  contents: write

jobs:
  font-warning-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Materialize supported plot-title weight
        run: |
          python - <<'PY'
          from pathlib import Path

          expected = {
              Path('src/engcalc_colab/plotting.py'): 4,
              Path('src/engcalc_colab/presentation.py'): 1,
          }
          for path, expected_count in expected.items():
              text = path.read_text(encoding='utf-8')
              count = text.count('fontweight=600')
              assert count == expected_count, (path, count, expected_count)
              path.write_text(text.replace('fontweight=600', 'fontweight=700'), encoding='utf-8')
          print('TASK14_FONT_WEIGHT_FIX=600_to_700')
          PY
      - name: Run focused plotting regression
        run: |
          python -m pytest tests/test_plotting.py -q
      - name: Prove clean-font-cache warning is gone
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          code = r'''
          import matplotlib
          matplotlib.use("Agg")
          from engcalc_colab.engine import EngineeringEngine
          from engcalc_colab.parser import parse_cell
          from engcalc_colab.plotting import render_plot
          from engcalc_colab.presentation import render_presented_plot

          engine = EngineeringEngine()
          result = None
          for statement in parse_cell('f(x)=-(x-1/3)^2+2\nplot(f(x), x, 0, 1, title="Test")'):
              result = engine.evaluate(statement)
          render_plot(result)
          render_presented_plot(result)
          '''
          with tempfile.TemporaryDirectory() as mpl_config:
              env = os.environ.copy()
              env['MPLCONFIGDIR'] = mpl_config
              completed = subprocess.run(
                  [sys.executable, '-c', code],
                  cwd=Path.cwd(),
                  env=env,
                  capture_output=True,
                  text=True,
                  check=True,
              )
          print(completed.stderr)
          assert 'Failed to find font weight' not in completed.stderr, completed.stderr
          print('TASK14_FONT_WARNING=ABSENT')
          PY
      - name: Compile source
        run: python -m compileall -q src/engcalc_colab
      - name: Run complete source suite
        run: python -m pytest -q
      - name: Verify minimal fix scope
        shell: bash
        run: |
          git diff --check
          changed=$(git status --porcelain | awk '{print $2}')
          unexpected=$(printf '%s\n' "$changed" | grep -Ev '^(src/engcalc_colab/plotting\.py|src/engcalc_colab/presentation\.py)$' || true)
          if [ -n "$unexpected" ]; then
            echo 'Unexpected font-weight fix paths:'
            echo "$unexpected"
            exit 1
          fi
          git diff -- src/engcalc_colab/plotting.py src/engcalc_colab/presentation.py
      - name: Commit supported title-weight fix
        shell: bash
        run: |
          git add -- src/engcalc_colab/plotting.py src/engcalc_colab/presentation.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: use supported plot title weight'
          git push origin HEAD:feature/v0.9.2-audit-reliability
