name: v0.9.2 Task 14 Release

on:
  push:
    branches:
      - feature/v0.9.2-audit-reliability

permissions:
  contents: read

jobs:
  font-warning-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Prove persistent title-weight regression is RED
        shell: bash
        run: |
          set +e
          python -m pytest \
            tests/test_plotting.py::test_presented_plot_title_uses_supported_numeric_weight_700 \
            -q > task14-font-red.log 2>&1
          code=$?
          set -e
          cat task14-font-red.log
          if [ "$code" -eq 0 ]; then
            echo 'Task 14 font-weight RED unexpectedly passed.'
            exit 1
          fi
          grep -Fq 'assert 600 == 700' task14-font-red.log
          grep -Fq '1 failed' task14-font-red.log
          ! grep -q '^ERROR ' task14-font-red.log
          echo 'TASK14_FONT_WEIGHT_RED=600_not_supported_target_700'
