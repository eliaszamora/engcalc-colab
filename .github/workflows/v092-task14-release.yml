name: v0.9.2 Task 14 Release

on:
  push:
    branches:
      - feature/v0.9.2-audit-reliability

permissions:
  contents: read

jobs:
  final-release-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Verify final 0.9.2 release surfaces
        shell: bash
        run: |
          grep -Fq 'version = "0.9.2"' pyproject.toml
          grep -Fq '__version__ = "0.9.2"' src/engcalc_colab/__init__.py
          grep -Fq 'Current version: **0.9.2**.' README.md
          grep -Fq 'Version: `0.9.2`.' README.md
          test -f .github/workflows/ci.yml
          ! grep -R "fontweight=600" -n src/engcalc_colab/plotting.py src/engcalc_colab/presentation.py
          grep -R "fontweight=700" -n src/engcalc_colab/plotting.py src/engcalc_colab/presentation.py
      - name: Compile source
        run: python -m compileall -q src/engcalc_colab
      - name: Run final release contract
        run: |
          python -m pytest \
            tests/test_version.py \
            tests/test_packaging.py \
            tests/test_packaging_metadata.py \
            tests/test_parser.py::test_package_version_and_statement_model \
            tests/test_characteristics_acceptance.py \
            tests/test_v092_audit_regressions.py \
            tests/test_characteristics_plot_integration.py \
            tests/test_plotting.py -q
      - name: Run pre-wheel hygiene
        run: git diff --check origin/main...HEAD
      - name: Run complete source suite before wheel
        run: python -m pytest -q
      - name: Build definitive real wheel and inspect metadata
        shell: bash
        run: |
          python -m pip install build
          rm -rf dist build
          python -m build --wheel
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile

          wheels = list(Path('dist').glob('engcalc_colab-0.9.2-*.whl'))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          with zipfile.ZipFile(wheel) as zf:
              metadata_name = next(name for name in zf.namelist() if name.endswith('.dist-info/METADATA'))
              metadata = zf.read(metadata_name).decode('utf-8')
          assert 'Version: 0.9.2' in metadata
          assert 'Requires-Python: >=3.10' in metadata
          assert 'ipython' in metadata.lower()
          Path('wheel.env').write_text(
              f'WHEEL_NAME={wheel.name}\nWHEEL_SHA256={digest}\n',
              encoding='utf-8',
          )
          print(f'WHEEL_NAME={wheel.name}')
          print(f'WHEEL_SHA256={digest}')
          print('WHEEL_METADATA=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: engcalc-colab-0.9.2-definitive-wheel
          path: dist/engcalc_colab-0.9.2-*.whl
      - name: Run external installed-wheel smoke
        shell: bash
        run: |
          source wheel.env
          VENV=/tmp/engcalc-v092-final-wheel
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install --upgrade pip
          "$VENV/bin/python" -m pip install "$PWD/dist/$WHEEL_NAME"
          cd /tmp
          "$VENV/bin/python" "$GITHUB_WORKSPACE/.github/scripts/v092_task14_release_candidate.py" smoke
      - name: Prove installed wheel has no clean-font-cache warning
        shell: bash
        run: |
          VENV=/tmp/engcalc-v092-final-wheel
          cd /tmp
          "$VENV/bin/python" - <<'PY'
          import os
          import subprocess
          import tempfile

          code = r'''
          import matplotlib
          matplotlib.use("Agg")
          from engcalc_colab.engine import EngineeringEngine
          from engcalc_colab.parser import parse_cell
          from engcalc_colab.plotting import render_plot
          from engcalc_colab.presentation import render_presented_plot

          engine = EngineeringEngine()
          result = None
          for statement in parse_cell('f(x)=-(x-1/3)^2+2\nplot(f(x), x, 0, 1, title="Test")'):
              result = engine.evaluate(statement)
          render_plot(result)
          render_presented_plot(result)
          '''
          with tempfile.TemporaryDirectory() as mpl_config:
              env = os.environ.copy()
              env['MPLCONFIGDIR'] = mpl_config
              completed = subprocess.run(
                  ['/tmp/engcalc-v092-final-wheel/bin/python', '-c', code],
                  cwd='/tmp',
                  env=env,
                  capture_output=True,
                  text=True,
                  check=True,
              )
          print(completed.stderr)
          assert 'Failed to find font weight' not in completed.stderr, completed.stderr
          print('TASK14_INSTALLED_FONT_WARNING=ABSENT')
          PY
      - name: Run complete installed-wheel suite source-free
        shell: bash
        run: |
          VENV=/tmp/engcalc-v092-final-wheel
          "$VENV/bin/python" -m pip install pytest
          rm -rf /tmp/engcalc-v092-final-installed-suite
          mkdir -p /tmp/engcalc-v092-final-installed-suite
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='src' \
            --exclude='dist' \
            --exclude='build' \
            --exclude='*.egg-info' \
            "$GITHUB_WORKSPACE/" /tmp/engcalc-v092-final-installed-suite/
          cd /tmp/engcalc-v092-final-installed-suite
          "$VENV/bin/python" - <<'PY'
          from pathlib import Path
          import engcalc_colab
          package_path = Path(engcalc_colab.__file__).resolve()
          print(f'INSTALLED_SUITE_IMPORT={package_path}')
          assert 'site-packages' in str(package_path)
          assert '/src/engcalc_colab' not in str(package_path)
          assert engcalc_colab.__version__ == '0.9.2'
          PY
          "$VENV/bin/python" -m pytest -q
      - name: Repeat complete source suite
        run: python -m pytest -q
      - name: Verify final tree is clean
        shell: bash
        run: |
          git diff --check
          git status --short
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'TASK14_FINAL_TREE=TRACKED_CLEAN'
