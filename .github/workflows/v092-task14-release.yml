name: v0.9.2 Task 14 Release

on:
  push:
    branches:
      - feature/v0.9.2-audit-reliability

permissions:
  contents: read

jobs:
  version-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Materialize intentional 0.9.2 expectations
        run: python .github/scripts/v092_task14_version_red.py
      - name: Prove version-only RED
        shell: bash
        run: |
          set +e
          python -m pytest \
            tests/test_version.py \
            tests/test_packaging.py \
            tests/test_packaging_metadata.py \
            tests/test_parser.py -q > task14-red.log 2>&1
          code=$?
          set -e
          cat task14-red.log
          if [ "$code" -eq 0 ]; then
            echo 'Task 14 RED unexpectedly passed.'
            exit 1
          fi
          count=$(grep -c '^FAILED ' task14-red.log || true)
          if [ "$count" -ne 8 ]; then
            echo "Expected exactly 8 version failures, got $count"
            exit 1
          fi
          for node in \
            'tests/test_version.py::test_runtime_version_is_0_9_2' \
            'tests/test_version.py::test_project_metadata_version_is_0_9_2' \
            'tests/test_version.py::test_readme_release_version_is_0_9_2' \
            'tests/test_version.py::test_readme_version_notes_cover_0_9_2_0_9_1_and_0_9_0' \
            'tests/test_packaging.py::test_pyproject_version_is_0_9_2' \
            'tests/test_packaging.py::test_runtime_version_is_0_9_2' \
            'tests/test_packaging_metadata.py::test_project_metadata_declares_notebook_runtime_and_python_floor' \
            'tests/test_parser.py::test_package_version_and_statement_model'; do
            grep -Fq "FAILED $node" task14-red.log || exit 1
          done
          grep -Fq '0.9.1' task14-red.log
          grep -Fq '0.9.2' task14-red.log
          ! grep -q '^ERROR ' task14-red.log
          echo 'TASK14_VERSION_RED=8 expected version mismatches only'

  release-candidate:
    needs: version-red
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize EngCalc 0.9.2 release candidate
        run: python .github/scripts/v092_task14_release_candidate.py materialize
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Compile source
        run: python -m compileall -q src/engcalc_colab
      - name: Run release contract
        run: |
          python -m pytest \
            tests/test_version.py \
            tests/test_packaging.py \
            tests/test_packaging_metadata.py \
            tests/test_parser.py::test_package_version_and_statement_model \
            tests/test_characteristics_acceptance.py \
            tests/test_v092_audit_regressions.py \
            tests/test_characteristics_plot_integration.py -q
      - name: Run pre-wheel hygiene
        run: git diff --check origin/main...HEAD
      - name: Run complete source suite before wheel
        run: python -m pytest -q
      - name: Build real wheel and inspect metadata
        shell: bash
        run: |
          python -m pip install build
          rm -rf dist build
          python -m build --wheel
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile

          wheels = list(Path('dist').glob('engcalc_colab-0.9.2-*.whl'))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          with zipfile.ZipFile(wheel) as zf:
              metadata_name = next(name for name in zf.namelist() if name.endswith('.dist-info/METADATA'))
              metadata = zf.read(metadata_name).decode('utf-8')
          assert 'Version: 0.9.2' in metadata
          assert 'ipython' in metadata.lower()
          Path('wheel.env').write_text(
              f'WHEEL_NAME={wheel.name}\nWHEEL_SHA256={digest}\n',
              encoding='utf-8',
          )
          print(f'WHEEL_NAME={wheel.name}')
          print(f'WHEEL_SHA256={digest}')
          print('WHEEL_METADATA=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: engcalc-colab-0.9.2-wheel
          path: dist/engcalc_colab-0.9.2-*.whl
      - name: Run external installed-wheel smoke
        shell: bash
        run: |
          source wheel.env
          VENV=/tmp/engcalc-v092-wheel
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install --upgrade pip
          "$VENV/bin/python" -m pip install "$PWD/dist/$WHEEL_NAME"
          cd /tmp
          "$VENV/bin/python" "$GITHUB_WORKSPACE/.github/scripts/v092_task14_release_candidate.py" smoke
      - name: Run complete installed-wheel suite source-free
        shell: bash
        run: |
          VENV=/tmp/engcalc-v092-wheel
          "$VENV/bin/python" -m pip install pytest
          rm -rf /tmp/engcalc-v092-installed-suite
          mkdir -p /tmp/engcalc-v092-installed-suite
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='src' \
            --exclude='dist' \
            --exclude='build' \
            --exclude='*.egg-info' \
            "$GITHUB_WORKSPACE/" /tmp/engcalc-v092-installed-suite/
          cd /tmp/engcalc-v092-installed-suite
          "$VENV/bin/python" - <<'PY'
          from pathlib import Path
          import engcalc_colab
          package_path = Path(engcalc_colab.__file__).resolve()
          print(f'INSTALLED_SUITE_IMPORT={package_path}')
          assert 'site-packages' in str(package_path)
          assert '/src/engcalc_colab' not in str(package_path)
          assert engcalc_colab.__version__ == '0.9.2'
          PY
          "$VENV/bin/python" -m pytest -q
      - name: Repeat complete source suite
        run: python -m pytest -q
      - name: Verify release candidate scope
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git diff --check
          changed=$(git status --porcelain | awk '{print $2}')
          unexpected=$(printf '%s\n' "$changed" | grep -Ev '^(README\.md|pyproject\.toml|src/engcalc_colab/__init__\.py|tests/test_version\.py|tests/test_packaging\.py|tests/test_packaging_metadata\.py|tests/test_parser\.py|wheel\.env)$' || true)
          if [ -n "$unexpected" ]; then
            echo 'Unexpected Task 14 release-candidate paths:'
            echo "$unexpected"
            exit 1
          fi
          grep -Fq 'version = "0.9.2"' pyproject.toml
          grep -Fq '__version__ = "0.9.2"' src/engcalc_colab/__init__.py
          grep -Fq 'Current version: **0.9.2**.' README.md
          test -f .github/workflows/ci.yml
          git diff --name-status
      - name: Commit validated 0.9.2 release surfaces
        shell: bash
        run: |
          git add -- \
            pyproject.toml \
            src/engcalc_colab/__init__.py \
            README.md \
            tests/test_version.py \
            tests/test_packaging.py \
            tests/test_packaging_metadata.py \
            tests/test_parser.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: EngCalc 0.9.2'
          git push origin HEAD:feature/v0.9.2-audit-reliability
