name: v0.9.2 Task 14 Release

on:
  push:
    branches:
      - feature/v0.9.2-audit-reliability

permissions:
  contents: read

jobs:
  font-warning-reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Reproduce clean-font-cache warning
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          code = r'''
          import matplotlib
          matplotlib.use("Agg")
          from engcalc_colab.engine import EngineeringEngine
          from engcalc_colab.parser import parse_cell
          from engcalc_colab.plotting import render_plot

          engine = EngineeringEngine()
          result = None
          for statement in parse_cell("f(x)=-(x-1/3)^2+2\nplot(f(x), x, 0, 1)"):
              result = engine.evaluate(statement)
          render_plot(result)
          '''
          with tempfile.TemporaryDirectory() as mpl_config:
              env = os.environ.copy()
              env["MPLCONFIGDIR"] = mpl_config
              completed = subprocess.run(
                  [sys.executable, "-c", code],
                  cwd=Path.cwd(),
                  env=env,
                  capture_output=True,
                  text=True,
                  check=True,
              )
          print(completed.stderr)
          assert "Failed to find font weight 600" in completed.stderr, completed.stderr
          print("TASK14_FONT_WARNING_REPRODUCED=fontweight600_falls_back_to_700")
          PY
