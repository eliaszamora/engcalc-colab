name: v0.9.2 Task 8 IDEMPOTENT

on:
  push:
    branches:
      - feature/v0.9.2-audit-reliability

jobs:
  task8-idempotent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]' ipython
      - name: Verify Task 8 product is already materialized
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          checks = {
              'src/engcalc_colab/renderer.py': [
                  'if isinstance(result, (RootsResult, IntersectionsResult, ExtremaResult)):',
                  'render_result does not support characteristic results; ',
                  'use render_characteristic_result',
              ],
              'src/engcalc_colab/characteristics.py': [
                  'from .errors import EngEvaluationError, diagnostic_hint',
                  'diagnostic_hint("unresolved_numeric_symbols", names=(name,))',
                  'missing numeric value for \'{name}\'. {hint}',
              ],
              'tests/test_renderer.py': [
                  'def test_render_result_rejects_characteristic_results_with_targeted_guidance(source):',
              ],
              'tests/test_characteristics_piecewise_extrema.py': [
                  'def test_piecewise_characteristic_missing_value_has_actionable_hint():',
                  'def test_piecewise_substitution_missing_branch_symbol_has_actionable_hint():',
              ],
          }
          missing = []
          for filename, needles in checks.items():
              text = Path(filename).read_text()
              for needle in needles:
                  if needle not in text:
                      missing.append(f'{filename}: {needle}')
          if missing:
              raise SystemExit('Task 8 product tree is incomplete:\n' + '\n'.join(missing))
          print('Task 8 product tree is already fully materialized.')
          PY
      - name: Compile
        run: python -m compileall -q src/engcalc_colab
      - name: Run Task 8 contracts
        run: |
          python -m pytest \
            tests/test_renderer.py \
            tests/test_characteristics_piecewise_extrema.py -q \
            -k 'render_result_rejects_characteristic_results_with_targeted_guidance or piecewise_characteristic_missing_value_has_actionable_hint or piecewise_substitution_missing_branch_symbol_has_actionable_hint'
      - name: Run focused Task 8 regression
        run: |
          python -m pytest \
            tests/test_renderer.py \
            tests/test_characteristics_rendering.py \
            tests/test_characteristics_magic.py \
            tests/test_magic.py \
            tests/test_characteristics_piecewise_extrema.py -q
      - name: Run complete source suite
        run: python -m pytest -q
      - name: Verify no second Task 8 product patch
        shell: bash
        run: |
          if git diff --quiet -- src/engcalc_colab tests; then
            echo 'No Task 8 product or test patch to commit.'
            exit 0
          fi
          echo 'Unexpected Task 8 product/test diff after idempotent verification:'
          git diff -- src/engcalc_colab tests
          exit 1
