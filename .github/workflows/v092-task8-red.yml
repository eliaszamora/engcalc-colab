name: v0.9.2 Task 8 GREEN

on:
  push:
    branches:
      - feature/v0.9.2-audit-reliability

permissions:
  contents: write

jobs:
  task8-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]' ipython
      - name: Apply Task 8 product and persistent tests
        run: python .github/scripts/v092_task8_green.py
      - name: Compile
        run: python -m compileall -q src/engcalc_colab
      - name: Run Task 8 contracts
        run: |
          python -m pytest \
            tests/test_renderer.py \
            tests/test_characteristics_piecewise_extrema.py -q \
            -k 'render_result_rejects_characteristic_results_with_targeted_guidance or piecewise_characteristic_missing_value_has_actionable_hint or piecewise_substitution_missing_branch_symbol_has_actionable_hint'
      - name: Run focused Task 8 regression
        run: |
          python -m pytest \
            tests/test_renderer.py \
            tests/test_characteristics_rendering.py \
            tests/test_characteristics_magic.py \
            tests/test_magic.py \
            tests/test_characteristics_piecewise_extrema.py -q
      - name: Run complete source suite
        run: python -m pytest -q
      - name: Commit Task 8 patch
        shell: bash
        run: |
          if git diff --quiet -- src/engcalc_colab tests; then
            echo 'No Task 8 product or test patch to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/engcalc_colab/renderer.py \
            src/engcalc_colab/characteristics.py \
            tests/test_renderer.py \
            tests/test_characteristics_piecewise_extrema.py
          git commit -m 'fix: make characteristic diagnostics explicit'
          git push origin HEAD:feature/v0.9.2-audit-reliability
