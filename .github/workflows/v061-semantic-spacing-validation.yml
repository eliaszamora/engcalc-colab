name: v0.6.1 semantic spacing validation

on:
  push:
    branches:
      - feature/v0.6.1-visual-polish-2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test environment
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython
      - name: Focused semantic spacing tests
        run: python -m pytest -q tests/test_semantic_row_spacing_v061.py
