name: v0.6.1 semantic spacing validation

on:
  push:
    branches:
      - feature/v0.6.1-visual-polish-2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source test environment
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython build
      - name: Focused semantic spacing tests
        run: python -m pytest -q tests/test_semantic_row_spacing_v061.py tests/test_magic.py tests/test_visual_polish_renderer_v061.py
      - name: Complete source suite
        run: python -m pytest -q
      - name: Build wheel
        run: python -m build --wheel
      - name: Install exact wheel in clean venv
        run: |
          python -m venv /tmp/engcalc-v061-semantic-spacing-wheel
          /tmp/engcalc-v061-semantic-spacing-wheel/bin/python -m pip install --upgrade pip
          /tmp/engcalc-v061-semantic-spacing-wheel/bin/python -m pip install dist/engcalc_colab-0.6.1-py3-none-any.whl pytest ipython
      - name: Smoke semantic spacing from installed wheel
        run: |
          cd /tmp
          PYTHONPATH= /tmp/engcalc-v061-semantic-spacing-wheel/bin/python - <<'PY'
          from engcalc_colab.engine import EngineeringEngine
          from engcalc_colab.parser import parse_cell
          from engcalc_colab.renderer import render_aligned_results

          def evaluate(source):
              engine = EngineeringEngine()
              return [engine.evaluate(stmt) for stmt in parse_cell(source)]

          solve_result = evaluate("R_Ac = solve(eq(R_Ac - qC*L, 0), R_Ac)")[-1]
          solve_latex = render_aligned_results([solve_result])
          assert r"\\[8pt]" in solve_latex
          assert r"\\[2pt]" not in solve_latex

          terms = " + ".join(f"a{i:02d}" for i in range(1, 41))
          wrapped_result = evaluate(f"A = {terms}")[-1]
          wrapped_latex = render_aligned_results([wrapped_result])
          assert r"\\[4pt]" in wrapped_latex
          assert r"\\[2pt]" not in wrapped_latex

          consecutive = evaluate("A = 1\nB = 2")
          assert r"\\[8pt]" in render_aligned_results(consecutive)
          blank = evaluate("A = 1\n\nB = 2")
          assert r"\\[16pt]" in render_aligned_results(blank)

          numeric_result = evaluate(
              "M_A = q*L^2/2\n"
              "q := 2*tonf/m\n"
              "L := 4*m\n"
              "numeric(M_A)"
          )[-1]
          numeric_latex = render_aligned_results([numeric_result])
          assert numeric_latex.count(r"\\[8pt]") == 2
          print("installed wheel semantic spacing smoke: PASS")
          PY
      - name: Complete suite against installed wheel
        run: |
          mv src /tmp/engcalc-v061-semantic-spacing-source
          PYTHONPATH= /tmp/engcalc-v061-semantic-spacing-wheel/bin/python -m pytest -q
          mv /tmp/engcalc-v061-semantic-spacing-source src
      - name: Repeat source suite
        run: python -m pytest -q
