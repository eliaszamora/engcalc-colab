name: Apply EngCalc 0.7.2 Task 3

on:
  push:
    branches:
      - feature/v0.7.2-engineering-tables
    paths:
      - tools/apply_v072_task3.py
      - .github/workflows/v072-task3-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.2-engineering-tables
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch
        run: python tools/apply_v072_task3.py
      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engcalc_colab/engine.py
          git diff --cached --quiet && exit 0
          git commit -m "feat: evaluate engineering tables"
          git push origin HEAD:feature/v0.7.2-engineering-tables
