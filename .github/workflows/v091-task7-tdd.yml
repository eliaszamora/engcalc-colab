name: EngCalc 0.9.1 Task 7 TDD

on:
  push:
    branches:
      - feature/v0.9.1-exact-characteristics

permissions:
  contents: write

jobs:
  task7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test environment
        run: python -m pip install -e '.[dev]'

      - name: Apply guarded Task 7 GREEN patch when needed
        shell: bash
        run: |
          if grep -q '^_FALLBACK_SCAN_COUNT = 1025$' src/engcalc_colab/characteristics.py; then
            echo 'Task 7 fallback already present; skipping patch.'
          else
            python .github/scripts/v091_task7_green.py
          fi

      - name: Check diff hygiene
        run: git diff --check

      - name: Run Task 7 focused regression gate
        run: >-
          python -m pytest
          tests/test_characteristics_fallback.py
          tests/test_characteristics_roots.py
          tests/test_characteristics_intersections.py
          tests/test_characteristics_extrema.py
          tests/test_characteristics_piecewise_extrema.py
          -q

      - name: Commit verified Task 7 product patch
        shell: bash
        run: |
          if git diff --quiet -- src/engcalc_colab/characteristics.py; then
            echo 'No product patch to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engcalc_colab/characteristics.py
          git commit -m 'feat: add deterministic characteristic fallback'
          git push origin HEAD:feature/v0.9.1-exact-characteristics
