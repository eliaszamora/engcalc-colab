name: EngCalc 0.9.1 Task 10 TDD

on:
  push:
    branches:
      - feature/v0.9.1-exact-characteristics

permissions:
  contents: write

jobs:
  task10:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test environment
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython

      # Idempotent recheck after the verified Task 10 product commit.
      - name: Apply guarded Task 10 GREEN patch when needed
        shell: bash
        run: |
          if grep -q 'characteristics: tuple\[CharacteristicPoint, \.\.\.\]' src/engcalc_colab/models.py; then
            echo 'Task 10 exact plot characteristics already present; skipping base patch.'
          else
            python .github/scripts/v091_task10_green.py
            python .github/scripts/v091_task10_green_fix.py
          fi

      - name: Check diff hygiene
        run: git diff --check

      - name: Run Task 10 focused regression gate
        run: >-
          python -m pytest
          tests/test_characteristics_plot_integration.py
          tests/test_characteristic_requests.py
          tests/test_plot_engine.py
          tests/test_plotting.py
          tests/test_piecewise_plotting.py
          tests/test_dense_characteristic_summary.py
          tests/test_dense_characteristic_label_layout.py
          tests/test_compact_characteristic_labels_v061.py
          -q

      - name: Commit verified Task 10 product patch
        shell: bash
        run: |
          if git diff --quiet -- src/engcalc_colab/models.py src/engcalc_colab/engine.py src/engcalc_colab/plotting.py; then
            echo 'No product patch to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engcalc_colab/models.py src/engcalc_colab/engine.py src/engcalc_colab/plotting.py
          git commit -m 'feat: use exact characteristics in ordinary plots'
          git push origin HEAD:feature/v0.9.1-exact-characteristics
