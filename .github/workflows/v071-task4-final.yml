name: EngCalc 0.7.1 Task 4 Final

on:
  push:
    branches:
      - feature/v0.7.1-multiarg-partial-eval

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]' ipython
      - name: Focused Task 4 contracts
        run: pytest tests/test_partial_numeric_general.py tests/test_numeric_function_arguments.py tests/test_scalar_math_acceptance.py -q
      - name: Full source suite
        run: pytest -q
