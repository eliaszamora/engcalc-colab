name: align roadmap numeric ergonomics to 0.6.2

on:
  push:
    branches:
      - planning/engcalc-evolution-roadmap

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Align roadmap version labels
        run: |
          python - <<'PY'
          from pathlib import Path

          spec = Path('docs/superpowers/specs/2026-08-28-engcalc-evolution-roadmap-design.md')
          text = spec.read_text()
          text = text.replace(
              '## Release roadmap\n\n### 0.6.1 — symbolic/numeric ergonomics and diagnostic quality',
              '## Release roadmap\n\n**Versioning reconciliation (2026-08-29):** the release that actually shipped as 0.6.1 became the visual/presentation release. The numeric-ergonomics milestone below is therefore 0.6.2; 0.7.0 and every later milestone keep their existing numbers and scope.\n\n### 0.6.2 — symbolic/numeric ergonomics and diagnostic quality',
              1,
          )
          spec.write_text(text)

          plan = Path('docs/superpowers/plans/2026-08-28-engcalc-evolution-roadmap-implementation.md')
          text = plan.read_text()
          text = text.replace(
              'Suggested branch: `feature/v0.6.1-numeric-ergonomics`.',
              'Suggested branch: `feature/v0.6.2-numeric-ergonomics`.',
              1,
          )
          text = text.replace(
              '### Task 1: EngCalc 0.6.1 — Symbolic/Numeric Ergonomics and Diagnostics',
              '### Task 1: EngCalc 0.6.2 — Symbolic/Numeric Ergonomics and Diagnostics',
              1,
          )
          marker = '### Task 1: EngCalc 0.6.2 — Symbolic/Numeric Ergonomics and Diagnostics\n\n'
          if '**Versioning reconciliation (2026-08-29):**' not in text:
              text = text.replace(
                  marker,
                  marker + '**Versioning reconciliation (2026-08-29):** actual EngCalc 0.6.1 shipped as the visual/presentation release, so this unchanged numeric-ergonomics scope is implemented as 0.6.2. Milestone 0.7.0 and later numbering remains unchanged.\n\n',
                  1,
              )
          text = text.replace(
              'Expected: all 0.6.0 tests plus new 0.6.1 tests PASS.',
              'Expected: all existing regression tests plus new 0.6.2 tests PASS.',
              1,
          )
          text = text.replace(
              '**Step 8: Update README and close release 0.6.1**',
              '**Step 8: Update README and close release 0.6.2**',
              1,
          )
          text = text.replace(
              'Bump both version declarations to 0.6.1 only now.',
              'Bump both version declarations to 0.6.2 only now.',
              1,
          )
          text = text.replace(
              'Commit message: `release: EngCalc 0.6.1 numeric ergonomics`.',
              'Commit message: `release: EngCalc 0.6.2 numeric ergonomics`.',
              1,
          )
          text = text.replace(
              '0.6.1 numeric ergonomics\n   ↓\n0.7.0 scalar math',
              '0.6.2 numeric ergonomics\n   ↓\n0.7.0 scalar math',
              1,
          )
          plan.write_text(text)

          # Fail rather than silently committing a partial alignment.
          assert '### 0.6.2 — symbolic/numeric ergonomics and diagnostic quality' in spec.read_text()
          aligned = plan.read_text()
          assert '### Task 1: EngCalc 0.6.2 — Symbolic/Numeric Ergonomics and Diagnostics' in aligned
          assert 'feature/v0.6.2-numeric-ergonomics' in aligned
          assert '0.6.2 numeric ergonomics\n   ↓\n0.7.0 scalar math' in aligned
          assert 'Task 1: EngCalc 0.6.1' not in aligned
          PY

      - name: Commit roadmap alignment
        run: |
          git config user.name "eliaszamora"
          git config user.email "37598447+eliaszamora@users.noreply.github.com"
          git add docs/superpowers/specs/2026-08-28-engcalc-evolution-roadmap-design.md \
                  docs/superpowers/plans/2026-08-28-engcalc-evolution-roadmap-implementation.md
          git diff --cached --check
          git commit -m "docs: align numeric ergonomics roadmap to 0.6.2"
          git push
