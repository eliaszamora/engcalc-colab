name: EngCalc 0.7.2 Final Distribution Gate

on:
  push:
    branches:
      - feature/v0.7.2-engineering-tables
    paths:
      - .github/workflows/v072-task6-distribution.yml
      - tests/test_parser.py

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install source validation tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install ipython build

      - name: Verify release contracts
        run: python -m pytest -q tests/test_version.py tests/test_packaging.py

      - name: Verify table feature subset
        run: >-
          python -m pytest -q
          tests/test_table_parser.py
          tests/test_table_points.py
          tests/test_table_engine.py
          tests/test_table_rendering.py
          tests/test_table_acceptance.py
          tests/test_magic.py

      - name: Verify complete source suite
        run: python -m pytest -q

      - name: Build final 0.7.2 wheel
        run: |
          rm -rf dist build
          python -m build --wheel
          test -f dist/engcalc_colab-0.7.2-py3-none-any.whl
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = Path('dist/engcalc_colab-0.7.2-py3-none-any.whl')
          with zipfile.ZipFile(wheel) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith('.dist-info/METADATA'))
              metadata = archive.read(metadata_name).decode('utf-8')
          assert 'Name: engcalc-colab' in metadata
          assert 'Version: 0.7.2' in metadata
          print(wheel.name)
          PY

      - name: Create clean installed-wheel environment
        run: |
          rm -rf /tmp/engcalc-v072-venv
          python -m venv /tmp/engcalc-v072-venv
          /tmp/engcalc-v072-venv/bin/python -m pip install --upgrade pip
          /tmp/engcalc-v072-venv/bin/python -m pip install dist/engcalc_colab-0.7.2-py3-none-any.whl pytest ipython

      - name: External installed-wheel smoke
        working-directory: /tmp
        env:
          PYTHONPATH: ''
          MPLBACKEND: Agg
        run: |
          /tmp/engcalc-v072-venv/bin/python - <<'PY'
          import math
          from pathlib import Path

          import engcalc_colab
          from IPython.display import HTML, Math
          from matplotlib.figure import Figure
          from engcalc_colab.engine import EngineeringEngine
          from engcalc_colab.models import TableResult
          from engcalc_colab.parser import parse_cell

          assert engcalc_colab.__version__ == '0.7.2'
          module_path = Path(engcalc_colab.__file__).resolve()
          assert 'site-packages' in str(module_path), module_path
          assert '/home/runner/work/engcalc-colab/engcalc-colab/src' not in str(module_path), module_path

          def eval_cell(engine, text):
              return [engine.evaluate(stmt) for stmt in parse_cell(text)]

          engine = EngineeringEngine()
          eval_cell(
              engine,
              'M(x) = q*x*(L-x)/2\n'
              'M_D(x) = qD*x*(L-x)/2\n'
              'M_L(x) = qL*x*(L-x)/2\n'
              'M_base(x, q, L) = q*x*(L-x)/2\n'
              'q := 4*kN/m\n'
              'qD := 4*kN/m\n'
              'qL := 2*kN/m\n'
              'L := 5*m',
          )

          automatic = eval_cell(engine, 'table(M(x), x, 0, L, 21)')[-1]
          assert isinstance(automatic, TableResult)
          assert len(automatic.point_values) == 21
          assert math.isclose(automatic.point_values[10].to('m').magnitude, 2.5)
          assert math.isclose(automatic.columns[0].values[10].to('kN*m').magnitude, 12.5)

          unit_once = eval_cell(engine, 'table(M(x), x, [0, 1, 2], m)')[-1]
          assert [round(point.to('m').magnitude, 12) for point in unit_once.point_values] == [0, 1, 2]

          mixed = eval_cell(engine, 'table(M(x), x, [0*m, 50*cm, 1*m])')[-1]
          assert [round(point.to('m').magnitude, 12) for point in mixed.point_values] == [0, 0.5, 1]

          multi = eval_cell(engine, 'table(M_D(x), M_L(x), x, 0, L, 3)')[-1]
          assert [column.display_label for column in multi.columns] == ['M_D(x)', 'M_L(x)']

          descending = eval_cell(engine, 'table(M(x), x, L, 0, 3)')[-1]
          assert [round(point.to('m').magnitude, 12) for point in descending.point_values] == [5, 2.5, 0]

          plot_result = eval_cell(engine, 'plot(M_base(x, qD, L), x, 0, L)')[-1]
          assert len(plot_result.x_values) == 201
          assert math.isclose(plot_result.x_values[-1].to('m').magnitude, 5.0)

          import engcalc_colab.magic as magic_module

          displayed = []
          magic_module.display = displayed.append
          magics = magic_module.EngMagics(shell=None)
          magics.eng(
              '',
              'M_base(x, q, L) = q*x*(L-x)/2\n'
              'qD := 10*kN/m\n'
              'L := 4*m\n'
              'numeric(M_base(2*m, qD, L), kN*m)\n'
              'numeric(M_base(x, qD, L))',
          )
          assert [type(item) for item in displayed] == [Math]
          assert '20.00' in displayed[0].data
          assert 'x' in displayed[0].data

          displayed.clear()
          magics = magic_module.EngMagics(shell=None)
          magics.eng(
              '',
              '## Simply supported beam\n'
              'M(x) = q*x*(L-x)/2\n'
              'q := 4*kN/m\n'
              'L := 5*m\n'
              'table(M(x), x, 0, L, 5)\n'
              'plot(M(x), x, 0, L)\n'
              'A = q*L',
          )
          assert [type(item) for item in displayed] == [HTML, Math, HTML, Figure, Math]
          assert 'engcalc-table' in displayed[2].data
          assert len(displayed[3].axes[0].lines) >= 1

          print('external installed-wheel smoke: PASS')
          PY

      - name: Prepare source-free installed-wheel test tree
        run: |
          rm -rf /tmp/engcalc-v072-sourcefree
          mkdir -p /tmp/engcalc-v072-sourcefree
          cp -a tests /tmp/engcalc-v072-sourcefree/tests
          cp pyproject.toml README.md /tmp/engcalc-v072-sourcefree/
          test ! -e /tmp/engcalc-v072-sourcefree/src

      - name: Verify complete suite against installed wheel source-free
        working-directory: /tmp/engcalc-v072-sourcefree
        env:
          PYTHONPATH: ''
          MPLBACKEND: Agg
        run: /tmp/engcalc-v072-venv/bin/python -m pytest -q

      - name: Repeat complete source suite
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q

      - name: Record wheel SHA-256
        run: |
          sha256sum dist/engcalc_colab-0.7.2-py3-none-any.whl | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: engcalc-colab-0.7.2-final-wheel
          path: |
            dist/engcalc_colab-0.7.2-py3-none-any.whl
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
