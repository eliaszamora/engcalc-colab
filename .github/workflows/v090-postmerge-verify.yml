name: EngCalc 0.9.0 post-merge verification

on:
  push:
    branches:
      - feature/v0.9.0-matrix-cas
    paths:
      - .github/workflows/v090-postmerge-verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d22d5e0a62ce13800de8476c28d86a6d9415f1bd
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install merged package
        run: python -m pip install -e '.[dev]' ipython
      - name: Verify merged main tree
        shell: bash
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = "d22d5e0a62ce13800de8476c28d86a6d9415f1bd"
          python -m compileall -q src/engcalc_colab
          git diff --check
          python -m pytest -q
