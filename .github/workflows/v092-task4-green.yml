name: v0.9.2 Task 4 GREEN

on:
  push:
    branches:
      - feature/v0.9.2-audit-reliability

permissions:
  contents: write

jobs:
  task4-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply Task 4 patch
        run: python .github/scripts/v092_task4_green.py
      - name: Compile
        run: python -m compileall -q src/engcalc_colab
      - name: Run shared zero-set GREEN gate
        run: |
          python -m pytest \
            tests/test_characteristics_intersections.py \
            tests/test_characteristics_roots.py \
            tests/test_characteristics_fallback.py \
            tests/test_characteristics_engine.py -q
      - name: Run natural C-1 acceptance
        run: python -m pytest tests/test_v092_audit_regressions.py -q -k 'not abs_extrema'
      - name: Confirm H-1 remains isolated for Task 5
        shell: bash
        run: |
          set +e
          output=$(python -m pytest tests/test_v092_audit_regressions.py -q -k 'abs_extrema' 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 1 ]; then
            echo "Expected H-1 abs extrema to remain RED before Task 5; got status $status"
            exit 1
          fi
          echo "$output" | grep -q '1 failed'
      - name: Commit Task 4 product patch
        shell: bash
        run: |
          if git diff --quiet -- src/engcalc_colab/characteristics.py; then
            echo 'No Task 4 product patch to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engcalc_colab/characteristics.py
          git commit -m 'fix: share zero-set semantics for intersections'
          git push origin HEAD:feature/v0.9.2-audit-reliability
