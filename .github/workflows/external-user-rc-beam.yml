name: External User RC Beam

on:
  pull_request:

jobs:
  external-user:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            mode: colab-like
          - python-version: "3.13"
            mode: modern-clean

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install --upgrade pip

      - name: Start from Colab's IPython when applicable
        if: matrix.mode == 'colab-like'
        run: python -m pip install 'ipython==7.34.0'

      - name: Install EngCalc exactly as an external user
        run: |
          cd /tmp
          python -m pip install --no-cache-dir 'git+https://github.com/eliaszamora/engcalc-colab.git@44a02cbfe47aefb23aca93692a2735d7ae72a112'
          python - <<'PY'
          import importlib.metadata as md
          import IPython
          print('engcalc-colab', md.version('engcalc-colab'))
          print('IPython', IPython.__version__)
          PY

      - name: Run published RC beam exercise through public %%eng surface
        run: |
          cd /tmp
          python "$GITHUB_WORKSPACE/qa_external/rc_beam_external_user.py"
