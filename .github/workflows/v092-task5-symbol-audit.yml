name: v0.9.2 Task 5 Symbol Audit

on:
  push:
    branches:
      - feature/v0.9.2-audit-reliability

jobs:
  symbol-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit SymPy symbol construction
        run: |
          grep -R "sp\.Symbol\|sp\.symbols" -n src/engcalc_colab || true
