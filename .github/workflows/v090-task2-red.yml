name: EngCalc 0.9.0 Task 2 RED

on:
  push:
    branches:
      - feature/v0.9.0-matrix-cas
    paths:
      - .github/workflows/v090-task2-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.9.0-matrix-cas
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e '.[dev]' ipython
      - name: Confirm expected Task 2 RED
        shell: bash
        run: |
          set +e
          python -m pytest tests/test_matrix_symbolic.py tests/test_matrix_indexing.py tests/test_matrix_diagnostics.py -q 2>&1 | tee task2-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Task 2 unexpectedly passed before implementation"
            exit 1
          fi
          grep -Eq "failed" task2-red.log
          grep -Eq "ImmutableMatrix|unsupported syntax 'Subscript'|unsupported syntax 'List'|dimension mismatch|symbolic evaluation failed|matrix" task2-red.log
      - uses: actions/upload-artifact@v4
        with:
          name: task2-red-log
          path: task2-red.log
