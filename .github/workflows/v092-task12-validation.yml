name: v0.9.2 Task 12 Validation

on:
  push:
    branches:
      - feature/v0.9.2-audit-reliability

permissions:
  contents: read

jobs:
  pre-refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Compile pre-refactor source
        run: python -m compileall -q src/engcalc_colab
      - name: Run complete pre-refactor suite
        run: python -m pytest -q
