name: EngCalc 0.6.1 result command validation

on:
  push:
    branches:
      - feature/v0.6.1-visual-polish-2

jobs:
  result-command:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source and release tooling
        run: python -m pip install -e '.[dev]' ipython build
      - name: Verify diff and source version
        run: |
          git diff --check origin/main...HEAD
          python - <<'PY'
          import engcalc_colab
          assert engcalc_colab.__version__ == '0.6.1'
          print('source version:', engcalc_colab.__version__)
          PY
      - name: Focused result command tests
        run: pytest -q tests/test_result_command_v061.py
      - name: Complete source suite
        run: pytest -q
      - name: Build exact 0.6.1 wheel
        run: |
          rm -rf dist build
          python -m build --wheel
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test -f dist/engcalc_colab-0.6.1-py3-none-any.whl
      - name: Install wheel into clean venv
        run: |
          python -m venv /tmp/engcalc-v061-result-wheel
          /tmp/engcalc-v061-result-wheel/bin/python -m pip install -q --upgrade pip
          /tmp/engcalc-v061-result-wheel/bin/python -m pip install dist/engcalc_colab-0.6.1-py3-none-any.whl
          /tmp/engcalc-v061-result-wheel/bin/python -m pip install -q pytest ipython
      - name: Installed-wheel result smoke from /tmp
        run: |
          cd /tmp
          PYTHONPATH= /tmp/engcalc-v061-result-wheel/bin/python - <<'PY'
          import engcalc_colab
          from engcalc_colab.engine import EngineeringEngine
          from engcalc_colab.parser import parse_cell
          from engcalc_colab.renderer import render_result

          assert engcalc_colab.__version__ == '0.6.1'
          engine = EngineeringEngine()
          for source in ('M_A = q*L^2/8', 'q := 2.8*tonf/m', 'L := 4*m'):
              engine.evaluate(parse_cell(source)[0])
          compact = render_result(engine.evaluate(parse_cell('result(M_A, kN*m)')[0]))
          detailed = render_result(engine.evaluate(parse_cell('numeric(M_A, kN*m)')[0]))
          assert '54.92' in compact
          assert '2.80' not in compact and '4.00' not in compact
          assert '2.80' in detailed and '4.00' in detailed
          print('installed-wheel result smoke: PASS')
          PY
      - name: Full suite against installed wheel
        run: |
          rm -rf /tmp/engcalc-result-wheel-test
          mkdir -p /tmp/engcalc-result-wheel-test
          cp -a . /tmp/engcalc-result-wheel-test/repo
          rm -rf /tmp/engcalc-result-wheel-test/repo/src
          cd /tmp/engcalc-result-wheel-test/repo
          PYTHONPATH= /tmp/engcalc-v061-result-wheel/bin/python -m pytest -q
      - name: Repeat source suite
        run: pytest -q
