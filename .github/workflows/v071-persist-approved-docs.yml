name: Persist EngCalc 0.7.1 approved design docs

on:
  push:
    branches:
      - feature/v0.7.1-multiarg-partial-eval

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.1-multiarg-partial-eval
          fetch-depth: 0
      - name: Copy approved spec and plan into persistent release tree
        run: |
          git fetch origin planning/v0.7.1-multiarg-partial-eval
          mkdir -p docs/superpowers/specs docs/superpowers/plans
          git show origin/planning/v0.7.1-multiarg-partial-eval:docs/superpowers/specs/2026-08-29-engcalc-v0.7.1-multiarg-partial-eval-design.md > docs/superpowers/specs/2026-08-29-engcalc-v0.7.1-multiarg-partial-eval-design.md
          git show origin/planning/v0.7.1-multiarg-partial-eval:docs/superpowers/plans/2026-08-29-engcalc-v0.7.1-multiarg-partial-eval-final.md > docs/superpowers/plans/2026-08-29-engcalc-v0.7.1-multiarg-partial-eval-final.md
          test -s docs/superpowers/specs/2026-08-29-engcalc-v0.7.1-multiarg-partial-eval-design.md
          test -s docs/superpowers/plans/2026-08-29-engcalc-v0.7.1-multiarg-partial-eval-final.md
      - name: Commit persistent design documents and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/specs/2026-08-29-engcalc-v0.7.1-multiarg-partial-eval-design.md
          git add docs/superpowers/plans/2026-08-29-engcalc-v0.7.1-multiarg-partial-eval-final.md
          git rm .github/workflows/v071-persist-approved-docs.yml
          git commit -m "docs: persist approved EngCalc 0.7.1 design"
          git push origin HEAD:feature/v0.7.1-multiarg-partial-eval
