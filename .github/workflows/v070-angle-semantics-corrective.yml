name: v0.7.0 angle semantics corrective

on:
  push:
    branches:
      - feature/v0.7.0-scalar-engineering-math

permissions:
  contents: write

jobs:
  angle-semantics-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install ipython

      - name: Apply minimal remaining angle-semantics corrective
        run: |
          python - <<'PY'
          from pathlib import Path

          numeric_path = Path('src/engcalc_colab/numeric.py')
          numeric = numeric_path.read_text()
          old_numeric = '''    def evaluate_scalar_function(self, name: str, value):\n        quantity = self._as_quantity(value)\n\n        if name == "sqrt":\n'''
          new_numeric = '''    def _has_explicit_angle_unit(self, quantity) -> bool:\n        return (\n            quantity.units == self.ureg.degree\n            or quantity.units == self.ureg.radian\n        )\n\n    def evaluate_scalar_function(self, name: str, value):\n        quantity = self._as_quantity(value)\n\n        if name == "sqrt":\n'''
          if old_numeric in numeric:
              numeric = numeric.replace(old_numeric, new_numeric, 1)
          elif new_numeric not in numeric:
              raise SystemExit('numeric helper anchor not found')

          old_inverse = '''        if name in inverse_trig:\n            if not quantity.dimensionless:\n                raise EngEvaluationError(f"{name} requires a dimensionless argument")\n            magnitude = float(quantity.to_base_units().magnitude)\n'''
          new_inverse = '''        if name in inverse_trig:\n            if self._has_explicit_angle_unit(quantity) or not quantity.dimensionless:\n                raise EngEvaluationError(f"{name} requires a dimensionless argument")\n            magnitude = float(quantity.to_base_units().magnitude)\n'''
          if old_inverse in numeric:
              numeric = numeric.replace(old_inverse, new_inverse, 1)
          elif new_inverse not in numeric:
              raise SystemExit('numeric inverse-trig anchor not found')

          old_dimensionless = '''        if name in scalar_dimensionless:\n            if not quantity.dimensionless:\n                raise EngEvaluationError(f"{name} requires a dimensionless argument")\n            magnitude = float(quantity.to_base_units().magnitude)\n'''
          new_dimensionless = '''        if name in scalar_dimensionless:\n            if self._has_explicit_angle_unit(quantity) or not quantity.dimensionless:\n                raise EngEvaluationError(f"{name} requires a dimensionless argument")\n            magnitude = float(quantity.to_base_units().magnitude)\n'''
          if old_dimensionless in numeric:
              numeric = numeric.replace(old_dimensionless, new_dimensionless, 1)
          elif new_dimensionless not in numeric:
              raise SystemExit('numeric dimensionless-function anchor not found')
          numeric_path.write_text(numeric)

          engine_path = Path('src/engcalc_colab/engine.py')
          engine = engine_path.read_text()
          scalar_anchor = '''_SCALAR_SYMBOLIC_FUNCTIONS = {\n    "sqrt": sp.sqrt,\n    "sin": sp.sin,\n    "cos": sp.cos,\n    "tan": sp.tan,\n    "asin": sp.asin,\n    "acos": sp.acos,\n    "atan": sp.atan,\n    "exp": sp.exp,\n    "log": sp.log,\n}\n\n'''
          scalar_replacement = scalar_anchor + '''_INVERSE_TRIG_SYMBOLIC_FUNCTIONS = {sp.asin, sp.acos, sp.atan}\n\n\ndef _substitute_preserving_inverse_trig(expr, symbol, replacement):\n    expr = sp.sympify(expr)\n    if expr == symbol:\n        return replacement\n    if symbol not in expr.free_symbols:\n        return expr\n\n    rebuilt_args = tuple(\n        _substitute_preserving_inverse_trig(arg, symbol, replacement)\n        for arg in expr.args\n    )\n    if expr.func in _INVERSE_TRIG_SYMBOLIC_FUNCTIONS:\n        return expr.func(*rebuilt_args, evaluate=False)\n    return expr.func(*rebuilt_args)\n\n'''
          if '_substitute_preserving_inverse_trig' not in engine:
              if scalar_anchor not in engine:
                  raise SystemExit('engine scalar mapping anchor not found')
              engine = engine.replace(scalar_anchor, scalar_replacement, 1)

          old_function_call = '''            function = self.engine.functions[name]\n            parameter = self.engine.resolve_name(function.parameter)\n            return sp.sympify(function.expression).subs(parameter, args[0])\n'''
          new_function_call = '''            function = self.engine.functions[name]\n            parameter = self.engine.resolve_name(function.parameter)\n            expression = sp.sympify(function.expression)\n            if any(\n                item.func in _INVERSE_TRIG_SYMBOLIC_FUNCTIONS\n                for item in sp.preorder_traversal(expression)\n            ):\n                return _substitute_preserving_inverse_trig(\n                    expression, parameter, args[0]\n                )\n            return expression.subs(parameter, args[0])\n'''
          if old_function_call in engine:
              engine = engine.replace(old_function_call, new_function_call, 1)
          elif new_function_call not in engine:
              raise SystemExit('engine user-function substitution anchor not found')
          engine_path.write_text(engine)
          PY

          if git diff --quiet; then
            echo "corrective already applied"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/engcalc_colab/numeric.py src/engcalc_colab/engine.py
            git commit -m "fix: enforce scalar angle semantics"
            git push
          fi

      - name: Focused angle semantics and scalar contracts
        run: >-
          python -m pytest -q
          tests/test_scalar_math_angle_units.py
          tests/test_scalar_math_numeric.py
          tests/test_scalar_math_engine.py
          tests/test_scalar_math_acceptance.py
          tests/test_magic.py

      - name: Complete source suite
        run: python -m pytest -q
