name: EngCalc 0.6.0 final release gate

on:
  push:
    branches:
      - feature/v0.6.0-abs-envelope-panel

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install source test environment
        run: python -m pip install -e '.[dev]' ipython build

      - name: Verify source version
        run: |
          python - <<'PY'
          import engcalc_colab
          assert engcalc_colab.__version__ == '0.6.0', engcalc_colab.__version__
          print('Source install/version: PASS', engcalc_colab.__version__)
          PY

      - name: Source full suite
        run: pytest -q

      - name: Build wheel
        run: python -m build --wheel --outdir dist

      - name: Create clean wheel environment
        run: |
          python -m venv /tmp/engcalc-v060-wheel-venv
          /tmp/engcalc-v060-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/engcalc-v060-wheel-venv/bin/python -m pip install dist/engcalc_colab-0.6.0-py3-none-any.whl pytest ipython

      - name: Installed-wheel smoke from outside repository
        working-directory: /tmp
        run: |
          PYTHONPATH='' /tmp/engcalc-v060-wheel-venv/bin/python - <<'PY'
          import engcalc_colab
          from engcalc_colab.engine import EngineeringEngine
          from engcalc_colab.parser import parse_cell
          from engcalc_colab.plotting import render_plot
          from engcalc_colab.renderer import _display_rows, RenderSettings

          assert engcalc_colab.__version__ == '0.6.0'

          engine = EngineeringEngine()
          source = '''
          L := 4*m
          q1 := 2*tonf/m
          q2 := -3*tonf/m
          V1(x) = q1*(L-x)
          V2(x) = q2*(L-x)
          envelope(abs(V1(x)), abs(V2(x)), x, 0, L)
          '''
          result = None
          for statement in parse_cell(source):
              result = engine.evaluate(statement)
          assert result.kind == 'envelope'
          assert result.envelope_mode == 'magnitude'
          assert len(result.series) == 1
          assert len(result.source_series) == 2
          assert float(result.series[0].y_values[0].to('tonf').magnitude) == 12.0
          assert float(result.governing_signed[0].to('tonf').magnitude) == -12.0

          figure = render_plot(result)
          axis = figure.axes[0]
          assert len(axis.texts) >= 1
          assert not figure.texts
          assert [line.get_label() for line in axis.lines if not line.get_label().startswith('_')] == ['|V|_max(x)']

          long_engine = EngineeringEngine()
          long_result = long_engine.evaluate(parse_cell(
              'delta_B = integral((-q*(L-s)^2/2 + R_B_aux*(L-s))*(L-s), s, 0, L)'
          )[0])
          assert len(_display_rows(long_result, RenderSettings())) >= 2
          print('Installed-wheel smoke from /tmp: PASS')
          PY

      - name: Full suite against installed wheel
        working-directory: /tmp
        run: PYTHONPATH='' /tmp/engcalc-v060-wheel-venv/bin/python -m pytest "$GITHUB_WORKSPACE/tests" -q

      - name: Repeated source suite
        working-directory: ${{ github.workspace }}
        run: pytest -q
