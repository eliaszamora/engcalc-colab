name: EngCalc 0.6.0 symbolic wrapping validation

on:
  push:
    branches:
      - feature/v0.6.0-abs-envelope-panel

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test environment
        run: python -m pip install -e '.[dev]' ipython
      - name: Run full suite
        run: pytest -q
