name: EngCalc 0.6.1 compact label release gate

on:
  push:
    branches:
      - feature/v0.6.1-visual-polish-2

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install source and release tooling
        run: python -m pip install -e '.[dev]' ipython build

      - name: Verify branch diff and source version
        run: |
          git diff --check origin/main...HEAD
          python - <<'PY'
          import engcalc_colab
          assert engcalc_colab.__version__ == "0.6.1", engcalc_colab.__version__
          print("source version:", engcalc_colab.__version__)
          PY

      - name: Source suite
        run: pytest -q

      - name: Create 21-station branch regression data
        run: |
          cat > /tmp/envelope_regression.py <<'PY'
          import json
          import sys
          from engcalc_colab.engine import EngineeringEngine
          from engcalc_colab.parser import parse_cell

          def eval_cell(engine, text):
              return [engine.evaluate(stmt) for stmt in parse_cell(text)]

          engine = EngineeringEngine()
          eval_cell(engine, """
          L := 4*m
          qC := 2*tonf/m
          qD := 4*tonf/m
          qL := 3*tonf/m
          gC := 1.4
          gD := 1.2
          gL := 1.6
          R_Ac = solve(eq(R_Ac - qC*L, 0), R_Ac)
          M_Ac = solve(eq(M_Ac + qC*L^2/2, 0), M_Ac)
          V_c = R_Ac - integral(qC, s, 0, x)
          M_c = M_Ac + integral(subs(V_c, x, s), s, 0, x)
          V_C(x) = V_c
          M_C(x) = M_c
          delta_B = integral((-q*(L-s)^2/2 + R_B_aux*(L-s))*(L-s), s, 0, L)
          R_B(q) = solve(eq(delta_B, 0), R_B_aux)
          R_A(q) = solve(eq(R_A_aux + R_B(q) - q*L, 0), R_A_aux)
          M_A(q) = solve(eq(M_A_aux + q*L^2/2 - R_B(q)*L, 0), M_A_aux)
          V_prop = R_A(q) - integral(q, s, 0, x)
          M_prop = M_A(q) + integral(subs(V_prop, x, s), s, 0, x)
          V_D(x) = subs(V_prop, q, qD)
          M_D(x) = subs(M_prop, q, qD)
          V_L(x) = subs(V_prop, q, qL)
          M_L(x) = subs(M_prop, q, qL)
          V_UC(x) = gC*V_C(x)
          M_UC(x) = gC*M_C(x)
          V_UU(x) = gD*V_D(x) + gL*V_L(x)
          M_UU(x) = gD*M_D(x) + gL*M_L(x)
          """)
          moment = eval_cell(engine, "envelope(M_UC(x), M_UU(x), x, 0, L)")[-1]
          shear = eval_cell(engine, "envelope(abs(V_UC(x)), abs(V_UU(x)), x, 0, L)")[-1]
          indices = list(range(0, 201, 10))
          payload = {
              "x_m": [float(moment.x_values[i].to("m").magnitude) for i in indices],
              "Mu_max_tonf_m": [float(moment.series[0].y_values[i].to("tonf*m").magnitude) for i in indices],
              "Mu_min_tonf_m": [float(moment.series[1].y_values[i].to("tonf*m").magnitude) for i in indices],
              "Vu_abs_max_tonf": [float(shear.series[0].y_values[i].to("tonf").magnitude) for i in indices],
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
          PY
          python /tmp/envelope_regression.py /tmp/branch-21-stations.json

      - name: Compare 21 stations with merged 0.6.0
        run: |
          python -m venv /tmp/engcalc-v060
          /tmp/engcalc-v060/bin/python -m pip install -q --upgrade pip
          /tmp/engcalc-v060/bin/python -m pip install -q 'git+https://github.com/eliaszamora/engcalc-colab.git@8b13ede8a6993de734c2b49de429125265210e56'
          (cd /tmp && PYTHONPATH= /tmp/engcalc-v060/bin/python /tmp/envelope_regression.py /tmp/baseline-21-stations.json)
          python - <<'PY'
          import json
          branch = json.load(open('/tmp/branch-21-stations.json', encoding='utf-8'))
          baseline = json.load(open('/tmp/baseline-21-stations.json', encoding='utf-8'))
          assert branch.keys() == baseline.keys()
          worst = 0.0
          for key in branch:
              assert len(branch[key]) == len(baseline[key]) == 21
              for actual, expected in zip(branch[key], baseline[key], strict=True):
                  worst = max(worst, abs(actual - expected))
          assert worst <= 1e-9, worst
          print(f"21-station numerical regression: PASS; worst abs diff={worst:.3e}")
          PY

      - name: Build exact 0.6.1 wheel
        run: |
          rm -rf dist build
          python -m build --wheel
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test -f dist/engcalc_colab-0.6.1-py3-none-any.whl

      - name: Install wheel into clean venv
        run: |
          python -m venv /tmp/engcalc-v061-wheel
          /tmp/engcalc-v061-wheel/bin/python -m pip install -q --upgrade pip
          /tmp/engcalc-v061-wheel/bin/python -m pip install dist/engcalc_colab-0.6.1-py3-none-any.whl
          /tmp/engcalc-v061-wheel/bin/python -m pip install -q pytest ipython

      - name: Installed-wheel smoke from /tmp
        run: |
          cd /tmp
          PYTHONPATH= /tmp/engcalc-v061-wheel/bin/python - <<'PY'
          import importlib.metadata as metadata
          import engcalc_colab
          from engcalc_colab.engine import EngineeringEngine
          from engcalc_colab.parser import parse_cell
          assert metadata.version("engcalc-colab") == "0.6.1"
          assert engcalc_colab.__version__ == "0.6.1"
          engine = EngineeringEngine()
          results = [engine.evaluate(stmt) for stmt in parse_cell("L := 4*m\nq := 2*tonf/m\nA = q*L")]
          assert len(results) == 3
          print("installed-wheel smoke: PASS 0.6.1")
          PY

      - name: Full suite against installed wheel
        run: |
          rm -rf /tmp/engcalc-wheel-test
          mkdir -p /tmp/engcalc-wheel-test
          cp -a . /tmp/engcalc-wheel-test/repo
          rm -rf /tmp/engcalc-wheel-test/repo/src
          cd /tmp/engcalc-wheel-test/repo
          PYTHONPATH= /tmp/engcalc-v061-wheel/bin/python -m pytest -q

      - name: Repeat source suite
        run: pytest -q

      - name: Upload release wheel
        uses: actions/upload-artifact@v4
        with:
          name: engcalc-colab-0.6.1-compact-label-wheel
          path: dist/engcalc_colab-0.6.1-py3-none-any.whl
