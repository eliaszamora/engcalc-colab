name: EngCalc 0.7.2 Task 6 docs RED

on:
  push:
    branches:
      - feature/v0.7.2-engineering-tables
    paths:
      - tests/test_version.py
      - .github/workflows/v072-task6-doc-red.yml

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython
      - name: Verify release documentation contract is RED
        run: |
          set +e
          python -m pytest -q tests/test_version.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Release documentation contract unexpectedly passed before README cleanup."
            exit 1
          fi
          echo "Release documentation contract failed as expected before README cleanup."
