name: EngCalc 0.9.1 Task 3 TDD

on:
  push:
    branches:
      - feature/v0.9.1-exact-characteristics

permissions:
  contents: write

jobs:
  task3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test environment
        run: python -m pip install -e '.[dev]'

      - name: Apply guarded Task 3 GREEN patch
        run: python .github/scripts/v091_task3_green.py

      - name: Check diff hygiene
        run: git diff --check

      - name: Run Task 3 focused and Piecewise regression gate
        run: >-
          python -m pytest
          tests/test_characteristics_roots.py
          tests/test_characteristics_piecewise_topology.py
          tests/test_characteristics_models.py
          tests/test_piecewise_symbolic.py
          tests/test_piecewise_numeric.py
          tests/test_piecewise_plot_grid.py
          -q

      - name: Commit verified Task 3 product patch
        shell: bash
        run: |
          if git diff --quiet -- src/engcalc_colab/models.py src/engcalc_colab/characteristics.py; then
            echo 'No product patch to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engcalc_colab/models.py src/engcalc_colab/characteristics.py
          git commit -m 'feat: make root analysis Piecewise aware'
          git push origin HEAD:feature/v0.9.1-exact-characteristics
