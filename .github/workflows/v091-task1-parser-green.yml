name: Apply EngCalc 0.9.1 Task 1 parser GREEN

on:
  push:
    branches:
      - feature/v0.9.1-exact-characteristics

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message == 'ci: trigger EngCalc 0.9.1 Task 1 parser GREEN'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply minimal parser GREEN patch
        run: python .github/scripts/v091_task1_apply.py

      - name: Install test environment
        run: python -m pip install -e '.[dev]'

      - name: Run Task 1 parser GREEN gate
        run: >-
          python -m pytest
          tests/test_characteristics_parser.py
          tests/test_parser.py
          tests/test_piecewise_parser.py
          tests/test_matrix_parser.py
          -q

      - name: Check diff hygiene
        run: git diff --check

      - name: Commit verified parser GREEN
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engcalc_colab/parser.py
          git commit -m 'feat: validate characteristic analysis syntax'
          git push origin HEAD:feature/v0.9.1-exact-characteristics
