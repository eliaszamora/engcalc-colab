name: EngCalc 0.7.1 Task 5 Apply

on:
  push:
    branches:
      - feature/v0.7.1-multiarg-partial-eval

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.1-multiarg-partial-eval
          fetch-depth: 0
      - name: Apply deterministic renderer patch
        run: python .github/scripts/apply_v071_task5.py
      - name: Commit product change
        run: |
          if git diff --quiet -- src/engcalc_colab/renderer.py; then
            echo "Task 5 product patch produced no renderer change" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engcalc_colab/renderer.py
          git commit -m "feat: render multi-argument evaluations"
          git push origin HEAD:feature/v0.7.1-multiarg-partial-eval
