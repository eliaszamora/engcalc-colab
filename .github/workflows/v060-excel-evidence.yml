name: EngCalc 0.6.0 Excel Evidence

on:
  push:
    branches:
      - feature/v0.6.0-abs-envelope-panel

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install EngCalc branch
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Reproduce professor Excel example with EngCalc
        run: |
          mkdir -p evidence
          python - <<'PY'
          from pathlib import Path
          from math import isclose
          from engcalc_colab import __version__
          from engcalc_colab.engine import EngineeringEngine
          from engcalc_colab.parser import parse_cell
          from engcalc_colab.plotting import render_plot

          assert __version__ == "0.6.0"

          common = """
          L := 4*m
          pp_c := 2*tonf/m
          pp_u := 4*tonf/m
          sc_u := 3*tonf/m

          M_constr(x) = -1.4*pp_c*(L-x)^2/2
          V_constr(x) = 1.4*pp_c*(L-x)

          M_uso(x) = 1.2*(-pp_u*L^2/8 + 5*pp_u*L*x/8 - pp_u*x^2/2) + 1.6*(-sc_u*L^2/8 + 5*sc_u*L*x/8 - sc_u*x^2/2)
          V_uso(x) = 1.2*(5*pp_u*L/8 - pp_u*x) + 1.6*(5*sc_u*L/8 - sc_u*x)
          """

          def evaluate(last_statement):
              engine = EngineeringEngine()
              results = [engine.evaluate(stmt) for stmt in parse_cell(common + "\n" + last_statement)]
              return results[-1]

          cases = {
              "01_momentos_etapas.png": "plot(M_constr(x), M_uso(x), x, 0, L)",
              "02_momentos_envolvente.png": "envelope(M_constr(x), M_uso(x), x, 0, L)",
              "03_cortes_etapas.png": "plot(V_constr(x), V_uso(x), x, 0, L)",
              "04_corte_envolvente_absoluta.png": "envelope(abs(V_constr(x)), abs(V_uso(x)), x, 0, L)",
          }

          results = {}
          for filename, statement in cases.items():
              result = evaluate(statement)
              results[filename] = result
              fig = render_plot(result)
              fig.savefig(Path("evidence") / filename, dpi=160, bbox_inches="tight")

          # 21 rows copied from columns B/O/P/Q of the professor's Excel table.
          excel = [
              (0.0, -19.2, -22.4, 24.0),
              (0.2, -14.592, -20.216, 22.08),
              (0.4, -10.368, -18.144, 20.16),
              (0.6, -6.528, -16.184, 18.24),
              (0.8, -3.072, -14.336, 16.32),
              (1.0, 0.0, -12.6, 14.4),
              (1.2, 2.688, -10.976, 12.48),
              (1.4, 4.992, -9.464, 10.56),
              (1.6, 6.912, -8.064, 8.64),
              (1.8, 8.448, -6.776, 6.72),
              (2.0, 9.6, -5.6, 5.6),
              (2.2, 10.368, -4.536, 5.04),
              (2.4, 10.752, -3.584, 4.48),
              (2.5, 10.8, -3.15, 4.2),
              (2.8, 10.368, -2.016, 3.36),
              (3.0, 9.6, -1.4, 4.8),
              (3.2, 8.448, -0.896, 6.72),
              (3.4, 6.912, -0.504, 8.64),
              (3.6, 4.992, -0.224, 10.56),
              (3.8, 2.688, -0.056, 12.48),
              (4.0, 0.0, 0.0, 14.4),
          ]

          m_env = results["02_momentos_envolvente.png"]
          v_env = results["04_corte_envolvente_absoluta.png"]
          assert m_env.envelope_mode == "signed"
          assert v_env.envelope_mode == "magnitude"
          assert len(m_env.series) == 2
          assert len(v_env.series) == 1

          lines = [
              "EngCalc 0.6.0 vs profesor Excel — Ej 01",
              "Reference: Excel columns O=Mu max, P=Mu min, Q=|Vu| max",
              "Tolerance: 1e-9 tonf or tonf*m",
              "",
              "x [m] | Mmax Excel | Mmax EngCalc | Mmin Excel | Mmin EngCalc | |V|max Excel | |V|max EngCalc",
          ]

          for x, exp_mmax, exp_mmin, exp_vabs in excel:
              idx = round(x / 0.02)
              got_x = m_env.x_values[idx].to("m").magnitude
              assert isclose(got_x, x, rel_tol=0.0, abs_tol=1e-12)
              got_mmax = m_env.series[0].y_values[idx].to("tonf*m").magnitude
              got_mmin = m_env.series[1].y_values[idx].to("tonf*m").magnitude
              got_vabs = v_env.series[0].y_values[idx].to("tonf").magnitude
              assert isclose(got_mmax, exp_mmax, rel_tol=0.0, abs_tol=1e-9), (x, got_mmax, exp_mmax)
              assert isclose(got_mmin, exp_mmin, rel_tol=0.0, abs_tol=1e-9), (x, got_mmin, exp_mmin)
              assert isclose(got_vabs, exp_vabs, rel_tol=0.0, abs_tol=1e-9), (x, got_vabs, exp_vabs)
              lines.append(
                  f"{x:4.1f} | {exp_mmax:10.3f} | {got_mmax:12.3f} | {exp_mmin:10.3f} | {got_mmin:12.3f} | {exp_vabs:12.3f} | {got_vabs:14.3f}"
              )

          lines += [
              "",
              "RESULT: PASS — all 21 Excel stations match EngCalc for Mmax, Mmin and |V|max.",
              "EngCalc magnitude envelope retains the original signed source curves for context.",
          ]
          Path("evidence/validation.txt").write_text("\n".join(lines), encoding="utf-8")
          print(lines[-2])
          PY
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: engcalc-v060-excel-evidence
          path: evidence/
          if-no-files-found: error
