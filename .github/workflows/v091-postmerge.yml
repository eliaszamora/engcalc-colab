name: EngCalc 0.9.1 post-merge validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v091-postmerge.yml

permissions:
  contents: read

jobs:
  postmerge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test environment
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython

      - name: Verify release tree
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version = "0.9.1"' pyproject.toml
          grep -q '__version__ = "0.9.1"' src/engcalc_colab/__init__.py
          grep -q 'Current version: \*\*0.9.1\*\*' README.md
          python -m compileall -q src/engcalc_colab
          git diff --check HEAD^

      - name: Run committed release contract
        run: python -m pytest tests/test_version.py tests/test_packaging.py tests/test_parser.py -q

      - name: Run complete source suite
        run: python -m pytest -q
