name: EngCalc 0.9.0 Task 10 RED

on:
  push:
    branches:
      - feature/v0.9.0-matrix-cas
    paths:
      - .github/workflows/v090-task10-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.9.0-matrix-cas
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install current package
        run: python -m pip install -e '.[dev]' ipython
      - name: Confirm version-contract RED
        shell: bash
        run: |
          set +e
          python -m pytest tests/test_version.py tests/test_packaging.py tests/test_parser.py -q 2>&1 | tee task10-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Task 10 unexpectedly passed before the 0.9.0 release bump"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: task10-version-red-log
          path: task10-red.log
