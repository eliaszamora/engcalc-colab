name: EngCalc 0.8.0 Piecewise validation

on:
  push:
    branches:
      - feature/v0.8.0-piecewise

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]' ipython
      - name: Verify package version
        run: python -c "import engcalc_colab; assert engcalc_colab.__version__ == '0.7.2', engcalc_colab.__version__"
      - name: Run full test suite
        run: python -m pytest -q
