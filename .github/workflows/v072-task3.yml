name: EngCalc 0.7.2 Task 3

on:
  push:
    branches:
      - feature/v0.7.2-engineering-tables

jobs:
  task3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython
      - name: Task 3 focused tests
        run: python -m pytest -q tests/test_table_engine.py tests/test_engine.py tests/test_plot_engine.py tests/test_diagnostics.py
      - name: Complete source regression
        run: python -m pytest -q
