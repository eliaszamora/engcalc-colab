name: EngCalc 0.7.2 Task 1

on:
  push:
    branches:
      - feature/v0.7.2-engineering-tables

jobs:
  task1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Task 1 focused tests
        run: python -m pytest -q tests/test_table_parser.py tests/test_parser.py tests/test_plot_parser.py
