name: v0.6.2 numeric ergonomics

on:
  push:
    branches:
      - feature/v0.6.2-numeric-ergonomics

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source test environment
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython
      - name: Apply AST numeric-argument GREEN implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          numeric_path = Path('src/engcalc_colab/numeric.py')
          numeric = numeric_path.read_text()
          old_numeric = '''        overrides = overrides or {}
          names = sorted(symbol.name for symbol in expr.free_symbols)
          substitutions: dict[str, Any] = {}
          missing: list[str] = []
          for name in names:
              if name in overrides:
                  substitutions[name] = overrides[name]
              elif name in self.values:
                  substitutions[name] = self.values[name]
              elif name in _UNIT_ALIASES:
                  substitutions[name] = self.ureg.Unit(_UNIT_ALIASES[name])
              else:
                  missing.append(name)
          if missing:
              hint = diagnostic_hint("unresolved_numeric_symbols", names=tuple(missing))
              raise EngEvaluationError(
                  "numeric evaluation requires values for: "
                  + ", ".join(missing)
                  + f". {hint}"
              )
          '''
          new_numeric = '''        overrides = overrides or {}
          names = sorted(symbol.name for symbol in expr.free_symbols)
          missing = [
              name
              for name in names
              if name not in overrides and name not in self.values
          ]
          if missing:
              hint = diagnostic_hint("unresolved_numeric_symbols", names=tuple(missing))
              raise EngEvaluationError(
                  "numeric evaluation requires values for: "
                  + ", ".join(missing)
                  + f". {hint}"
              )

          substitutions = {
              name: overrides[name] if name in overrides else self.values[name]
              for name in names
          }
          '''
          if 'elif name in _UNIT_ALIASES:' in numeric:
              if old_numeric not in numeric:
                  raise SystemExit('evaluate_symbolic block not found')
              numeric = numeric.replace(old_numeric, new_numeric, 1)
          numeric_path.write_text(numeric)

          engine_path = Path('src/engcalc_colab/engine.py')
          engine = engine_path.read_text()

          old_generic = '''    def generic_visit(self, node):
              raise EngEvaluationError(f"unsupported syntax '{type(node).__name__}'")

          '''
          new_generic = '''    def generic_visit(self, node):
              raise EngEvaluationError(f"unsupported syntax '{type(node).__name__}'")

              def _resolve_numeric_function_argument(self, node: ast.AST):
              if isinstance(node, ast.Name):
                  symbolic = self.visit(node)
                  if (
                      isinstance(symbolic, sp.Symbol)
                      and self.engine.numeric_context.get(node.id) is None
                  ):
                      return symbolic
              return self.engine.numeric_context.evaluate_expression(
                  ast.Expression(body=node)
              )

          '''
          # The heredoc keeps leading spaces; normalize these two literals explicitly.
          old_generic = old_generic.replace('          ', '')
          new_generic = new_generic.replace('              def _resolve', '    def _resolve')
          new_generic = new_generic.replace('\n              if isinstance', '\n        if isinstance')
          new_generic = new_generic.replace('\n              return self.engine.numeric_context', '\n        return self.engine.numeric_context')
          if 'def _resolve_numeric_function_argument' not in engine:
              if old_generic not in engine:
                  raise SystemExit('generic_visit exact block not found')
              engine = engine.replace(old_generic, new_generic, 1)

          old_setup = '''                function = self.engine.functions[function_name]
                  argument_node = argument.args[0]
                  argument_expression = self.visit(argument_node)
                  symbolic_expression = sp.sympify(function.expression)
                  display_name = function_name
                  display_argument = argument_expression
          '''
          old_setup = old_setup.replace('\n                  ', '\n                ').rstrip() + '\n'
          new_setup = '''                function = self.engine.functions[function_name]
                  argument_node = argument.args[0]
                  argument_expression = self.visit(argument_node)
                  argument_value = self._resolve_numeric_function_argument(argument_node)
                  symbolic_expression = sp.sympify(function.expression)
                  display_name = function_name
                  display_argument = argument_expression
          '''
          new_setup = new_setup.replace('\n                  ', '\n                ').rstrip() + '\n'
          if 'argument_value = self._resolve_numeric_function_argument(argument_node)' not in engine:
              if old_setup not in engine:
                  raise SystemExit('numeric function setup exact block not found')
              engine = engine.replace(old_setup, new_setup, 1)

          engine = engine.replace(
              '                    and isinstance(argument_expression, sp.Symbol)\n',
              '                    and isinstance(argument_value, sp.Symbol)\n',
              1,
          )
          engine = engine.replace(
              '                        argument_expression,\n                    )\n                    substitutions, unresolved_symbols = (\n',
              '                        argument_value,\n                    )\n                    substitutions, unresolved_symbols = (\n',
              1,
          )

          old_full = '''                try:
              _, argument_quantity = self.engine.numeric_context.evaluate_symbolic(
                  argument_expression
              )
              substitutions, quantity = self.engine.numeric_context.evaluate_symbolic(
                  symbolic_expression,
                  overrides={function.parameter: argument_quantity},
              )
          '''
          old_full = old_full.replace('\n              ', '\n                    ').rstrip() + '\n'
          new_full = '''                try:
              substitutions, quantity = self.engine.numeric_context.evaluate_symbolic(
                  symbolic_expression,
                  overrides={function.parameter: argument_value},
              )
          '''
          new_full = new_full.replace('\n              ', '\n                    ').rstrip() + '\n'
          if '_, argument_quantity = self.engine.numeric_context.evaluate_symbolic(' in engine:
              if old_full not in engine:
                  raise SystemExit('numeric full-evaluation exact block not found')
              engine = engine.replace(old_full, new_full, 1)

          engine_path.write_text(engine)
          PY
      - name: Focused GREEN contracts and acceptance
        run: >-
          python -m pytest -q
          tests/test_numeric_function_arguments.py
          tests/test_diagnostics.py
          tests/test_numeric_function_magic_acceptance.py
      - name: Full source regression
        run: python -m pytest -q
      - name: Commit GREEN product changes
        run: |
          if git diff --quiet -- src/engcalc_colab; then
            echo "GREEN implementation already committed"
            exit 0
          fi
          git config user.name "eliaszamora"
          git config user.email "37598447+eliaszamora@users.noreply.github.com"
          git add src/engcalc_colab/numeric.py src/engcalc_colab/engine.py
          git commit -m "fix: preserve units in direct numeric function arguments"
          git push
