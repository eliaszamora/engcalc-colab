name: v0.6.2 numeric ergonomics

on:
  push:
    branches:
      - feature/v0.6.2-numeric-ergonomics

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source test environment
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython
      - name: Prepare 0.6.2 release metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text().replace('version = "0.6.1"', 'version = "0.6.2"', 1)
          pyproject.write_text(text)

          init = Path("src/engcalc_colab/__init__.py")
          init.write_text(init.read_text().replace('__version__ = "0.6.1"', '__version__ = "0.6.2"', 1))

          old_test = Path("tests/test_release_version_v061.py")
          new_test = Path("tests/test_release_version_v062.py")
          if old_test.exists():
              new_test.write_text(old_test.read_text().replace("0.6.1", "0.6.2"))
              old_test.unlink()
          elif new_test.exists():
              new_test.write_text(new_test.read_text().replace("0.6.1", "0.6.2"))

          for path in (Path("tests/test_packaging.py"), Path("tests/test_parser.py")):
              path.write_text(path.read_text().replace("0.6.1", "0.6.2"))

          readme = Path("README.md")
          text = readme.read_text()
          text = text.replace("Current version: **0.6.1**.", "Current version: **0.6.2**.", 1)
          if "## v0.6.2 numeric ergonomics and diagnostics" not in text:
              section_lines = [
                  "## v0.6.2 numeric ergonomics and diagnostics",
                  "",
                  "v0.6.2 improves the boundary between EngCalc's symbolic functions and its Pint-backed numerical context. A complete numerical/unit expression may now be passed directly as the argument of a user-defined function without introducing an auxiliary numeric symbol first.",
                  "",
                  "```text",
                  "M(x) = q*x*(L-x)/2",
                  "q := 10*kN/m",
                  "L := 6*m",
                  "",
                  "numeric(M(2.5*m))",
                  "numeric(M(0*m), kN*m)",
                  "numeric(M(L/2))",
                  "result(M(2.5*m))",
                  "```",
                  "",
                  "Direct quantities such as `2.5*m`, expressions using known numerical values such as `L/2`, load quantities such as `4*tonf/m`, and dimensional zeros such as `0*m` are evaluated from their restricted numeric AST before SymPy simplification can erase unit information. A lone unassigned name remains intentionally symbolic, so `numeric(M(x))` and `result(M(x))` continue to produce partial numerical functions.",
                  "",
                  "`result(...)` uses the same numerical engine as `numeric(...)`, so the direct-function-argument behavior is identical; only the presentation stages differ. Engineering-facing errors now distinguish unknown numerical names, unresolved numerical symbols and incompatible units in evaluated functions, and include a corrective hint when EngCalc can provide one safely.",
                  "",
              ]
              section = "\n".join(section_lines) + "\n"
              text = text.replace("## v0.6.1 visual polish", section + "## v0.6.1 visual polish", 1)
          text = text.replace("v0.6.1 intentionally does not yet provide:", "v0.6.2 intentionally does not yet provide:", 1)
          text = text.replace("- wrapping inside a single indivisible top-level mathematical term wider than the target budget;\n", "", 1)
          if "- **0.6.2** —" not in text:
              text = text.replace(
                  "## Version notes\n\n",
                  "## Version notes\n\n- **0.6.2** — direct unit-bearing arguments for numerical user-function evaluation, dimensional-zero preservation, and corrective numerical diagnostics.\n",
                  1,
              )
          text = text.replace("Version: `0.6.1`.", "Version: `0.6.2`.", 1)
          readme.write_text(text)
          PY
      - name: Focused release metadata and feature tests
        run: >-
          python -m pytest -q
          tests/test_release_version_v062.py
          tests/test_packaging.py
          tests/test_parser.py
          tests/test_numeric_function_arguments.py
          tests/test_diagnostics.py
          tests/test_numeric_function_magic_acceptance.py
      - name: Full source regression before release commit
        run: python -m pytest -q
      - name: Commit release metadata
        run: |
          git config user.name "eliaszamora"
          git config user.email "37598447+eliaszamora@users.noreply.github.com"
          git add -A README.md pyproject.toml src/engcalc_colab/__init__.py tests/test_release_version_v061.py tests/test_release_version_v062.py tests/test_packaging.py tests/test_parser.py
          if git diff --cached --quiet; then
            echo "Release metadata already committed"
            exit 0
          fi
          git commit -m "release: prepare EngCalc 0.6.2 metadata"
          git push
