name: v0.6.2 distribution gate

on:
  push:
    branches:
      - feature/v0.6.2-numeric-ergonomics

jobs:
  distribution-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install source test and build environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install ipython build

      - name: Verify release metadata
        run: |
          python - <<'PY'
          import tomllib
          import engcalc_colab

          with open('pyproject.toml', 'rb') as handle:
              version = tomllib.load(handle)['project']['version']

          assert version == '0.6.2', version
          assert engcalc_colab.__version__ == '0.6.2', engcalc_colab.__version__
          print('release metadata: 0.6.2')
          PY

      - name: Focused 0.6.2 contracts
        run: >-
          python -m pytest -q
          tests/test_release_version_v062.py
          tests/test_packaging.py
          tests/test_parser.py
          tests/test_numeric_function_arguments.py
          tests/test_diagnostics.py
          tests/test_numeric_function_magic_acceptance.py

      - name: Complete source suite
        run: python -m pytest -q

      - name: Build real 0.6.2 wheel
        run: |
          rm -rf dist build
          python -m build --wheel --outdir dist
          test -f dist/engcalc_colab-0.6.2-py3-none-any.whl
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = Path('dist/engcalc_colab-0.6.2-py3-none-any.whl')
          assert wheel.is_file()
          with zipfile.ZipFile(wheel) as archive:
              metadata_name = next(
                  name for name in archive.namelist()
                  if name.endswith('.dist-info/METADATA')
              )
              metadata = archive.read(metadata_name).decode('utf-8')
          assert 'Version: 0.6.2\n' in metadata
          print(wheel.name)
          PY

      - name: Install wheel into clean virtual environment
        run: |
          rm -rf /tmp/engcalc-v062-wheel-venv
          python -m venv /tmp/engcalc-v062-wheel-venv
          /tmp/engcalc-v062-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/engcalc-v062-wheel-venv/bin/python -m pip install \
            dist/engcalc_colab-0.6.2-py3-none-any.whl pytest ipython

      - name: Installed-wheel smoke from outside repository
        run: |
          cd /tmp
          PYTHONPATH='' /tmp/engcalc-v062-wheel-venv/bin/python - <<'PY'
          from pathlib import Path

          import engcalc_colab
          from engcalc_colab.engine import EngineeringEngine
          from engcalc_colab.models import NumericEvaluationResult, PartialNumericEvaluationResult
          from engcalc_colab.parser import parse_cell

          package_file = Path(engcalc_colab.__file__).resolve()
          assert engcalc_colab.__version__ == '0.6.2'
          assert 'site-packages' in str(package_file), package_file
          assert 'engcalc-colab/src' not in str(package_file), package_file

          engine = EngineeringEngine()
          run = lambda source: engine.evaluate(parse_cell(source)[0])
          run('M(x) = -q*L^2/8 + 5*q*L*x/8 - q*x^2/2')
          run('q := 2.8*tonf/m')
          run('L := 4*m')

          direct = run('numeric(M(0*m), kN*m)')
          assert isinstance(direct, NumericEvaluationResult)
          assert abs(direct.quantity.to('kN*m').magnitude + 54.91724) < 1e-5

          partial = run('numeric(M(x))')
          assert isinstance(partial, PartialNumericEvaluationResult)
          assert partial.unresolved_symbols == ('x',)

          compact = run('result(M(2.5*m), kN*m)')
          assert isinstance(compact, NumericEvaluationResult)

          print(f'wheel smoke PASS: {package_file}')
          PY

      - name: Prepare source-free installed-wheel test copy
        run: |
          rm -rf /tmp/engcalc-v062-wheel-suite
          mkdir -p /tmp/engcalc-v062-wheel-suite
          tar \
            --exclude='./src' \
            --exclude='./.git' \
            --exclude='./dist' \
            --exclude='./build' \
            --exclude='./.pytest_cache' \
            -cf - . | tar -xf - -C /tmp/engcalc-v062-wheel-suite
          test ! -d /tmp/engcalc-v062-wheel-suite/src

      - name: Complete suite against installed wheel
        run: |
          cd /tmp/engcalc-v062-wheel-suite
          PYTHONPATH='' /tmp/engcalc-v062-wheel-venv/bin/python -m pytest -q

      - name: Repeat complete source suite
        run: python -m pytest -q

      - name: Upload validated wheel
        uses: actions/upload-artifact@v4
        with:
          name: engcalc-colab-0.6.2-wheel
          path: dist/engcalc_colab-0.6.2-py3-none-any.whl
          if-no-files-found: error
