name: v0.6.1 spacing validation

on:
  push:
    branches:
      - feature/v0.6.1-visual-polish-2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused spacing tests
        run: python -m pytest -q tests/test_magic.py
