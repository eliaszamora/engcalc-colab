name: Plot refinement release validation

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8' 'build>=1' 'ipython>=8'
      - name: Build and install release wheel
        run: |
          python -m build --wheel
          python -m pip install --force-reinstall dist/engcalc_colab-0.3.2-py3-none-any.whl
          python -c "import engcalc_colab; assert engcalc_colab.__version__ == '0.3.2'"
      - name: Smoke test installed plot refinement
        run: |
          cd /tmp
          python - <<'PY'
          from matplotlib.collections import PathCollection
          from engcalc_colab.engine import EngineeringEngine
          from engcalc_colab.parser import parse_cell
          from engcalc_colab.plotting import render_plot

          def evaluate(engine, text):
              return [engine.evaluate(statement) for statement in parse_cell(text)]

          engine = EngineeringEngine()
          evaluate(engine, 'M(x) = -q*L^2/8 + 5*q*L*x/8 - q*x^2/2')
          evaluate(engine, 'V(x) = 5*q*L/8 - q*x')
          evaluate(engine, 'q := 2.8*tonf/m\nL := 4*m')

          moment = evaluate(engine, 'plot(M(x), x, 0, L)')[-1]
          moment_axis = render_plot(moment).axes[0]
          assert moment_axis.get_ylabel() == 'M(x) [tonf·m]'
          assert any('3.15 tonf·m' in text.get_text() for text in moment_axis.texts)

          shear = evaluate(engine, 'plot(V(x), x, 0, L)')[-1]
          shear_axis = render_plot(shear).axes[0]
          annotations = {text.get_text().split(' = ', 1)[0]: text for text in shear_axis.texts}
          assert annotations['min'].get_ha() == 'right'
          assert annotations['min'].get_position()[0] < 0

          markers = [item for item in shear_axis.collections if isinstance(item, PathCollection)]
          assert len(markers) == 1
          assert len(markers[0].get_offsets()) == 2
          PY
      - name: Run tests
        run: pytest -q
