name: Plot refinement development validation

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8' 'ipython>=8'
          python -m pip install -e .
      - name: Run tests
        run: pytest -q
