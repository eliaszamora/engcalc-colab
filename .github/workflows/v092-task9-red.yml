name: v0.9.2 Task 9 GREEN

on:
  push:
    branches:
      - feature/v0.9.2-audit-reliability

permissions:
  contents: write

jobs:
  task9-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]' ipython
      - name: Apply Task 9 product and persistent tests
        run: python .github/scripts/v092_task9_green.py
      - name: Compile
        run: python -m compileall -q src/engcalc_colab
      - name: Run Task 9 contracts
        run: |
          python -m pytest \
            tests/test_plotting.py \
            tests/test_characteristics_rendering.py -q \
            -k 'presented_plot_title_does_not_emit_font_weight_warning or presented_plot_title_uses_numeric_weight_600 or exact_rational_characteristic_label_uses_symbolic_x_coordinate or characteristic_rendering_normalizes_negative_zero_with_tolerance'
      - name: Run focused Task 9 regression
        run: |
          python -m pytest \
            tests/test_plotting.py \
            tests/test_characteristics_plot_integration.py \
            tests/test_characteristics_rendering.py \
            tests/test_characteristic_requests.py -q
      - name: Run complete source suite
        run: python -m pytest -q
      - name: Commit Task 9 patch
        shell: bash
        run: |
          if git diff --quiet -- src/engcalc_colab tests; then
            echo 'No Task 9 product or test patch to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/engcalc_colab/presentation.py \
            src/engcalc_colab/plotting.py \
            tests/test_plotting.py \
            tests/test_characteristics_rendering.py
          git commit -m 'fix: polish exact characteristic presentation'
          git push origin HEAD:feature/v0.9.2-audit-reliability
