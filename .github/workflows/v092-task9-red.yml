name: v0.9.2 Task 9 RED

on:
  push:
    branches:
      - feature/v0.9.2-audit-reliability

jobs:
  task9-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]' ipython
      - name: Materialize runner-only Task 9 RED contracts
        shell: bash
        run: |
          cat >> tests/test_plotting.py <<'PY'

          def test_presented_plot_title_does_not_emit_font_weight_warning(capsys):
              from engcalc_colab.presentation import render_presented_plot

              engine = EngineeringEngine()
              result = eval_cell(
                  engine,
                  'f(x)=x\nplot(f(x), x, 0, 1, title="Test")',
              )[-1]
              render_presented_plot(result)
              captured = capsys.readouterr()
              assert "font weight semibold" not in captured.err
              assert "Failed to find font weight semibold" not in captured.err


          def test_presented_plot_title_uses_numeric_weight_600():
              from engcalc_colab.presentation import render_presented_plot

              engine = EngineeringEngine()
              result = eval_cell(
                  engine,
                  'f(x)=x\nplot(f(x), x, 0, 1, title="Test")',
              )[-1]
              axis = render_presented_plot(result).axes[0]
              assert axis.title.get_fontweight() == 600


          def test_exact_rational_characteristic_label_uses_symbolic_x_coordinate():
              engine = EngineeringEngine()
              result = eval_cell(
                  engine,
                  "f(x)=-(x-1/3)^2+2\nplot(f(x), x, 0, 1)",
              )[-1]
              axis = render_plot(result).axes[0]
              exact = next(
                  item for item in annotations(axis)
                  if abs(float(item.xy[0]) - 1/3) < 1e-12
              )
              assert "1/3" in exact.get_text()
              assert abs(float(exact.xy[0]) - 1/3) < 1e-12
          PY

          cat >> tests/test_characteristics_rendering.py <<'PY'

          def test_characteristic_rendering_normalizes_negative_zero_with_tolerance():
              from engcalc_colab.engine import EngineeringEngine
              from engcalc_colab.renderer import RenderSettings

              engine = EngineeringEngine()
              result = [
                  engine.evaluate(statement)
                  for statement in parse_cell(
                      "roots((x-1)*(x-1.0000001), x, 0, 2)"
                  )
              ][-1]
              html = renderer.render_characteristic_result(
                  result,
                  settings=RenderSettings(zero_tolerance=1e-10),
              )
              assert "-0.00" not in html
              assert "-0.0" not in html
              assert "-0\\," not in html
          PY
      - name: Run Task 9 RED contracts
        run: |
          python -m pytest \
            tests/test_plotting.py \
            tests/test_characteristics_rendering.py -q \
            -k 'presented_plot_title_does_not_emit_font_weight_warning or presented_plot_title_uses_numeric_weight_600 or exact_rational_characteristic_label_uses_symbolic_x_coordinate or characteristic_rendering_normalizes_negative_zero_with_tolerance'
