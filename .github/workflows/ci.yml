name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Every Monday, pushed or not. Pint 0.26 changed the spelling of every unit on every
  # page on 2026-09-10 with no commit here, and the engineer installs with `--upgrade`,
  # so a dependency release reaches his notebook before any push reaches this suite.
  # The Deep Gate runs an hour earlier, but it does not carry the reference pages.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src/engcalc_colab
      # The KaTeX Colab typesets with, for test_colab_can_typeset_every_formula. The
      # runner ships Node; the version of KaTeX is the one pinned in tools/katex.
      - run: npm ci --prefix tools/katex
      - run: python -m pytest -q -n auto

  colab-ipython:
    # Colab pins ipython==7.34.0. EngCalc declared a floor above it, so the first real
    # `%pip install` in a notebook upgraded IPython underneath the platform and pip said
    # so. The floor is now Colab's, and this keeps that true: the whole suite runs
    # against the exact version a notebook has.
    #
    # Python 3.10 because 7.34.0 predates the newer interpreters and this job is about
    # the IPython version, not the interpreter matrix the job above already covers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Pin IPython to the version Colab ships
        run: |
          python -m pip install 'ipython==7.34.0'
          python -c "import IPython; print('IPython', IPython.__version__)"
      - name: Installing EngCalc must not have upgraded it
        run: |
          python - <<'PY'
          import IPython
          assert IPython.__version__ == "7.34.0", IPython.__version__
          print("still on Colab's IPython")
          PY
      # The KaTeX Colab typesets with, for test_colab_can_typeset_every_formula. The
      # runner ships Node; the version of KaTeX is the one pinned in tools/katex.
      - run: npm ci --prefix tools/katex
      - run: python -m pytest -q -n auto
