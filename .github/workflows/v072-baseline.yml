name: EngCalc 0.7.2 baseline

on:
  push:
    branches:
      - feature/v0.7.2-engineering-tables

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify version
        run: |
          python - <<'PY'
          import engcalc_colab
          assert engcalc_colab.__version__ == '0.7.1'
          print('runtime version:', engcalc_colab.__version__)
          PY
      - name: Full baseline suite
        run: pytest -q
