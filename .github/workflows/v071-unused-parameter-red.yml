name: EngCalc 0.7.1 unused-parameter RED

on:
  push:
    branches:
      - feature/v0.7.1-multiarg-partial-eval

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test environment
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython
      - name: Run unused-parameter numeric regression
        run: python -m pytest -q tests/test_multiarg_numeric.py
