name: envelope-v050-validation

on:
  push:
    branches:
      - feature/envelope-v0.5.0
  workflow_dispatch:

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ipython
      - name: Run full suite
        run: pytest -q
