name: EngCalc 0.9.0 execution baseline

on:
  push:
    branches:
      - feature/v0.9.0-matrix-cas
    paths:
      - .github/workflows/v090-baseline.yml

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.9.0-matrix-cas
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e '.[dev]' ipython
      - name: Verify version
        run: python -c "import engcalc_colab; assert engcalc_colab.__version__ == '0.8.0'; print(engcalc_colab.__version__)"
      - name: Full baseline suite
        run: python -m pytest -q
