name: v0.6.1 final review blockers

on:
  push:
    branches:
      - feature/v0.6.1-visual-polish-2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source test environment
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython build
      - name: Focused final-review regressions
        run: python -m pytest -q tests/test_symbolic_mathjax_wrapping.py tests/test_envelope_plotting.py
      - name: Complete source suite
        run: python -m pytest -q
      - name: Build wheel
        run: python -m build --wheel
      - name: Install exact wheel in clean venv
        run: |
          python -m venv /tmp/engcalc-v061-final-wheel
          /tmp/engcalc-v061-final-wheel/bin/python -m pip install --upgrade pip
          /tmp/engcalc-v061-final-wheel/bin/python -m pip install dist/engcalc_colab-0.6.1-py3-none-any.whl pytest ipython
      - name: Smoke final fixes and spacing from installed wheel
        run: |
          cd /tmp
          PYTHONPATH= /tmp/engcalc-v061-final-wheel/bin/python - <<'PY'
          import matplotlib
          matplotlib.use("Agg")
          import sympy as sp
          from matplotlib.text import Annotation

          from engcalc_colab.engine import EngineeringEngine
          from engcalc_colab.parser import parse_cell
          from engcalc_colab.plotting import render_plot
          from engcalc_colab.renderer import _bounded_expression_rows, _latex_visual_width, render_aligned_results

          product = sp.Mul(*(sp.Symbol(f"a_{i:02d}") for i in range(1, 31)))
          product_rows = _bounded_expression_rows(product)
          assert len(product_rows) > 1
          assert all(_latex_visual_width(row) <= 64.0 for row in product_rows)
          assert all(row.startswith(r"\quad \cdot ") for row in product_rows[1:])

          numerator = sp.Mul(*(sp.Symbol(f"n_{i:02d}") for i in range(1, 17)))
          denominator = sp.Mul(*(sp.Symbol(f"d_{i:02d}") for i in range(1, 17)))
          fraction_rows = _bounded_expression_rows(numerator / denominator)
          assert len(fraction_rows) > 1
          assert all(_latex_visual_width(row) <= 64.0 for row in fraction_rows)

          engine = EngineeringEngine()
          for stmt in parse_cell("M_A(x) = C\nM_B(x) = C\nC := 5*kN*m\nL := 2*m"):
              engine.evaluate(stmt)
          envelope = engine.evaluate(parse_cell("envelope(M_A(x), M_B(x), x, 0, L)")[0])
          axis = render_plot(envelope).axes[0]
          annotations = [item for item in axis.texts if isinstance(item, Annotation)]
          assert len(annotations) == 1
          assert annotations[0].get_text() == "(0, 5)"

          engine = EngineeringEngine()
          consecutive = [engine.evaluate(stmt) for stmt in parse_cell("A = 1\nB = 2")]
          assert r"\\[8pt]" in render_aligned_results(consecutive)
          engine = EngineeringEngine()
          blank = [engine.evaluate(stmt) for stmt in parse_cell("A = 1\n\nB = 2")]
          assert r"\\[16pt]" in render_aligned_results(blank)

          print("installed wheel final 0.6.1 smoke: PASS")
          PY
      - name: Complete suite against installed wheel
        run: |
          mv src /tmp/engcalc-v061-final-source
          trap 'mv /tmp/engcalc-v061-final-source src' EXIT
          PYTHONPATH= /tmp/engcalc-v061-final-wheel/bin/python -m pytest -q
      - name: Repeat source suite
        run: python -m pytest -q
