name: v0.9.2 Task 5 RED

on:
  push:
    branches:
      - feature/v0.9.2-audit-reliability

jobs:
  task5-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Append Task 5 RED contracts in runner only
        shell: bash
        run: |
          cat >> tests/test_v092_audit_regressions.py <<'PY'


def test_engine_symbols_are_real_by_contract():
    engine = EngineeringEngine()
    assert engine.resolve_symbol("x").is_real is True


def test_dimensional_abs_extrema_keeps_units_and_cusp_minimum():
    result = evaluate_cell(
        EngineeringEngine(),
        "L := 4*m\n"
        "q := 2*kN/m\n"
        "M(x) = q*(x-L/2)\n"
        "extrema(abs(M(x)), x, 0, L)",
    )
    minimum = next(point for point in result.points if "global_min" in point.roles)
    assert minimum.x_quantity.to("m").magnitude == pytest.approx(2.0)
    assert minimum.value_quantity.to("kN").magnitude == pytest.approx(0.0)
          PY
      - name: Run Task 5 RED contracts
        run: |
          python -m pytest tests/test_v092_audit_regressions.py -q -k 'engine_symbols_are_real or dimensional_abs_extrema or abs_extrema_has_global_minimum'
