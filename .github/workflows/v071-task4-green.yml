name: EngCalc 0.7.1 Task 4 GREEN

on:
  push:
    branches:
      - feature/v0.7.1-multiarg-partial-eval

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]' ipython
      - name: Run focused Task 4 GREEN suite
        id: focused
        shell: bash
        run: |
          set +e
          pytest tests/test_partial_numeric_general.py tests/test_numeric_function_arguments.py tests/test_scalar_math_acceptance.py -q 2>&1 | tee task4-focused-green.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run complete source suite
        id: full
        shell: bash
        run: |
          set +e
          pytest -q 2>&1 | tee task4-full-green.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload GREEN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engcalc-v071-task4-green
          path: |
            task4-focused-green.txt
            task4-full-green.txt
      - name: Enforce GREEN gate
        if: always()
        run: |
          test "${{ steps.focused.outputs.status }}" = "0"
          test "${{ steps.full.outputs.status }}" = "0"
