name: EngCalc 0.7.1 Task 5 GREEN

on:
  push:
    branches:
      - feature/v0.7.1-multiarg-partial-eval

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]' ipython
      - name: Run focused Task 5 GREEN suite
        run: pytest tests/test_multiarg_acceptance.py tests/test_magic.py tests/test_adaptive_mathjax_wrapping.py tests/test_numeric_function_magic_acceptance.py -q
      - name: Run complete source suite
        run: pytest -q
