name: Smart label release validation

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8' 'build>=1' 'ipython>=8'
      - name: Build and install release wheel
        run: |
          python -m build --wheel
          python -m pip install --force-reinstall dist/engcalc_colab-0.3.3-py3-none-any.whl
          python -c "import engcalc_colab; assert engcalc_colab.__version__ == '0.3.3'"
      - name: Smoke test installed smart callouts
        run: |
          cd /tmp
          python - <<'PY'
          from engcalc_colab.engine import EngineeringEngine
          from engcalc_colab.parser import parse_cell
          from engcalc_colab.plotting import render_plot

          def evaluate(engine, text):
              return [engine.evaluate(statement) for statement in parse_cell(text)]

          engine = EngineeringEngine()
          evaluate(engine, 'V(x) = 5*q*L/8 - q*x')
          evaluate(engine, 'M(x) = -q*L^2/8 + 5*q*L*x/8 - q*x^2/2')
          evaluate(engine, 'q := 2.8*tonf/m\nL := 4*m')

          shear = render_plot(evaluate(engine, 'plot(V(x), x, 0, L)')[-1]).axes[0]
          shear_labels = {item.get_text().split(' = ', 1)[0]: item for item in shear.texts}
          assert shear_labels['max'].get_bbox_patch() is not None
          assert shear_labels['min'].get_bbox_patch() is not None
          assert shear_labels['max'].get_position()[1] >= 20
          assert shear_labels['min'].get_position()[1] <= -20

          moment = render_plot(evaluate(engine, 'plot(M(x), x, 0, L)')[-1]).axes[0]
          moment_labels = {item.get_text().split(' = ', 1)[0]: item for item in moment.texts}
          assert moment_labels['max'].get_bbox_patch() is not None
          assert moment_labels['min'].get_bbox_patch() is not None
          assert moment_labels['max'].get_position()[1] <= -20
          assert moment_labels['min'].get_position()[1] >= 20
          PY
      - name: Run tests
        run: pytest -q
