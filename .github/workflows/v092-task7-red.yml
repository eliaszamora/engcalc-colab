name: v0.9.2 Task 7 IDEMPOTENT

on:
  push:
    branches:
      - feature/v0.9.2-audit-reliability

jobs:
  task7-idempotent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]' ipython
      - name: Verify Task 7 product is already materialized
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/engcalc_colab/characteristics.py').read_text()
          tests = Path('tests/test_characteristics_piecewise_extrema.py').read_text()
          required_source = [
              'def _piecewise_selected_boundary_point(',
              'def _normalize_piecewise_zero_units(',
              'def _piecewise_breakpoint_records(',
              'points.extend(\n            _piecewise_breakpoint_records(',
          ]
          required_tests = [
              'def test_piecewise_boundary_value_symbolic_is_selected_governing_branch():',
              'def test_continuous_piecewise_breakpoint_emits_only_at_with_dimensional_zero():',
          ]
          missing = [item for item in required_source if item not in source]
          missing += [item for item in required_tests if item not in tests]
          if missing:
              raise SystemExit('Task 7 product tree is incomplete:\n' + '\n'.join(missing))

          continuous_start = source.index('def _solve_continuous_extrema_exact(')
          continuous_end = source.index('\ndef _piecewise_region_domain', continuous_start)
          continuous = source[continuous_start:continuous_end]
          if '_piecewise_selected_boundary_point(' in continuous:
              raise SystemExit('Task 7 leaked Piecewise endpoint handling into continuous extrema')

          piecewise_start = source.index('def _solve_piecewise_extrema_exact(')
          piecewise_end = source.index('\ndef solve_extrema_exact(', piecewise_start)
          piecewise = source[piecewise_start:piecewise_end]
          if '_piecewise_selected_boundary_point(' not in piecewise:
              raise SystemExit('Task 7 Piecewise endpoint handling is missing')

          print('Task 7 product tree is already fully materialized and scoped.')
          PY
      - name: Compile
        run: python -m compileall -q src/engcalc_colab
      - name: Run Task 7 contracts
        run: |
          python -m pytest tests/test_characteristics_piecewise_extrema.py -q \
            -k 'piecewise_boundary_value_symbolic_is_selected_governing_branch or continuous_piecewise_breakpoint_emits_only_at_with_dimensional_zero'
      - name: Run discontinuous topology preservation contracts
        run: |
          python -m pytest tests/test_characteristics_piecewise_extrema.py -q \
            -k 'discontinuous_piecewise_preserves_left_at_right_values or dimensional_piecewise_breakpoint_preserves_exact_location_and_force_units'
      - name: Run focused Task 7 regression
        run: |
          python -m pytest \
            tests/test_characteristics_piecewise_extrema.py \
            tests/test_characteristics_extrema.py -q
      - name: Run complete source suite
        run: python -m pytest -q
      - name: Verify no second Task 7 product patch
        shell: bash
        run: |
          if git diff --quiet -- src/engcalc_colab tests; then
            echo 'No Task 7 product or test patch to commit.'
            exit 0
          fi
          echo 'Unexpected Task 7 product/test diff after idempotent verification:'
          git diff -- src/engcalc_colab tests
          exit 1
