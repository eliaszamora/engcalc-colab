name: EngCalc 0.7.1 Task 5 RED

on:
  push:
    branches:
      - feature/v0.7.1-multiarg-partial-eval

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]' ipython
      - name: Run focused Task 5 contracts and capture RED
        shell: bash
        run: |
          set +e
          pytest tests/test_multiarg_acceptance.py tests/test_magic.py -q 2>&1 | tee task5-red.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo "Task 5 contracts unexpectedly passed before rendering implementation" >&2
            exit 1
          fi
          exit 0
      - name: Upload RED evidence
        uses: actions/upload-artifact@v4
        with:
          name: engcalc-v071-task5-red
          path: task5-red.txt
