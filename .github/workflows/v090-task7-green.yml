name: EngCalc 0.9.0 Task 7 GREEN

on:
  push:
    branches:
      - feature/v0.9.0-matrix-cas
    paths:
      - .github/workflows/v090-task7-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.9.0-matrix-cas
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e '.[dev]' ipython
      - name: Apply Task 7 candidate
        run: python .github/scripts/v090_task7_apply.py
      - name: Validate candidate patch
        run: |
          python -m compileall -q src/engcalc_colab
          git diff --check
          test "$(git diff --name-only | sort)" = $'src/engcalc_colab/engine.py\nsrc/engcalc_colab/matrix_numeric.py\nsrc/engcalc_colab/models.py\nsrc/engcalc_colab/parser.py'
          test "$(git ls-files --others --exclude-standard | sort)" = "src/engcalc_colab/matrix_analysis.py"
      - name: Focused GREEN
        run: python -m pytest tests/test_matrix_analysis.py tests/test_matrix_analysis_units.py tests/test_engine.py tests/test_parser.py tests/test_matrix_numeric.py -q 2>&1 | tee task7-focused.log
      - name: Full regression
        run: python -m pytest -q 2>&1 | tee task7-full.log
      - name: Commit implementation
        run: |
          git config user.name "eliaszamora"
          git config user.email "37598447+eliaszamora@users.noreply.github.com"
          git add src/engcalc_colab/engine.py src/engcalc_colab/matrix_analysis.py src/engcalc_colab/matrix_numeric.py src/engcalc_colab/models.py src/engcalc_colab/parser.py
          git commit -m "feat: add guarded matrix analysis operations"
          git push origin HEAD:feature/v0.9.0-matrix-cas
      - uses: actions/upload-artifact@v4
        with:
          name: task7-green-logs
          path: |
            task7-focused.log
            task7-full.log
