name: EngCalc 0.7.2 Task 5

on:
  push:
    branches:
      - feature/v0.7.2-engineering-tables

jobs:
  task5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython
      - name: Task 5 acceptance
        run: python -m pytest -q tests/test_table_acceptance.py
      - name: Complete table feature suite
        run: >-
          python -m pytest -q
          tests/test_table_parser.py
          tests/test_table_points.py
          tests/test_table_engine.py
          tests/test_table_rendering.py
          tests/test_table_acceptance.py
          tests/test_magic.py
      - name: Complete source regression
        run: python -m pytest -q
