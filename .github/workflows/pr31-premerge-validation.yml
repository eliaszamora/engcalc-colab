name: PR31 premerge validation

on:
  push:
    branches:
      - feature/v0.8.0-piecewise
    paths:
      - .github/workflows/pr31-premerge-validation.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]' ipython
      - name: Verify version
        run: python -c "import engcalc_colab; assert engcalc_colab.__version__ == '0.8.0'"
      - name: Run full suite
        run: python -m pytest -q
