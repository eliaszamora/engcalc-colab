name: EngCalc 0.7.1 Baseline

on:
  push:
    branches:
      - feature/v0.7.1-multiarg-partial-eval

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]' ipython
      - name: Verify release version
        run: |
          python - <<'PY'
          import engcalc_colab
          assert engcalc_colab.__version__ == '0.7.0', engcalc_colab.__version__
          print('version', engcalc_colab.__version__)
          PY
      - name: Run complete baseline suite
        run: pytest -q
