name: Native math renderer validation

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8' 'sympy>=1.13' 'pint>=0.24' 'ipython>=8' 'latex2mathml>=3.81'
          python -m pip install -e . --no-deps
      - name: Run tests
        run: pytest -q
