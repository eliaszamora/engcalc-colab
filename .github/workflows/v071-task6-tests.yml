name: EngCalc 0.7.1 Task 6 Tests

on:
  push:
    branches:
      - feature/v0.7.1-multiarg-partial-eval

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.1-multiarg-partial-eval
          fetch-depth: 0
      - name: Append approved Task 6 integration contracts
        run: python .github/scripts/apply_v071_task6_tests.py
      - name: Commit frozen integration contracts
        run: |
          if git diff --quiet -- tests/test_plot_engine.py tests/test_envelope_engine.py; then
            echo "Task 6 tests already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_plot_engine.py tests/test_envelope_engine.py
          git commit -m "test: cover multi-argument plotting integration"
          git push origin HEAD:feature/v0.7.1-multiarg-partial-eval
