name: EngCalc 0.7.1 Task 4 RED

on:
  push:
    branches:
      - feature/v0.7.1-multiarg-partial-eval

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]' ipython
      - name: Run focused Task 4 contracts and capture RED
        id: focused
        shell: bash
        run: |
          set +e
          pytest tests/test_partial_numeric_general.py tests/test_scalar_math_acceptance.py -q 2>&1 | tee task4-red-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            echo "Task 4 contracts unexpectedly passed before implementation" >&2
            exit 1
          fi
          exit 0
      - name: Upload RED evidence
        uses: actions/upload-artifact@v4
        with:
          name: engcalc-v071-task4-red
          path: task4-red-output.txt
