name: EngCalc 0.7.2 Task 4

on:
  push:
    branches:
      - feature/v0.7.2-engineering-tables

jobs:
  task4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython
      - name: Task 4 focused tests
        run: >-
          python -m pytest -q
          tests/test_table_rendering.py
          tests/test_magic.py
          tests/test_renderer.py
          tests/test_numeric_renderer.py
          tests/test_render_settings.py
          tests/test_headings.py
