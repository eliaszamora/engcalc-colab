name: EngCalc 0.9.1 Task 2 full gate

on:
  push:
    branches:
      - feature/v0.9.1-exact-characteristics

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install complete test environment
        run: python -m pip install -e '.[dev]' ipython

      - name: Compile package
        run: python -m compileall -q src/engcalc_colab

      - name: Check diff hygiene
        run: git diff --check

      - name: Run Task 2 focused regression gate
        run: >-
          python -m pytest
          tests/test_characteristics_roots.py
          tests/test_numeric_context.py
          tests/test_acceptance_numeric_units.py
          -q

      - name: Run complete suite
        run: python -m pytest -q
