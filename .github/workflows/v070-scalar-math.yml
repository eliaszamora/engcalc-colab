name: v0.7.0 scalar math validation

on:
  push:
    branches:
      - feature/v0.7.0-scalar-engineering-math

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Apply minimal parser GREEN
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/engcalc_colab/parser.py')
          text = path.read_text()
          old = '''_DISPLAY_SWEEP_CALLS = {"plot", "envelope"}\n_ALLOWED_CALLS = {\n    "integral", "diff", "solve", "simplify", "expand", "factor",\n    "subs", "eq", "sum", "numeric", "result", "plot", "envelope", "abs"\n}\n_RESERVED = _ALLOWED_CALLS | {"True", "False", "None"}\n'''
          new = '''_DISPLAY_SWEEP_CALLS = {"plot", "envelope"}\n_SCALAR_CALLS = {\n    "sqrt", "sin", "cos", "tan", "asin", "acos", "atan", "exp", "log"\n}\n_ALLOWED_CALLS = {\n    "integral", "diff", "solve", "simplify", "expand", "factor",\n    "subs", "eq", "sum", "numeric", "result", "plot", "envelope", "abs"\n} | _SCALAR_CALLS\n_RESERVED = _ALLOWED_CALLS | {"pi", "True", "False", "None"}\n'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('parser scalar-call block not found')
          PY
      - name: Parser GREEN contracts
        run: pytest tests/test_scalar_math_parser.py -q
      - name: Commit parser implementation when changed
        run: |
          if git diff --quiet -- src/engcalc_colab/parser.py; then
            echo "Parser already persisted"
            exit 0
          fi
          git config user.name "eliaszamora"
          git config user.email "37598447+eliaszamora@users.noreply.github.com"
          git add src/engcalc_colab/parser.py
          git diff --cached --check
          git commit -m "feat: reserve EngCalc scalar math names"
          git push
