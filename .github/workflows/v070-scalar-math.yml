name: v0.7.0 scalar math validation

on:
  push:
    branches:
      - feature/v0.7.0-scalar-engineering-math

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' ipython
      - name: Scalar math focused acceptance
        run: |
          pytest tests/test_scalar_math_parser.py \
                 tests/test_scalar_math_engine.py \
                 tests/test_scalar_math_numeric.py \
                 tests/test_scalar_math_acceptance.py -q
      - name: Complete source regression
        run: pytest -q
