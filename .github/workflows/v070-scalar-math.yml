name: v0.7.0 scalar math validation

on:
  push:
    branches:
      - feature/v0.7.0-scalar-engineering-math

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Apply minimal symbolic engine GREEN
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/engcalc_colab/engine.py')
          text = path.read_text()

          anchor = '_MOMENT_LABEL = re.compile(r"^M(?:_[A-Za-z0-9]+|[0-9]+)?\\(")\n'
          mapping = '''_SCALAR_SYMBOLIC_FUNCTIONS = {\n    "sqrt": sp.sqrt,\n    "sin": sp.sin,\n    "cos": sp.cos,\n    "tan": sp.tan,\n    "asin": sp.asin,\n    "acos": sp.acos,\n    "atan": sp.atan,\n    "exp": sp.exp,\n    "log": sp.log,\n}\n\n'''
          if mapping not in text:
              if anchor not in text:
                  raise SystemExit('moment-label anchor not found')
              text = text.replace(anchor, mapping + anchor, 1)

          old_name = '''    def visit_Name(self, node: ast.Name):\n        if node.id in self.symbol_overrides:\n            return self.symbol_overrides[node.id]\n        return self.engine.resolve_name(node.id)\n'''
          new_name = '''    def visit_Name(self, node: ast.Name):\n        if node.id in self.symbol_overrides:\n            return self.symbol_overrides[node.id]\n        if node.id == "pi":\n            return sp.pi\n        return self.engine.resolve_name(node.id)\n'''
          if old_name in text:
              text = text.replace(old_name, new_name, 1)
          elif new_name not in text:
              raise SystemExit('visit_Name block not found')

          old_call = '''        if name in self.engine.functions:\n            if len(args) != 1:\n                raise EngEvaluationError(f"function '{name}' expects 1 argument")\n            function = self.engine.functions[name]\n            parameter = self.engine.resolve_name(function.parameter)\n            return sp.sympify(function.expression).subs(parameter, args[0])\n\n        if name == "abs":\n'''
          new_call = '''        if name in self.engine.functions:\n            if len(args) != 1:\n                raise EngEvaluationError(f"function '{name}' expects 1 argument")\n            function = self.engine.functions[name]\n            parameter = self.engine.resolve_name(function.parameter)\n            return sp.sympify(function.expression).subs(parameter, args[0])\n\n        if name in _SCALAR_SYMBOLIC_FUNCTIONS:\n            self._require_arity(name, args, 1, "expression")\n            return _SCALAR_SYMBOLIC_FUNCTIONS[name](args[0])\n\n        if name == "abs":\n'''
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          elif new_call not in text:
              raise SystemExit('scalar-call insertion anchor not found')

          path.write_text(text)
          PY
      - name: Parser and symbolic engine GREEN
        run: pytest tests/test_scalar_math_parser.py tests/test_scalar_math_engine.py -q
      - name: Commit symbolic engine implementation when changed
        run: |
          if git diff --quiet -- src/engcalc_colab/engine.py; then
            echo "Symbolic engine already persisted"
            exit 0
          fi
          git config user.name "eliaszamora"
          git config user.email "37598447+eliaszamora@users.noreply.github.com"
          git add src/engcalc_colab/engine.py
          git diff --cached --check
          git commit -m "feat: add symbolic scalar engineering math"
          git push
