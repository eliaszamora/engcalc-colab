name: EngCalc 0.9.0 pre-PR gate

on:
  push:
    branches:
      - feature/v0.9.0-matrix-cas
    paths:
      - .github/workflows/v090-pr-gate.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.9.0-matrix-cas
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test environment
        run: python -m pip install -e '.[dev]' ipython
      - name: Verify release tree
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q src/engcalc_colab
          git diff --check
          python -m pytest -q
