name: EngCalc 0.9.0 Task 9 RED

on:
  push:
    branches:
      - feature/v0.9.0-matrix-cas
    paths:
      - .github/workflows/v090-task9-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.9.0-matrix-cas
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e '.[dev]' ipython
      - name: Run Task 9 RED
        shell: bash
        run: |
          set +e
          python -m pytest tests/test_matrix_acceptance.py tests/test_matrix_integration.py tests/test_matrix_diagnostics.py -q 2>&1 | tee task9-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Task 9 unexpectedly passed before implementation"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: task9-red-log
          path: task9-red.log
