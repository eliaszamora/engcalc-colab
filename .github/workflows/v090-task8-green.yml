name: EngCalc 0.9.0 Task 8 GREEN

on:
  push:
    branches:
      - feature/v0.9.0-matrix-cas
    paths:
      - .github/workflows/v090-task8-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.9.0-matrix-cas
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e '.[dev]' ipython
      - name: Apply Task 8 candidate
        run: python .github/scripts/v090_task8_apply.py
      - name: Validate candidate patch
        run: |
          python -m compileall -q src/engcalc_colab
          git diff --check
          test "$(git diff --name-only)" = "src/engcalc_colab/renderer.py"
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Focused GREEN
        run: python -m pytest tests/test_matrix_renderer.py tests/test_matrix_magic.py tests/test_renderer.py tests/test_numeric_renderer.py tests/test_magic.py tests/test_matrix_analysis.py tests/test_matrix_analysis_units.py -q 2>&1 | tee task8-focused.log
      - name: Full regression
        run: python -m pytest -q 2>&1 | tee task8-full.log
      - name: Commit implementation
        run: |
          git config user.name "eliaszamora"
          git config user.email "37598447+eliaszamora@users.noreply.github.com"
          git add src/engcalc_colab/renderer.py
          git commit -m "feat: render matrix calculations with MathJax"
          git push origin HEAD:feature/v0.9.0-matrix-cas
      - uses: actions/upload-artifact@v4
        with:
          name: task8-green-logs
          path: |
            task8-focused.log
            task8-full.log
