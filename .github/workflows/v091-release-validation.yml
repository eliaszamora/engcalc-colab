name: EngCalc 0.9.1 release validation

on:
  push:
    branches:
      - feature/v0.9.1-exact-characteristics

permissions:
  contents: read

jobs:
  version-red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install focused test environment
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython

      - name: Confirm package still reports 0.9.0 before bump
        run: |
          grep -q 'version = "0.9.0"' pyproject.toml
          grep -q '__version__ = "0.9.0"' src/engcalc_colab/__init__.py
          grep -q 'Current version: \*\*0.9.0\*\*' README.md

      - name: Run intentional 0.9.1 version RED
        run: python -m pytest tests/test_version.py tests/test_packaging.py -q
