name: EngCalc 0.9.1 release validation

on:
  push:
    branches:
      - feature/v0.9.1-exact-characteristics

permissions:
  contents: read

jobs:
  wheel-validation:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install source and build tooling
        run: python -m pip install -e '.[dev]' ipython build

      - name: Verify committed release contract
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q src/engcalc_colab
          git diff --check
          python -m pytest tests/test_version.py tests/test_packaging.py tests/test_parser.py -q 2>&1 | tee v091-release-contract.log

      - name: Build and inspect real wheel
        shell: bash
        run: |
          set -o pipefail
          rm -rf dist build
          python -m build --wheel 2>&1 | tee v091-build.log
          WHEEL="$(find dist -maxdepth 1 -type f -name 'engcalc_colab-0.9.1-py3-none-any.whl' -print -quit)"
          test -n "$WHEEL"
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          echo "WHEEL=$WHEEL" >> "$GITHUB_ENV"
          python .github/scripts/v091_verify_wheel.py "$WHEEL"
          sha256sum "$WHEEL" | tee v091-wheel-sha256.log

      - name: Install wheel in external clean venv
        shell: bash
        run: |
          VENV=/tmp/engcalc-v091-wheel-venv
          rm -rf "$VENV"
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install --upgrade pip
          "$VENV/bin/python" -m pip install "$WHEEL" pytest ipython

      - name: External installed-wheel smoke
        shell: bash
        run: |
          mkdir -p /tmp/engcalc-v091-wheel-smoke
          cd /tmp/engcalc-v091-wheel-smoke
          env -u PYTHONPATH /tmp/engcalc-v091-wheel-venv/bin/python "$GITHUB_WORKSPACE/.github/scripts/v091_wheel_smoke.py" 2>&1 | tee "$GITHUB_WORKSPACE/v091-wheel-smoke.log"

      - name: Complete source-free installed-wheel suite
        shell: bash
        run: |
          set -o pipefail
          printf '[pytest]\n' > /tmp/engcalc-v091-source-free.ini
          env -u PYTHONPATH /tmp/engcalc-v091-wheel-venv/bin/python -c "import engcalc_colab,os,sys; p=os.path.realpath(engcalc_colab.__file__).replace('\\\\','/'); assert engcalc_colab.__version__=='0.9.1'; assert 'site-packages' in p and '/src/engcalc_colab/' not in p; assert not any(x.replace('\\\\','/').endswith('/src') for x in sys.path); print('SOURCE_FREE_MODULE_PATH='+p)"
          env -u PYTHONPATH /tmp/engcalc-v091-wheel-venv/bin/python -m pytest -c /tmp/engcalc-v091-source-free.ini tests -q 2>&1 | tee v091-source-free.log

      - name: Complete source suite after wheel validation
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee v091-source-after-wheel.log

      - name: Upload release-validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engcalc-0.9.1-release-validation
          path: |
            dist/engcalc_colab-0.9.1-py3-none-any.whl
            v091-release-contract.log
            v091-build.log
            v091-wheel-sha256.log
            v091-wheel-smoke.log
            v091-source-free.log
            v091-source-after-wheel.log
