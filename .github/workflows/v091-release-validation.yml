name: EngCalc 0.9.1 release validation

on:
  push:
    branches:
      - feature/v0.9.1-exact-characteristics

permissions:
  contents: write

jobs:
  release-green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test environment
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython

      - name: Apply guarded 0.9.1 release bump
        run: python .github/scripts/v091_release_bump.py

      - name: Check diff hygiene
        run: git diff --check

      - name: Run 0.9.1 release contract
        run: python -m pytest tests/test_version.py tests/test_packaging.py -q

      - name: Compile package
        run: python -m compileall -q src/engcalc_colab

      - name: Run complete source suite before wheel
        run: python -m pytest -q

      - name: Commit verified release metadata
        shell: bash
        run: |
          if git diff --quiet -- pyproject.toml src/engcalc_colab/__init__.py README.md; then
            echo 'No release metadata patch to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml src/engcalc_colab/__init__.py README.md
          git commit -m 'release: bump EngCalc to 0.9.1'
          git push origin HEAD:feature/v0.9.1-exact-characteristics
