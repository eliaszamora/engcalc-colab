name: EngCalc 0.9.0 Task 1 GREEN

on:
  push:
    branches:
      - feature/v0.9.0-matrix-cas
    paths:
      - .github/workflows/v090-task1-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.9.0-matrix-cas
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e '.[dev]' ipython
      - name: Apply minimal Task 1 implementation
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          matrix_syntax_b64 = ""
          Path('src/engcalc_colab/matrix_syntax.py').write_bytes(base64.b64decode(matrix_syntax_b64))

          models_path = Path('src/engcalc_colab/models.py')
          models = models_path.read_text(encoding='utf-8')
          marker = '@dataclass(frozen=True)\nclass ParsedStatement:'
          insert = '''@dataclass(frozen=True)\nclass ParsedMatrixLiteral:\n    rows: tuple[tuple[ast.Expression, ...], ...]\n\n\n@dataclass(frozen=True)\nclass MatrixLiteralBinding:\n    name: str\n    literal: ParsedMatrixLiteral\n\n\n@dataclass(frozen=True)\nclass ParsedStatement:'''
          assert models.count(marker) == 1
          models = models.replace(marker, insert, 1)
          old = '    display_options: tuple[tuple[str, str], ...] = ()\n\n    @property\n'
          new = '    display_options: tuple[tuple[str, str], ...] = ()\n    matrix_literals: tuple[MatrixLiteralBinding, ...] = ()\n\n    @property\n'
          assert models.count(old) == 1
          models = models.replace(old, new, 1)
          models_path.write_text(models, encoding='utf-8')

          parser_path = Path('src/engcalc_colab/parser.py')
          parser = parser_path.read_text(encoding='utf-8')
          old = 'from .errors import EngSyntaxError\nfrom .models import ParsedHeading, ParsedNarrative, ParsedNumericAssignment, ParsedStatement\n'
          new = 'from .errors import EngSyntaxError\nfrom .matrix_syntax import consume_matrix_statement, rewrite_matrix_literals\nfrom .models import ParsedHeading, ParsedNarrative, ParsedNumericAssignment, ParsedStatement\n'
          assert parser.count(old) == 1
          parser = parser.replace(old, new, 1)

          old = '''        if source.startswith("#"):\n            index += 1\n            continue\n        try:\n            numeric_assignment = _split_top_level_numeric_assignment(source)\n'''
          new = '''        if source.startswith("#"):\n            index += 1\n            continue\n        try:\n            statement_source, next_index = consume_matrix_statement(lines, index)\n            source = statement_source.strip()\n            numeric_assignment = _split_top_level_numeric_assignment(source)\n'''
          assert parser.count(old) == 1
          parser = parser.replace(old, new, 1)

          old = '''                pending_blank = False\n                index += 1\n                continue\n\n            lhs, rhs = _split_top_level_assignment(source)\n'''
          new = '''                pending_blank = False\n                index = next_index\n                continue\n\n            lhs, rhs = _split_top_level_assignment(source)\n'''
          assert parser.count(old) == 1
          parser = parser.replace(old, new, 1)

          old = '''            normalized = normalize_expression(rhs.strip())\n            try:\n                expression = ast.parse(normalized, mode="eval")\n            except SyntaxError as exc:\n                raise EngSyntaxError(f"line {line_no}: invalid syntax") from exc\n            _validate_ast(expression, line_no, piecewise_parameters=parameters)\n            display_options = _extract_display_options(expression)\n            statements.append(ParsedStatement(\n                line_no=line_no,\n                source=source,\n                target=target,\n                parameters=parameters,\n                expression=expression,\n                blank_before=pending_blank,\n                display_options=display_options,\n            ))\n            pending_blank = False\n            index += 1\n'''
          new = '''            normalized = normalize_expression(rhs.strip())\n            rewritten, matrix_literals = rewrite_matrix_literals(normalized, line_no)\n            try:\n                expression = ast.parse(rewritten, mode="eval")\n            except SyntaxError as exc:\n                raise EngSyntaxError(f"line {line_no}: invalid syntax") from exc\n            _validate_ast(expression, line_no, piecewise_parameters=parameters)\n            _validate_matrix_literal_bindings(\n                matrix_literals,\n                line_no,\n                piecewise_parameters=parameters,\n            )\n            display_options = _extract_display_options(expression)\n            statements.append(ParsedStatement(\n                line_no=line_no,\n                source=source,\n                target=target,\n                parameters=parameters,\n                expression=expression,\n                blank_before=pending_blank,\n                display_options=display_options,\n                matrix_literals=matrix_literals,\n            ))\n            pending_blank = False\n            index = next_index\n'''
          assert parser.count(old) == 1
          parser = parser.replace(old, new, 1)

          old = '''    _validate_normal_node(\n        tree,\n        line_no,\n        piecewise_parameters=piecewise_parameters,\n    )\n\n\ndef _validate_normal_node(\n'''
          new = '''    _validate_normal_node(\n        tree,\n        line_no,\n        piecewise_parameters=piecewise_parameters,\n    )\n\n\ndef _validate_matrix_literal_bindings(\n    bindings,\n    line_no: int,\n    *,\n    piecewise_parameters: tuple[str, ...] | None = None,\n) -> None:\n    for binding in bindings:\n        for row in binding.literal.rows:\n            for expression in row:\n                _validate_normal_node(\n                    expression,\n                    line_no,\n                    piecewise_parameters=piecewise_parameters,\n                )\n\n\ndef _validate_normal_node(\n'''
          assert parser.count(old) == 1
          parser = parser.replace(old, new, 1)

          old = '''    if isinstance(node, ast.List):\n        raise EngSyntaxError(f"line {line_no}: unsupported syntax 'List'")\n'''
          new = '''    if isinstance(node, ast.List):\n        if not node.elts:\n            raise EngSyntaxError(f"line {line_no}: matrix literal cannot be empty")\n        for element in node.elts:\n            if isinstance(element, ast.List):\n                raise EngSyntaxError(\n                    f"line {line_no}: nested matrix literals are unsupported"\n                )\n            _validate_normal_node(\n                element,\n                line_no,\n                piecewise_parameters=piecewise_parameters,\n            )\n        return\n'''
          assert parser.count(old) == 1
          parser = parser.replace(old, new, 1)
          parser_path.write_text(parser, encoding='utf-8')
          PY
          git diff --check
          python -m py_compile src/engcalc_colab/matrix_syntax.py src/engcalc_colab/models.py src/engcalc_colab/parser.py
      - name: Focused GREEN
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/test_matrix_parser.py tests/test_table_parser.py tests/test_plot_parser.py tests/test_envelope_parser.py -q 2>&1 | tee task1-focused.log
      - name: Full regression
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee task1-full.log
      - name: Commit GREEN implementation
        run: |
          git config user.name "eliaszamora"
          git config user.email "37598447+eliaszamora@users.noreply.github.com"
          git add src/engcalc_colab/matrix_syntax.py src/engcalc_colab/models.py src/engcalc_colab/parser.py
          git commit -m "feat: parse EngCalc matrix literals"
          git push origin HEAD:feature/v0.9.0-matrix-cas
      - uses: actions/upload-artifact@v4
        with:
          name: task1-green-logs
          path: |
            task1-focused.log
            task1-full.log
