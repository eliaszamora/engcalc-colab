name: EngCalc 0.7.2 Task 6 RED

on:
  push:
    branches:
      - feature/v0.7.2-engineering-tables
    paths:
      - tests/test_version.py
      - .github/workflows/v072-task6-red.yml

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython
      - name: Verify version contract is RED
        run: |
          set +e
          python -m pytest -q tests/test_version.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Version contract unexpectedly passed before the 0.7.2 bump."
            exit 1
          fi
          echo "Version contract failed as expected before the bump."
      - name: Verify table feature remains GREEN
        run: >-
          python -m pytest -q
          tests/test_table_parser.py
          tests/test_table_points.py
          tests/test_table_engine.py
          tests/test_table_rendering.py
          tests/test_table_acceptance.py
          tests/test_magic.py
      - name: Verify all pre-version tests remain GREEN
        run: python -m pytest -q --ignore=tests/test_version.py
