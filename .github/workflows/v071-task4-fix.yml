name: EngCalc 0.7.1 Task 4 Fix

on:
  push:
    branches:
      - feature/v0.7.1-multiarg-partial-eval

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.1-multiarg-partial-eval
          fetch-depth: 0
      - name: Apply regression fix
        run: python .github/scripts/v071_task4_fix.py
      - name: Commit product change
        run: |
          if git diff --quiet -- src/engcalc_colab/engine.py; then
            echo "No product change produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engcalc_colab/engine.py
          git commit -m "fix: preserve strict global dependencies in partial evaluation"
          git push origin HEAD:feature/v0.7.1-multiarg-partial-eval
