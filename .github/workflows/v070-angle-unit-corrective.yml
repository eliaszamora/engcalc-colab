name: v0.7.0 corrected distribution gate

on:
  push:
    branches:
      - feature/v0.7.0-scalar-engineering-math

jobs:
  distribution-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install source test and build environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install ipython build

      - name: Verify release metadata
        run: |
          python - <<'PY'
          import tomllib
          import engcalc_colab

          with open('pyproject.toml', 'rb') as handle:
              version = tomllib.load(handle)['project']['version']

          assert version == '0.7.0', version
          assert engcalc_colab.__version__ == '0.7.0', engcalc_colab.__version__
          print('release metadata: 0.7.0')
          PY

      - name: Focused corrected 0.7.0 contracts
        run: >-
          python -m pytest -q
          tests/test_release_version_v070.py
          tests/test_packaging.py
          tests/test_parser.py
          tests/test_scalar_math_parser.py
          tests/test_scalar_math_engine.py
          tests/test_scalar_math_numeric.py
          tests/test_scalar_math_acceptance.py
          tests/test_scalar_math_angle_units.py
          tests/test_magic.py

      - name: Complete source suite
        run: python -m pytest -q

      - name: Build real 0.7.0 wheel
        run: |
          rm -rf dist build
          python -m build --wheel --outdir dist
          test -f dist/engcalc_colab-0.7.0-py3-none-any.whl
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = Path('dist/engcalc_colab-0.7.0-py3-none-any.whl')
          assert wheel.is_file()
          with zipfile.ZipFile(wheel) as archive:
              metadata_name = next(
                  name for name in archive.namelist()
                  if name.endswith('.dist-info/METADATA')
              )
              metadata = archive.read(metadata_name).decode('utf-8')
          assert 'Version: 0.7.0\n' in metadata
          print(wheel.name)
          PY

      - name: Install wheel into clean virtual environment
        run: |
          rm -rf /tmp/engcalc-v070-corrected-wheel-venv
          python -m venv /tmp/engcalc-v070-corrected-wheel-venv
          /tmp/engcalc-v070-corrected-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/engcalc-v070-corrected-wheel-venv/bin/python -m pip install \
            dist/engcalc_colab-0.7.0-py3-none-any.whl pytest ipython

      - name: Installed-wheel smoke from outside repository
        run: |
          cd /tmp
          PYTHONPATH='' /tmp/engcalc-v070-corrected-wheel-venv/bin/python - <<'PY'
          from pathlib import Path

          import engcalc_colab
          from engcalc_colab.engine import EngineeringEngine
          from engcalc_colab.models import NumericEvaluationResult, PlotResult
          from engcalc_colab.parser import parse_cell
          from engcalc_colab.renderer import _quantity_latex

          package_file = Path(engcalc_colab.__file__).resolve()
          assert engcalc_colab.__version__ == '0.7.0'
          assert 'site-packages' in str(package_file), package_file
          assert 'engcalc-colab/src' not in str(package_file), package_file

          engine = EngineeringEngine()
          run = lambda source: engine.evaluate(parse_cell(source)[0])

          exact_angle = run('numeric(atan(1))')
          assert isinstance(exact_angle, NumericEvaluationResult)
          assert str(exact_angle.quantity.units) == 'radian'
          assert abs(exact_angle.quantity.to('rad').magnitude - 0.7853981633974483) < 1e-12
          assert 'rad' in _quantity_latex(exact_angle.quantity)

          degree_angle = run('numeric(atan(1), deg)')
          assert isinstance(degree_angle, NumericEvaluationResult)
          assert str(degree_angle.quantity.units) == 'degree'
          assert abs(degree_angle.quantity.to('deg').magnitude - 45.0) < 1e-10
          assert 'deg' in _quantity_latex(degree_angle.quantity)

          sin30 = run('s := sin(30*deg)')
          assert abs(sin30.quantity.magnitude - 0.5) < 1e-12

          root = run('r := sqrt(9*m^2)')
          assert abs(root.quantity.to('m').magnitude - 3.0) < 1e-12

          run('f(x) = A*sin(pi*x/L)')
          run('A := 10*mm')
          run('L := 4*m')
          midpoint = run('numeric(f(2*m), mm)')
          assert isinstance(midpoint, NumericEvaluationResult)
          assert abs(midpoint.quantity.to('mm').magnitude - 10.0) < 1e-10

          plot = run('plot(f(x), x, 0, L)')
          assert isinstance(plot, PlotResult)
          assert len(plot.x_values) == 201
          assert abs(plot.series[0].y_values[100].to('mm').magnitude - 10.0) < 1e-10

          print(f'corrected wheel smoke PASS: {package_file}')
          PY

      - name: Prepare source-free installed-wheel test copy
        run: |
          rm -rf /tmp/engcalc-v070-corrected-wheel-suite
          mkdir -p /tmp/engcalc-v070-corrected-wheel-suite
          tar \
            --exclude='./src' \
            --exclude='./.git' \
            --exclude='./dist' \
            --exclude='./build' \
            --exclude='./.pytest_cache' \
            -cf - . | tar -xf - -C /tmp/engcalc-v070-corrected-wheel-suite
          test ! -d /tmp/engcalc-v070-corrected-wheel-suite/src

      - name: Complete suite against installed wheel
        run: |
          cd /tmp/engcalc-v070-corrected-wheel-suite
          PYTHONPATH='' /tmp/engcalc-v070-corrected-wheel-venv/bin/python -m pytest -q

      - name: Repeat complete source suite
        run: python -m pytest -q

      - name: Upload validated corrected wheel
        uses: actions/upload-artifact@v4
        with:
          name: engcalc-colab-0.7.0-corrected-wheel
          path: dist/engcalc_colab-0.7.0-py3-none-any.whl
          if-no-files-found: error
