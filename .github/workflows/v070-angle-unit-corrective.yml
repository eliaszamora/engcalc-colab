name: v0.7.0 angle unit corrective

on:
  push:
    branches:
      - feature/v0.7.0-scalar-engineering-math

permissions:
  contents: write

jobs:
  angle-unit-red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install ipython

      - name: Apply minimal inverse-trig angle-unit corrective
        run: |
          python - <<'PY'
          from pathlib import Path

          engine_path = Path('src/engcalc_colab/engine.py')
          engine = engine_path.read_text()
          old_engine = '''        if name in _SCALAR_SYMBOLIC_FUNCTIONS:\n            self._require_arity(name, args, 1, "expression")\n            return _SCALAR_SYMBOLIC_FUNCTIONS[name](args[0])\n'''
          new_engine = '''        if name in _SCALAR_SYMBOLIC_FUNCTIONS:\n            self._require_arity(name, args, 1, "expression")\n            if name in {"asin", "acos", "atan"}:\n                return _SCALAR_SYMBOLIC_FUNCTIONS[name](args[0], evaluate=False)\n            return _SCALAR_SYMBOLIC_FUNCTIONS[name](args[0])\n'''
          if old_engine in engine:
              engine = engine.replace(old_engine, new_engine, 1)
              engine_path.write_text(engine)
          elif new_engine not in engine:
              raise SystemExit('engine corrective anchor not found')

          renderer_path = Path('src/engcalc_colab/renderer.py')
          renderer = renderer_path.read_text()
          old_renderer = '''    if getattr(quantity, "dimensionless", False):\n        return magnitude_latex\n\n    unit_latex = format(quantity.units, "~L")\n'''
          new_renderer = '''    unit_name = str(quantity.units)\n    if getattr(quantity, "dimensionless", False) and unit_name == "dimensionless":\n        return magnitude_latex\n\n    unit_latex = format(quantity.units, "~L")\n'''
          if old_renderer in renderer:
              renderer = renderer.replace(old_renderer, new_renderer, 1)
              renderer_path.write_text(renderer)
          elif new_renderer not in renderer:
              raise SystemExit('renderer corrective anchor not found')
          PY

          if git diff --quiet; then
            echo "corrective already applied"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/engcalc_colab/engine.py src/engcalc_colab/renderer.py
            git commit -m "fix: preserve inverse trig angle units"
            git push
          fi

      - name: Focused angle-unit and scalar contracts
        run: >-
          python -m pytest -q
          tests/test_scalar_math_angle_units.py
          tests/test_scalar_math_numeric.py
          tests/test_scalar_math_acceptance.py
          tests/test_magic.py

      - name: Complete source suite
        run: python -m pytest -q
