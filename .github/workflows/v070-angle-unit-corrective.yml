name: v0.7.0 angle unit corrective

on:
  push:
    branches:
      - feature/v0.7.0-scalar-engineering-math

jobs:
  angle-unit-red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install ipython
      - name: Angle unit regression contracts
        run: python -m pytest -q tests/test_scalar_math_angle_units.py
