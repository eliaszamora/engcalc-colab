name: v0.9.2 Task 13 Validation

on:
  push:
    branches:
      - feature/v0.9.2-audit-reliability

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize Task 13 candidate
        run: python .github/scripts/v092_task13_acceptance.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Compile source
        run: python -m compileall -q src/engcalc_colab
      - name: Run Task 13 focused acceptance
        run: python -m pytest tests/test_characteristics_acceptance.py tests/test_v092_audit_regressions.py -q
      - name: Verify envelope deferral acceptance
        run: python -m pytest tests/test_characteristics_plot_integration.py -q
      - name: Run complete source suite
        run: python -m pytest -q
      - name: Run hygiene and scope gates
        shell: bash
        run: |
          git diff --check
          changed=$(git status --porcelain | awk '{print $2}')
          unexpected=$(printf '%s\n' "$changed" | grep -Ev '^(README\.md|tests/test_characteristics_acceptance\.py|tests/test_characteristics_plot_integration\.py)$' || true)
          if [ -n "$unexpected" ]; then
            echo 'Unexpected Task 13 candidate paths:'
            echo "$unexpected"
            exit 1
          fi
          if git status --porcelain -- src/engcalc_colab | grep -q .; then
            echo 'Task 13 must not modify src/.'
            exit 1
          fi
          permanent_new=$(git diff --name-status origin/main...HEAD | awk '$1 == "A" && $2 ~ /^\.github\/workflows\// {print $2}' | grep -v '^\.github/workflows/v092-task13-validation\.yml$' || true)
          if [ "$permanent_new" != '.github/workflows/ci.yml' ]; then
            echo 'Unexpected permanent new workflow set:'
            echo "$permanent_new"
            exit 1
          fi
          git diff --name-status

  commit:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize Task 13 candidate
        run: python .github/scripts/v092_task13_acceptance.py
      - name: Record Task 13 closure context
        env:
          TASK13_RUN_ID: ${{ github.run_id }}
        run: python .github/scripts/v092_task13_context.py
      - name: Commit Task 13 acceptance and documentation
        shell: bash
        run: |
          git add -- README.md \
            tests/test_characteristics_acceptance.py \
            tests/test_characteristics_plot_integration.py \
            docs/project-context/CURRENT.md
          unexpected=$(git status --porcelain | awk '{print $2}' | grep -Ev '^(README\.md|tests/test_characteristics_acceptance\.py|tests/test_characteristics_plot_integration\.py|docs/project-context/CURRENT\.md)$' || true)
          if [ -n "$unexpected" ]; then
            echo 'Unexpected Task 13 working-tree paths:'
            echo "$unexpected"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'No Task 13 acceptance/docs patch to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: complete 0.9.2 reliability acceptance'
          git push origin HEAD:feature/v0.9.2-audit-reliability
