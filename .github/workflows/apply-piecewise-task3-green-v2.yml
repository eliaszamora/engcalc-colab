name: Apply Piecewise Task 3 GREEN v2

on:
  push:
    branches:
      - feature/v0.8.0-piecewise
    paths:
      - .github/workflows/apply-piecewise-task3-green-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.8.0-piecewise
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Apply and correct Task 3 patch
        run: |
          python - <<'PY'
          import base64
          import textwrap
          from pathlib import Path

          workflow = Path('.github/workflows/apply-piecewise-task3-green.yml').read_text()
          marker = "python - <<'PY'\n"
          embedded = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(textwrap.dedent(embedded), {})

          renderer = Path('src/engcalc_colab/renderer.py')
          text = renderer.read_text()
          start = text.index('def _piecewise_partial_latex')
          end = text.index('def _display_lhs', start)
          helper = base64.b64decode(
              ''
          ).decode()
          renderer.write_text(text[:start] + helper + text[end:])
          PY
          python -m py_compile src/engcalc_colab/models.py src/engcalc_colab/numeric.py src/engcalc_colab/engine.py src/engcalc_colab/renderer.py
          git diff --check
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]' ipython
      - name: Run focused Task 3 tests
        run: python -m pytest tests/test_piecewise_partial_numeric.py tests/test_piecewise_renderer.py -q
      - name: Commit Task 3 GREEN
        run: |
          git config user.name "eliaszamora"
          git config user.email "37598447+eliaszamora@users.noreply.github.com"
          git add src/engcalc_colab/models.py src/engcalc_colab/numeric.py src/engcalc_colab/engine.py src/engcalc_colab/renderer.py
          git commit -m "feat: render partial piecewise numeric evaluation"
          git push origin HEAD:feature/v0.8.0-piecewise
