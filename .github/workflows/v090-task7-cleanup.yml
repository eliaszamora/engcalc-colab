name: EngCalc 0.9.0 Task 7 Cleanup

on:
  push:
    branches:
      - feature/v0.9.0-matrix-cas
    paths:
      - .github/workflows/v090-task7-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.9.0-matrix-cas
      - name: Remove temporary harnesses
        run: |
          git rm .github/workflows/v090-task7-red.yml
          git rm .github/workflows/v090-task7-green.yml
          git rm .github/scripts/v090_task7_apply.py
          git rm .github/scripts/v090_task6_context.py
          git rm .github/workflows/v090-task7-cleanup.yml
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "eliaszamora"
          git config user.email "37598447+eliaszamora@users.noreply.github.com"
          git commit -m "chore: remove Matrix CAS Task 7 harnesses"
          git push origin HEAD:feature/v0.9.0-matrix-cas
