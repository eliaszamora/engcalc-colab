name: EngCalc 0.7.1 Task 6 Verify

on:
  push:
    branches:
      - feature/v0.7.1-multiarg-partial-eval

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]' ipython
      - name: Run focused plot/envelope integration gate
        run: pytest tests/test_plot_engine.py tests/test_envelope_engine.py tests/test_multiarg_acceptance.py -q
      - name: Run complete source suite
        run: pytest -q
