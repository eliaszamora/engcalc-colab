name: EngCalc 0.9.1 Task 8 TDD

on:
  push:
    branches:
      - feature/v0.9.1-exact-characteristics

permissions:
  contents: write

jobs:
  task8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test environment
        run: python -m pip install -e '.[dev]'

      # Re-run idempotently after the verified engine product commit.
      - name: Apply guarded Task 8 GREEN patch when needed
        shell: bash
        run: |
          if grep -q '^class _CharacteristicEvaluation:' src/engcalc_colab/engine.py; then
            echo 'Task 8 engine dispatch already present; skipping patch.'
          else
            python .github/scripts/v091_task8_green.py
          fi

      - name: Check diff hygiene
        run: git diff --check

      - name: Run Task 8 focused regression gate
        run: >-
          python -m pytest
          tests/test_characteristics_engine.py
          tests/test_characteristics_roots.py
          tests/test_characteristics_intersections.py
          tests/test_characteristics_extrema.py
          tests/test_characteristics_piecewise_extrema.py
          tests/test_diagnostics.py
          tests/test_matrix_indexing.py
          tests/test_matrix_user_functions.py
          -q

      - name: Commit verified Task 8 product patch
        shell: bash
        run: |
          if git diff --quiet -- src/engcalc_colab/engine.py; then
            echo 'No product patch to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engcalc_colab/engine.py
          git commit -m 'feat: dispatch characteristic analysis from engine'
          git push origin HEAD:feature/v0.9.1-exact-characteristics
