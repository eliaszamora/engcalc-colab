name: v0.9.2 Task 11 GREEN

on:
  push:
    branches:
      - feature/v0.9.2-audit-reliability

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Materialize Task 11 candidate
        run: python .github/scripts/v092_task11_green.py
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install project with declared dependencies
        run: python -m pip install -e '.[dev]'
      - name: Report resolved runtime
        run: |
          python -c "import sys; print('RESOLVED_PYTHON=' + sys.version.split()[0])"
          python -c "import IPython; print('RESOLVED_IPYTHON=' + IPython.__version__)"
      - name: Compile
        run: python -m compileall -q src/engcalc_colab
      - name: Run Task 11 metadata contract
        run: python -m pytest tests/test_packaging_metadata.py -q
      - name: Run complete source suite
        run: python -m pytest -q

  commit:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize Task 11 candidate
        run: python .github/scripts/v092_task11_green.py
      - name: Verify and commit Task 11 product
        shell: bash
        run: |
          git add \
            pyproject.toml \
            tests/test_packaging.py \
            tests/test_packaging_metadata.py \
            tests/test_version.py \
            .github/workflows/ci.yml
          unexpected=$(git status --porcelain | awk '{print $2}' | grep -Ev '^(pyproject.toml|tests/test_packaging.py|tests/test_packaging_metadata.py|tests/test_version.py|\.github/workflows/ci.yml)$' || true)
          if [ -n "$unexpected" ]; then
            echo 'Unexpected Task 11 working-tree paths:'
            echo "$unexpected"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'No Task 11 product or test patch to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: validate EngCalc across Python 3.10 to 3.14'
          git push origin HEAD:feature/v0.9.2-audit-reliability
