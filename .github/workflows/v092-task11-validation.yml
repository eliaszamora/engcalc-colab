name: v0.9.2 Task 11 RED

on:
  push:
    branches:
      - feature/v0.9.2-audit-reliability
    paths:
      - .github/workflows/v092-task11-validation.yml

jobs:
  task11-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install current project
        run: python -m pip install -e '.[dev]'
      - name: Materialize Task 11 metadata RED contract
        shell: bash
        run: |
          cat > tests/test_packaging_metadata.py <<'PY'
          import pathlib
          import tomllib


          def test_project_metadata_declares_notebook_runtime_and_python_floor():
              root = pathlib.Path(__file__).resolve().parents[1]
              data = tomllib.loads(
                  (root / "pyproject.toml").read_text(encoding="utf-8")
              )
              project = data["project"]
              assert project["requires-python"] == ">=3.10"
              assert "ipython>=8.18" in project["dependencies"]
          PY
      - name: Run Task 11 metadata RED
        run: python -m pytest tests/test_packaging_metadata.py -q
