name: v0.9.2 Task 6 GREEN

on:
  push:
    branches:
      - feature/v0.9.2-audit-reliability

permissions:
  contents: write

jobs:
  task6-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]' ipython
      - name: Apply Task 6 product and persistent test patch
        run: python .github/scripts/v092_task6_green.py
      - name: Apply Task 6 structural zero-bound corrective
        run: python .github/scripts/v092_task6_corrective2.py
      - name: Compile
        run: python -m compileall -q src/engcalc_colab
      - name: Run Task 6 public contracts
        run: |
          python -m pytest \
            tests/test_characteristics_engine.py \
            tests/test_characteristics_plot_integration.py \
            -q -k 'direct_unit_literal or direct_unit_literals or plot_accepts_direct_unit_literal_bounds'
      - name: Run focused Task 6 regression
        run: |
          python -m pytest \
            tests/test_numeric_context.py \
            tests/test_characteristics_engine.py \
            tests/test_characteristics_roots.py \
            tests/test_characteristics_plot_integration.py \
            tests/test_plotting.py -q
      - name: Run table regression
        run: python -m pytest tests/test_engineering_tables.py -q
      - name: Run complete source suite
        run: python -m pytest -q
      - name: Commit Task 6 patch
        shell: bash
        run: |
          if git diff --quiet -- src/engcalc_colab tests; then
            echo 'No Task 6 product or test patch to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/engcalc_colab/numeric.py \
            src/engcalc_colab/characteristics.py \
            src/engcalc_colab/engine.py \
            tests/test_numeric_context.py \
            tests/test_characteristics_engine.py \
            tests/test_characteristics_plot_integration.py
          git commit -m 'fix: centralize direct unit literal bounds'
          git push origin HEAD:feature/v0.9.2-audit-reliability
