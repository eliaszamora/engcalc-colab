name: v0.9.2 Task 6 IDEMPOTENT

on:
  push:
    branches:
      - feature/v0.9.2-audit-reliability

permissions:
  contents: write

jobs:
  task6-idempotent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]' ipython
      - name: Verify Task 6 product is already materialized
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          checks = {
              'src/engcalc_colab/numeric.py': [
                  'def unit_literal_overrides(',
                  'if name in fixed or name in self.values:',
              ],
              'src/engcalc_colab/characteristics.py': [
                  'lower_quantity=None,',
                  'upper_quantity=None,',
                  'context.unit_literal_overrides(candidate, fixed_overrides)',
              ],
              'src/engcalc_colab/engine.py': [
                  'def _resolve_domain_numeric_value(',
                  'lower_quantity=lower_quantity,',
                  'upper_quantity=upper_quantity,',
                  'return self._resolve_domain_numeric_value(node)',
              ],
              'tests/test_numeric_context.py': [
                  'def test_unit_literal_overrides_respects_explicit_and_stored_precedence():',
              ],
              'tests/test_characteristics_engine.py': [
                  'def test_direct_unit_literals_are_consistent_across_domain_bearing_apis():',
                  'def test_direct_unit_literal_bounds_reject_incompatible_domain_units():',
              ],
              'tests/test_characteristics_plot_integration.py': [
                  'def test_plot_accepts_direct_unit_literal_bounds():',
              ],
          }
          missing = []
          for filename, needles in checks.items():
              text = Path(filename).read_text()
              for needle in needles:
                  if needle not in text:
                      missing.append(f'{filename}: {needle}')
          if missing:
              raise SystemExit('Task 6 product tree is incomplete:\n' + '\n'.join(missing))
          print('Task 6 product tree is already fully materialized.')
          PY
      - name: Compile
        run: python -m compileall -q src/engcalc_colab
      - name: Run Task 6 public contracts
        run: |
          python -m pytest \
            tests/test_characteristics_engine.py \
            tests/test_characteristics_plot_integration.py \
            -q -k 'direct_unit_literal or direct_unit_literals or plot_accepts_direct_unit_literal_bounds'
      - name: Run focused Task 6 regression
        run: |
          python -m pytest \
            tests/test_numeric_context.py \
            tests/test_characteristics_engine.py \
            tests/test_characteristics_roots.py \
            tests/test_characteristics_plot_integration.py \
            tests/test_plotting.py -q
      - name: Run table regression
        run: |
          python -m pytest \
            tests/test_table_acceptance.py \
            tests/test_table_engine.py \
            tests/test_table_parser.py \
            tests/test_table_points.py \
            tests/test_piecewise_table.py -q
      - name: Run complete source suite
        run: python -m pytest -q
      - name: Verify no second Task 6 product patch
        shell: bash
        run: |
          if git diff --quiet -- src/engcalc_colab tests; then
            echo 'No Task 6 product or test patch to commit.'
            exit 0
          fi
          echo 'Unexpected Task 6 product/test diff after idempotent verification:'
          git diff -- src/engcalc_colab tests
          exit 1
