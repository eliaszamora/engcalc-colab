name: EngCalc 0.9.0 Task 10 release GREEN

on:
  push:
    branches:
      - feature/v0.9.0-matrix-cas
    paths:
      - .github/workflows/v090-task10-release-green.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.9.0-matrix-cas
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply 0.9.0 release candidate
        run: python .github/scripts/v090_task10_apply.py

      - name: Audit release candidate diff
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q src/engcalc_colab
          git diff --check
          test "$(git diff --name-only | sort)" = $'README.md\npyproject.toml\nsrc/engcalc_colab/__init__.py'
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Install release candidate tooling
        run: python -m pip install -e '.[dev]' ipython build

      - name: Release-contract GREEN
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/test_version.py tests/test_packaging.py tests/test_parser.py -q 2>&1 | tee task10-release-contract.log

      - name: Complete source suite GREEN before wheel
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee task10-source-before-wheel.log

      - name: Build and inspect wheel
        shell: bash
        run: |
          set -o pipefail
          rm -rf dist build
          python -m build --wheel 2>&1 | tee task10-build.log
          WHEEL="$(find dist -maxdepth 1 -type f -name 'engcalc_colab-0.9.0-py3-none-any.whl' -print -quit)"
          test -n "$WHEEL"
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          echo "WHEEL=$WHEEL" >> "$GITHUB_ENV"
          python - "$WHEEL" <<'PY'
          import sys
          import zipfile
          wheel = sys.argv[1]
          with zipfile.ZipFile(wheel) as archive:
              metadata_names = [name for name in archive.namelist() if name.endswith('.dist-info/METADATA')]
              assert len(metadata_names) == 1, metadata_names
              metadata = archive.read(metadata_names[0]).decode('utf-8')
          assert '\nVersion: 0.9.0\n' in '\n' + metadata, metadata
          print('WHEEL_METADATA_VERSION=0.9.0')
          PY
          sha256sum "$WHEEL" | tee task10-wheel-sha256.log

      - name: Validate installed wheel from external environment
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          set -o pipefail
          VENV=/tmp/engcalc-wheel-venv
          SMOKE=/tmp/engcalc-wheel-smoke
          rm -rf "$VENV" "$SMOKE"
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install --upgrade pip
          "$VENV/bin/python" -m pip install "$WHEEL" pytest ipython
          mkdir -p "$SMOKE"
          cd "$SMOKE"
          env -u PYTHONPATH "$VENV/bin/python" - <<'PY' 2>&1 | tee "$GITHUB_WORKSPACE/task10-wheel-smoke.log"
          import os
          import sympy as sp
          import engcalc_colab
          from engcalc_colab.engine import EngineeringEngine
          from engcalc_colab.models import NumericMatrixEvaluationResult
          from engcalc_colab.parser import parse_cell
          from engcalc_colab.plotting import render_plot

          assert engcalc_colab.__version__ == '0.9.0'
          module_path = os.path.realpath(engcalc_colab.__file__)
          assert 'site-packages' in module_path, module_path
          assert '/src/engcalc_colab/' not in module_path.replace('\\', '/'), module_path
          print(f'INSTALLED_MODULE_PATH={module_path}')

          def run(engine, source):
              return [engine.evaluate(statement) for statement in parse_cell(source)][-1]

          exact = EngineeringEngine()
          assert run(exact, 'r = [a, b, c]').value.shape == (1, 3)
          assert run(exact, 'v = [a; b; c]').value.shape == (3, 1)
          run(exact, 'A = [1, 2; 3, 5]')
          inverse = run(exact, 'Ai = inv(A)').value
          assert sp.simplify(inverse * exact.namespace['A'] - sp.eye(2)) == sp.zeros(2)
          assert run(exact, 'entry = A[1,2]').value == 2
          run(exact, 'Fmat(x) = [x, 0; 0, 2*x]')
          assert run(exact, 'B = Fmat(3)').value == sp.ImmutableMatrix([[3, 0], [0, 6]])

          structural = EngineeringEngine()
          run(structural, 'K = [k1+k2, -k2; -k2, k2]')
          run(structural, 'F = [P; 0]')
          run(structural, 'u = solve(K, F)')
          run(structural, 'k1 := 20*kN/mm')
          run(structural, 'k2 := 15*kN/mm')
          run(structural, 'P := 30*kN')
          u_numeric = run(structural, 'numeric(u)')
          assert isinstance(u_numeric, NumericMatrixEvaluationResult)
          assert abs(u_numeric.quantity_matrix.entry(0, 0).to('mm').magnitude - 1.5) < 1e-12
          assert abs(u_numeric.quantity_matrix.entry(1, 0).to('mm').magnitude - 1.5) < 1e-12

          beam = EngineeringEngine()
          run(beam, 'E := 200*GPa')
          run(beam, 'I := 450e6*mm^4')
          run(beam, 'L := 6000*mm')
          run(beam, 'K = [12*E*I/L^3, 6*E*I/L^2; 6*E*I/L^2, 4*E*I/L]')
          k_numeric = run(beam, 'numeric(K)')
          assert abs(k_numeric.quantity_matrix.entry(0, 0).to('kN/mm').magnitude - 5.0) < 1e-9
          assert abs(k_numeric.quantity_matrix.entry(0, 1).to('kN').magnitude - 15000.0) < 1e-6
          assert abs(k_numeric.quantity_matrix.entry(1, 1).to('kN*mm').magnitude - 60000000.0) < 1e-3

          pw = EngineeringEngine()
          run(pw, 'k1 := 10*kN/mm')
          run(pw, 'k2 := 20*kN/mm')
          run(pw, 'L := 2*m')
          run(pw, 'Kp(x) = [piecewise(k1, x < L/2, k2), 0; 0, k1]')
          kp = run(pw, 'numeric(Kp(1.5*m))')
          assert abs(kp.quantity_matrix.entry(0, 0).to('kN/mm').magnitude - 20.0) < 1e-12

          plot_engine = EngineeringEngine()
          run(plot_engine, 'M(x) = -q*L^2/8 + 5*q*L*x/8 - q*x^2/2')
          run(plot_engine, 'q := 2.8*tonf/m')
          run(plot_engine, 'L := 4*m')
          plot_result = run(plot_engine, 'plot(M(x), x, 0, L)')
          axis = render_plot(plot_result).axes[0]
          assert axis.yaxis_inverted()
          print('WHEEL_SMOKE=PASS')
          PY

      - name: Complete source-free installed-wheel suite
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          set -o pipefail
          VENV=/tmp/engcalc-wheel-venv
          printf '[pytest]\n' > /tmp/engcalc-source-free.ini
          env -u PYTHONPATH "$VENV/bin/python" - <<'PY'
          import os
          import sys
          import engcalc_colab
          path = os.path.realpath(engcalc_colab.__file__).replace('\\', '/')
          assert 'site-packages' in path, path
          assert '/src/engcalc_colab/' not in path, path
          assert not any(item.replace('\\', '/').endswith('/src') for item in sys.path), sys.path
          print(f'SOURCE_FREE_MODULE_PATH={path}')
          print('SOURCE_FREE_SYS_PATH_OK=1')
          PY
          env -u PYTHONPATH "$VENV/bin/python" -m pytest -c /tmp/engcalc-source-free.ini tests -q 2>&1 | tee task10-source-free.log

      - name: Complete source suite GREEN after wheel validation
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee task10-source-after-wheel.log

      - name: Commit authoritative 0.9.0 release tree
        run: |
          git config user.name "eliaszamora"
          git config user.email "37598447+eliaszamora@users.noreply.github.com"
          git add README.md pyproject.toml src/engcalc_colab/__init__.py
          git diff --cached --check
          git commit -m "release: bump EngCalc to 0.9.0"
          git push origin HEAD:feature/v0.9.0-matrix-cas

      - uses: actions/upload-artifact@v4
        with:
          name: engcalc-0.9.0-release-validation
          path: |
            dist/engcalc_colab-0.9.0-py3-none-any.whl
            task10-release-contract.log
            task10-source-before-wheel.log
            task10-build.log
            task10-wheel-sha256.log
            task10-wheel-smoke.log
            task10-source-free.log
            task10-source-after-wheel.log
