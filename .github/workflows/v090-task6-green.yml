name: EngCalc 0.9.0 Task 6 GREEN

on:
  push:
    branches:
      - feature/v0.9.0-matrix-cas
    paths:
      - .github/workflows/v090-task6-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.9.0-matrix-cas
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e '.[dev]' ipython
      - name: Apply implementation
        run: python .github/scripts/v090_task6_apply.py
      - name: Validate patch
        run: |
          python -m compileall -q src/engcalc_colab
          git diff --check
          test "$(git diff --name-only | sort)" = $'src/engcalc_colab/engine.py\nsrc/engcalc_colab/matrix_solve.py'
      - name: Focused GREEN
        run: python -m pytest tests/test_matrix_solve.py tests/test_engine.py -q 2>&1 | tee task6-focused.log
      - name: Full regression
        run: python -m pytest -q 2>&1 | tee task6-full.log
      - name: Commit implementation
        run: |
          git config user.name "eliaszamora"
          git config user.email "37598447+eliaszamora@users.noreply.github.com"
          git add src/engcalc_colab/engine.py src/engcalc_colab/matrix_solve.py
          git commit -m "feat: solve exact linear matrix systems"
          git push origin HEAD:feature/v0.9.0-matrix-cas
      - uses: actions/upload-artifact@v4
        with:
          name: task6-green-logs
          path: |
            task6-focused.log
            task6-full.log
