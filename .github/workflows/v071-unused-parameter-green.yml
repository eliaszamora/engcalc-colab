name: EngCalc 0.7.1 unused-parameter GREEN

on:
  push:
    branches:
      - feature/v0.7.1-multiarg-partial-eval

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.1-multiarg-partial-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply minimal unused-parameter corrective
        run: python .github/scripts/apply_v071_unused_parameter_fix.py
      - name: Install test environment
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython
      - name: Focused numeric and partial regression
        run: >-
          python -m pytest -q
          tests/test_multiarg_numeric.py
          tests/test_partial_numeric_general.py
          tests/test_numeric_function_arguments.py
      - name: Complete source suite
        run: python -m pytest -q
      - name: Commit product corrective and remove temporary tooling
        run: |
          if git diff --quiet -- src/engcalc_colab/engine.py; then
            echo "expected engine corrective was not produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engcalc_colab/engine.py
          git rm .github/scripts/apply_v071_unused_parameter_fix.py
          git rm .github/workflows/v071-unused-parameter-green.yml
          git commit -m "fix: ignore unused unresolved numeric parameters"
          git push origin HEAD:feature/v0.7.1-multiarg-partial-eval
