name: EngCalc 0.7.2 Task 6 docs GREEN

on:
  push:
    branches:
      - feature/v0.7.2-engineering-tables
    paths:
      - .github/workflows/v072-task6-doc-green.yml

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython
      - name: Verify release version and documentation contracts
        run: python -m pytest -q tests/test_version.py
