name: Temporary EngCalc 0.4.0 validation

on:
  push:
    branches:
      - feature/multicurve-plot-v0.4.0

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 81d743a14592412f7170306f3f6514e9f1b298c5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install baseline and test dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'ipython>=8'
      - name: Verify EngCalc 0.3.3 baseline
        run: pytest -q

  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install current branch and test dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'ipython>=8'
      - name: Run current plot parser and parser regressions
        run: pytest -q tests/test_plot_parser.py tests/test_parser.py

  current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install current branch and test dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'ipython>=8'
      - name: Run current full test suite
        run: pytest -q
