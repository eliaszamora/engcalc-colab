name: EngCalc 0.9.1 Task 3 full gate

on:
  push:
    branches:
      - feature/v0.9.1-exact-characteristics

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install complete test environment
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ipython

      - name: Compile package
        run: python -m compileall -q src/engcalc_colab

      - name: Check branch diff hygiene against main
        run: git diff --check origin/main...HEAD

      - name: Run characteristic and Piecewise regression gate
        run: python -m pytest tests/test_characteristics_*.py tests/test_piecewise_*.py -q

      - name: Run complete suite
        run: python -m pytest -q
