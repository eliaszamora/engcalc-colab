[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engcalc-colab"
version = "0.25.0"
description = "Compact symbolic and unit-aware engineering calculations for Google Colab and Jupyter"
requires-python = ">=3.10"
# The IPython floor is Colab's own pin, not the newest release. Colab installs
# ipython==7.34.0, so a floor above it makes `%pip install engcalc-colab` upgrade
# IPython underneath the platform this package exists for, and pip says so:
#
#   google-colab 1.0.0 requires ipython==7.34.0, but you have ipython 9.17.1
#
# Nothing here needs a newer one. The whole IPython surface is `Magics`, `cell_magic`,
# `line_magic`, `magics_class`, `HTML`, `Math` and `display` - API that has been stable
# since IPython 1.x. The full suite passes against 7.34.0, and CI keeps checking it.
dependencies = ["sympy>=1.13", "pint>=0.24", "matplotlib>=3.8", "ipython>=7.34"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis==6.167.1",
    # Read by tests/test_quality_gate_workflow.py. Declared rather than relied on
    # transitively: that test guards an automation whose absence is invisible, so it
    # must not be the kind of test that quietly skips.
    "pyyaml>=6",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "." is required so quality_tests.helpers resolves under bare `pytest` and in
# historical-sensitivity runs executed from another working directory, not only
# under `python -m pytest`, which prepends the working directory itself.
pythonpath = ["src", "."]
testpaths = ["tests", "quality_tests/fast"]
markers = [
    "evidence_a: constructive oracle known independently before EngCalc executes",
    "evidence_b: internal invariant evidence, complementary",
    "evidence_c: metamorphic evidence, complementary",
    "quality_deep: exploratory Hypothesis quality-gate test",
]
